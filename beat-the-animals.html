<script>
(function () {
"use strict";

/* =========================================================

   Levels 1-10: one of each animal, easiest to hardest.
   Level 11 onwards: 2, 3, 4... elephants, forever.
   Coins per animal: 2, 10, 30, 40 ... 100.

   Wood > Stone > Copper > Gold > Iron > Diamond > Netherite
   ========================================================= */

const W = 960, H = 540, GROUND = 452;
const FONT = '"Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif';
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------------- data ---------------- */

const SHOP_TOP = 11;
const SWORD_DMG = [1, 2, 3, 5, 7, 10, 14, 20, 27, 36, 48, 65];
const SHIELD_BLOCK = [40, 55, 65, 75, 85, 92, 100, 100, 100, 100, 100, 100];   // % of damage blocked
const SHIELD_BOUNCE = [0, 0, 0, 0, 0, 0, 0, 0.5, 1, 1.5, 2, 3];               // secret shields bounce damage back
const ARMOUR_HP = [10, 14, 18, 24, 30, 38, 48, 60, 75, 92, 112, 140];
const COSTS = [0, 10, 40, 100, 250, 500, 1000, 2000, 3500, 5500, 8000, 12000];

const RAINBOW = ["#ff5d5d", "#ffa14d", "#ffe14d", "#5ddc6a", "#4db8ff", "#9a6bff"];

// easiest to hardest. coins as the designer asked: 2, 10, 30, 40 ... 100, then the new jungle animals

  { name: "Parrot",    plural: "Parrots",    coins: 10,  hp: 6,   dmg: 1, speed: 120, w: 40,  h: 44,  range: 50, windup: 0.55, cd: 1.5, lunge: 260, fly: true },
  { name: "Monkey",    plural: "Monkeys",    coins: 30,  hp: 12,  dmg: 2, speed: 130, w: 44,  h: 66,  range: 50, windup: 0.5,  cd: 1.3, lunge: 260, hop: true },
  { name: "Snake",     plural: "Snakes",     coins: 40,  hp: 18,  dmg: 2, speed: 140, w: 76,  h: 30,  range: 60, windup: 0.45, cd: 1.2, lunge: 320 },
  { name: "Crocodile", plural: "Crocodiles", coins: 50,  hp: 28,  dmg: 3, speed: 75,  w: 130, h: 40,  range: 60, windup: 0.6,  cd: 1.6, lunge: 220, jaw: true },
  { name: "Jaguar",    plural: "Jaguars",    coins: 60,  hp: 40,  dmg: 4, speed: 175, w: 96,  h: 62,  range: 70, windup: 0.5,  cd: 1.3, lunge: 400 },
  { name: "Gorilla",   plural: "Gorillas",   coins: 70,  hp: 60,  dmg: 5, speed: 95,  w: 84,  h: 112, range: 60, windup: 0.75, cd: 1.6, lunge: 280 },
  { name: "Rhino",     plural: "Rhinos",     coins: 80,  hp: 85,  dmg: 6, speed: 95,  w: 140, h: 86,  range: 80, windup: 0.75, cd: 1.8, lunge: 480 },
  { name: "Hippo",     plural: "Hippos",     coins: 90,  hp: 110, dmg: 7, speed: 75,  w: 140, h: 90,  range: 70, windup: 0.7,  cd: 1.7, lunge: 280, jaw: true },
  { name: "Elephant",  plural: "Elephants",  coins: 100, hp: 150, dmg: 8, speed: 65,  w: 160, h: 150, range: 80, windup: 0.85, cd: 2.0, lunge: 260 },
  // ---- the new jungle animals ----
  { name: "Tiger",           coins: 110, hp: 160, dmg: 9,  speed: 185, w: 100, h: 66,  range: 70, windup: 0.5,  cd: 1.3, lunge: 420 },
  { name: "Panther",         coins: 120, hp: 190, dmg: 10, speed: 210, w: 96,  h: 62,  range: 70, windup: 0.42, cd: 1.1, lunge: 460 },
  { name: "Anaconda",        coins: 130, hp: 230, dmg: 10, speed: 150, w: 120, h: 44,  range: 70, windup: 0.45, cd: 1.2, lunge: 360 },
  { name: "Komodo Dragon",   coins: 140, hp: 270, dmg: 11, speed: 95,  w: 124, h: 42,  range: 60, windup: 0.55, cd: 1.4, lunge: 300, jaw: true },
  { name: "Harpy Eagle",     coins: 150, hp: 300, dmg: 11, speed: 150, w: 56,  h: 56,  range: 60, windup: 0.5,  cd: 1.3, lunge: 320, fly: true },
  { name: "Giant Tarantula", coins: 160, hp: 340, dmg: 12, speed: 125, w: 84,  h: 52,  range: 60, windup: 0.55, cd: 1.4, lunge: 300, hop: true },
  { name: "Silverback King", coins: 180, hp: 400, dmg: 13, speed: 100, w: 96,  h: 130, range: 60, windup: 0.7,  cd: 1.5, lunge: 300, king: true },
  { name: "Crocodile King",  coins: 200, hp: 460, dmg: 14, speed: 85,  w: 160, h: 54,  range: 70, windup: 0.6,  cd: 1.5, lunge: 260, jaw: true, king: true },
  { name: "Lioness",         coins: 210, hp: 500, dmg: 15, speed: 200, w: 100, h: 64,  range: 70, windup: 0.45, cd: 1.2, lunge: 440 },
  { name: "King Lion",       coins: 250, hp: 650, dmg: 18, speed: 155, w: 134, h: 100, range: 80, windup: 0.6,  cd: 1.3, lunge: 470, king: true }
];
const LAST_ANIMAL_LEVEL = ANIMALS.length;   // 20
// levels 1-20: one animal each. after that: Legend levels, one golden animal at a time, getting stronger forever
function levelInfo(n) {
  if (n <= LAST_ANIMAL_LEVEL) return { kind: n - 1, count: 1, mult: 1, legend: false };
  return { kind: 10 + ((n * 7) % 10), count: 1, mult: Math.pow(1.18, n - LAST_ANIMAL_LEVEL), legend: true };
}
function animalName(info) { return (info.legend ? "Legend " : "") + ANIMALS[info.kind].name; }

/* ---------------- save ---------------- */
const SAVE_KEY = "beatTheAnimals.v1";
const S = { coins: 0, sword: 0, shield: 0, armour: 0, maxLevel: 1, muted: false, beat: [], v: 3 };
function clampInt(v, lo, hi, def) { v = Math.floor(Number(v)); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }
(function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
  if (!d || typeof d !== "object") return;
  S.coins = clampInt(d.coins, 0, 1e9, 0);
  S.sword = clampInt(d.sword, 0, MATS.length - 1, 0);
  S.shield = clampInt(d.shield, 0, MATS.length - 1, 0);
  S.armour = clampInt(d.armour, 0, MATS.length - 1, 0);
  S.maxLevel = clampInt(d.maxLevel, 1, 100000, 1);
  S.muted = !!d.muted;
  S.coins += clampInt(d.chests, 0, 9999, 0) * OLD_CHEST_VALUE;   // chests were removed: unopened ones become coins
  if (Array.isArray(d.beat)) S.beat = d.beat.filter(k => Number.isInteger(k) && k >= 0 && k < ANIMALS.length);
  // version 1 had "herds" after level 10. They're gone: those levels are new animals now.
  if (!d.v && S.maxLevel > 11) S.maxLevel = 11;
})();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- screen ---------------- */
let scale = 1, offX = 0, offY = 0, dpr = 1, vw = W, vh = H;
const bgC = document.createElement("canvas");
let bgK = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  buildBG();
}
window.addEventListener("resize", resize);

/* ---------------- helpers ---------------- */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }
function starPath(g, cx, cy, r1, r2, n) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath();
}
function txt(s, x, y, size, color, align, stroke, sw) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  if (stroke) { ctx.lineJoin = "round"; ctx.strokeStyle = stroke; ctx.lineWidth = sw || Math.max(3, size / 6); ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function drawCoin(x, y, r, spin) {
  const sx = Math.max(0.15, Math.abs(Math.cos(spin || 0)));
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  ctx.fillStyle = "#c8901a"; circle(0, 0, r);
  ctx.fillStyle = "#f7c843"; circle(0, 0, r * 0.8);
  ctx.fillStyle = "#ffe48a"; circle(-r * 0.22, -r * 0.22, r * 0.3);
  ctx.restore();
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const sign = (v) => v >= 0 ? 1 : -1;
function fmt(n) { return String(Math.ceil(n * 10) / 10).replace(/\.0$/, ""); }

/* ---------------- background (jungle) ---------------- */
function buildBG() {
  const k = Math.max(1, scale * dpr);
  if (Math.abs(k - bgK) < 0.01 && bgC.width) return;
  bgK = k;
  bgC.width = Math.round(W * k); bgC.height = Math.round(H * k);
  const g = bgC.getContext("2d");
  g.setTransform(k, 0, 0, k, 0, 0);
  paintBG(g);
}
function leaf(g, x, y, len, ang, col) {
  g.save(); g.translate(x, y); g.rotate(ang);
  g.fillStyle = col;
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.5, -len * 0.32, len, 0); g.quadraticCurveTo(len * 0.5, len * 0.32, 0, 0); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.15)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(2, 0); g.lineTo(len - 4, 0); g.stroke();
  g.restore();
}
function paintBG(g) {
  const R = mulberry(11);
  let gr = g.createLinearGradient(0, 0, 0, GROUND);
  gr.addColorStop(0, "#bfeee0"); gr.addColorStop(0.5, "#8fd6a8"); gr.addColorStop(1, "#5fae73");
  g.fillStyle = gr; g.fillRect(0, 0, W, GROUND);
  // sun rays
  g.save(); g.globalAlpha = 0.18; g.fillStyle = "#fffbe0";
  for (let i = 0; i < 5; i++) {
    const x = 120 + i * 190;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 50, 0); g.lineTo(x + 200, GROUND); g.lineTo(x + 110, GROUND); g.closePath(); g.fill();
  }
  g.restore();
  // far trees
  function trees(base, col, n, hmin, hmax, wide) {
    for (let i = 0; i < n; i++) {
      const x = R() * W, h = hmin + R() * (hmax - hmin), tw = 10 + R() * 10;
      g.fillStyle = col; g.fillRect(x - tw / 2, base - h, tw, h);
      for (let j = 0; j < 5; j++) { g.beginPath(); g.ellipse(x + (R() - 0.5) * wide, base - h + (R() - 0.3) * 40, wide * (0.35 + R() * 0.3), 26 + R() * 18, 0, 0, 7); g.fill(); }
    }
  }
  trees(GROUND - 40, "#6fbf86", 9, 220, 320, 120);
  trees(GROUND - 10, "#4f9e68", 8, 200, 300, 110);
  // canopy along the top
  g.fillStyle = "#2f7a48";
  for (let x = -40; x < W + 60; x += 46) { g.beginPath(); g.ellipse(x, 6 + R() * 18, 46, 34 + R() * 14, 0, 0, 7); g.fill(); }
  g.fillStyle = "#3d8f56";
  for (let x = -20; x < W + 60; x += 58) { g.beginPath(); g.ellipse(x, -4 + R() * 12, 40, 30, 0, 0, 7); g.fill(); }
  // vines
  for (let i = 0; i < 9; i++) {
    const x = 40 + i * 110 + R() * 50, len = 90 + R() * 160;
    g.strokeStyle = "#2c6b3f"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, 20);
    g.bezierCurveTo(x + 14, 20 + len * 0.3, x - 14, 20 + len * 0.7, x + 4, 20 + len); g.stroke();
    for (let y = 40; y < len; y += 26) leaf(g, x + Math.sin(y * 0.05) * 6, 20 + y, 16, R() < 0.5 ? 0.6 : Math.PI - 0.6, "#3f9256");
  }
  // bushes behind ground
  g.fillStyle = "#3f8f52";
  for (let x = -20; x < W + 40; x += 60) { g.beginPath(); g.ellipse(x + R() * 30, GROUND - 6, 50, 26 + R() * 14, 0, Math.PI, 0); g.fill(); }
  // flowers
  for (let i = 0; i < 14; i++) {
    const x = R() * W, y = GROUND - 14 - R() * 20;
    g.fillStyle = ["#ff6fa4", "#ffd23f", "#ff8a3d", "#c86bff"][Math.floor(R() * 4)];
    for (let p = 0; p < 5; p++) { const a = p * 1.256; g.beginPath(); g.arc(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3.2, 0, 7); g.fill(); }
    g.fillStyle = "#fff6c2"; g.beginPath(); g.arc(x, y, 2.4, 0, 7); g.fill();
  }
  // ground
  gr = g.createLinearGradient(0, GROUND, 0, H);
  gr.addColorStop(0, "#7a5532"); gr.addColorStop(1, "#4a321d");
  g.fillStyle = gr; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = "#4e9e3e"; g.fillRect(0, GROUND - 3, W, 11);
  g.fillStyle = "#62b54f";
  for (let x = 0; x < W; x += 8) { g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x + 4, GROUND - 6 - R() * 6); g.lineTo(x + 8, GROUND); g.fill(); }
  g.fillStyle = "rgba(0,0,0,0.16)";
  for (let i = 0; i < 40; i++) { g.beginPath(); g.ellipse(R() * W, GROUND + 22 + R() * (H - GROUND - 30), 3 + R() * 6, 2 + R() * 3, 0, 0, 7); g.fill(); }
  // big front leaves in the corners
  for (let i = 0; i < 6; i++) leaf(g, -10, H + 10, 120 + i * 8, -0.4 - i * 0.18, i % 2 ? "#2f7a48" : "#3a8f55");
  for (let i = 0; i < 6; i++) leaf(g, W + 10, H + 10, 120 + i * 8, Math.PI + 0.4 + i * 0.18, i % 2 ? "#2f7a48" : "#3a8f55");
}

/* ---------------- audio ---------------- */
let AC = null, noiseBuf = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
}
function tone(freq, dur, type, vol, slide, at) {
  if (S.muted || !AC) return;
  try {
    const t = AC.currentTime + (at || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function whoosh(vol, freq) {
  if (S.muted || !AC) return;
  try {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(freq * 0.6, t); f.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.14);
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + 0.18);
  } catch (e) {}
}
const sfx = {
  swing() { whoosh(0.18, 1400); },
  hit() { tone(160, 0.1, "square", 0.07, -70); },
  clang() { tone(900, 0.12, "triangle", 0.08, -300); tone(1350, 0.1, "triangle", 0.05, -400); },
  hurt() { tone(260, 0.28, "sawtooth", 0.08, -160); },
  warn() { tone(660, 0.07, "square", 0.035); },
  beat() { [523, 659, 784].forEach((f, i) => tone(f, 0.1, "square", 0.05, 0, i * 0.06)); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, "square", 0.05, 0, i * 0.09)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, "triangle", 0.08, 0, i * 0.14)); },
  buy() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "square", 0.05, 0, i * 0.07)); },
  no() { tone(130, 0.18, "square", 0.06); tone(110, 0.2, "square", 0.06, 0, 0.12); },
  click() { tone(880, 0.05, "triangle", 0.06); },
  rumble() { for (let i = 0; i < 8; i++) tone(120 + i * 30, 0.1, "square", 0.04, 0, i * 0.12); },
  fanfare() { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "square", 0.05, 0, i * 0.11)); }
};

/* ---------------- state ---------------- */
let state = "title", prevState = "title", endT = 0, time = 0, shake = 0, coinBump = 0;
let selLevel = Math.max(1, S.maxLevel);
let touchMode = false;
try { touchMode = window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
let shopMsg = null;
const P = { x: 200, face: 1, swingT: 0, swingHit: false, hp: 10, walkT: 0, moving: false, kx: 0, hurt: 0, block: false, blockFlash: 0 };
const SPEED = 230, SWING_DUR = 0.3;
let animals = [], parts = [], pops = [], flyCoins = [];
const L = { n: 1, kind: 0, queue: 0, spawnT: 0, earned: 0, beaten: 0, total: 1, doneT: 0, mult: 1, legend: false, intro: "", introSub: "", introT: 0 };
function baseState() { return state === "shop" ? prevState : state; }

function maxHp() { return ARMOUR_HP[S.armour]; }
function startLevel(n) {
  ensureAudio(); sfx.click();
  const info = levelInfo(n), A = ANIMALS[info.kind];
  L.n = n; L.kind = info.kind; L.queue = info.count; L.total = info.count; L.spawnT = 0.4; L.earned = 0; L.beaten = 0; L.doneT = 0;
  L.mult = info.mult; L.legend = info.legend;
  L.intro = info.legend ? "LEGEND LEVEL!" : A.king ? A.name.toUpperCase() + "!" : (info.kind >= 10 && S.beat.indexOf(info.kind) < 0) ? "NEW ANIMAL!" : "Level " + n;
  L.introSub = info.legend ? "A golden " + A.name + " appears..." : A.king ? "The " + A.name + " rules this part of the jungle!" : "The " + A.name;
  L.introT = 2.4;
  animals = []; parts = []; pops = []; flyCoins = [];

function goLevels() { sfx.click(); animals = []; parts = []; pops = []; flyCoins = []; selLevel = Math.min(Math.max(1, selLevel), S.maxLevel); state = "levels"; }
function openShop() { if (state === "shop") return; sfx.click(); prevState = state; state = "shop"; shopMsg = null; }

/* ---------------- input ---------------- */
const keys = { left: false, right: false, swing: false, block: false };
const ptr = new Map();

window.addEventListener("keydown", (e) => {

document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

let ui = [];
function addBtn(x, y, w, h, fn) { ui.push({ x, y, w, h, fn }); }
function toLogical(e) {

}
const TB = {
  left:  { x: 70,      y: 472, r: 42 },
  right: { x: 172,     y: 472, r: 42 },
  block: { x: W - 212, y: 474, r: 44 },
  swing: { x: W - 86,  y: 460, r: 58 }

function changeSel(d) {
  const n = Math.max(1, Math.min(S.maxLevel, selLevel + d));

/* ---------------- shop ---------------- */
const ITEM_NAMES = { sword: "Sword", shield: "Shield", armour: "Armour" };
function buy(item) {
  const tier = S[item];
  if (tier >= SHOP_TOP) return;
  const c = COSTS[tier + 1];
  if (S.coins < c) { sfx.no(); shopMsg = { text: "Not enough coins yet. Keep beating animals!", t: 1.8 }; return; }
  S.coins -= c; S[item]++;

  sfx.buy();
  shopMsg = { text: (MATS[S[item]].secret ? "SECRET! " : "") + "You got " + MATS[S[item]].name + " " + ITEM_NAMES[item].toLowerCase() + "!", t: 2.2 };

}

}

/* ---------------- gameplay ---------------- */
function trySwing() {
  if (state !== "play" || P.swingT > 0 || P.block) return;
  if (!held("left") && !held("right")) {
    let best = null, bd = 1e9;
    for (const a of animals) { if (a.dead) continue; const d = Math.abs(a.x - P.x) - ANIMALS[a.k].w / 2; if (d < bd) { bd = d; best = a; } }
    if (best && bd < 220) P.face = best.x >= P.x ? 1 : -1;

}
function spawnAnimal() {
  const A = ANIMALS[L.kind];

  animals.push({
    k: L.kind, x: fromRight ? W + A.w / 2 + 10 : -A.w / 2 - 10, face: fromRight ? -1 : 1,
    hp: Math.round(A.hp * L.mult), max: Math.round(A.hp * L.mult), mult: L.mult, legend: L.legend, st: "approach", stT: 0, flash: 0, kb: 0, t: Math.random() * 5,
    alt: A.fly ? 95 : 0, hopT: 0, hit: false, dead: false, deadT: 0, entered: false

}
function burst(x, y, color, n, spd, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(0.3, 1) * (spd || 200);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rand(0.35, 0.7), max: 0.7, color, size: rand(2, 4.5), grav: grav == null ? 500 : grav });

}
function leafPuff(x, y, s) {
  for (let i = 0; i < 14; i++) {
    parts.push({ x: x + rand(-20, 20) * s, y: y + rand(-30, 10) * s, vx: rand(-80, 80), vy: rand(-160, -40), life: rand(0.5, 0.9), max: 0.9, color: ["#5fbf5a", "#3f9256", "#a6e07a", "#ffd23f"][i % 4], size: rand(4, 8) * s, grav: 180, leafy: true, rot: Math.random() * 6 });
  }
}
function popup(x, y, text, color, size) { pops.push({ x, y, text, color, size: size || 24, life: 0.95 }); }
function animalTop(a) { const A = ANIMALS[a.k]; return GROUND - a.alt - A.h; }
function beatAnimal(a) {
  const A = ANIMALS[a.k];
  a.dead = true; a.deadT = 0;
  L.beaten++;
  const coins = Math.round(A.coins * (a.mult || 1));
  S.coins += coins; L.earned += coins; coinBump = 1;
  sfx.beat();
  leafPuff(a.x, GROUND - a.alt - A.h / 2, Math.min(2, A.w / 70));
  popup(a.x, animalTop(a) - 10, "+" + coins + " coins", "#ffd23f", 26);
  const n = Math.min(10, 2 + Math.floor(A.coins / 12));
  for (let i = 0; i < n; i++) flyCoins.push({ x: a.x + rand(-20, 20), y: GROUND - a.alt - A.h / 2 + rand(-15, 15), t: -i * 0.04, sx: 0, sy: 0 });
  if (S.beat.indexOf(a.k) < 0) S.beat.push(a.k);
  if (A.w > 120) shake = Math.max(shake, 8);
  save();
}

function doHit() {
  const dmg = SWORD_DMG[S.sword];
  let any = false;
  for (const a of animals) {
    if (a.dead) continue;
    const A = ANIMALS[a.k];
    const rel = (a.x - P.x) * P.face;
    if (rel > -12 && rel < 66 + A.w / 2) {
      a.hp -= dmg; a.flash = 0.12; any = true;
      a.kb = P.face * 190 * Math.min(1, 50 / A.w);
      if (a.k <= 3 && a.st === "windup") { a.st = "back"; a.stT = 0.3; }
      popup(a.x + rand(-10, 10), animalTop(a) - 22, String(dmg), "#ffffff", 26);
      burst(a.x - P.face * A.w * 0.3, GROUND - a.alt - A.h * 0.5, MATS[S.sword].l, 7, 220);
      if (a.hp <= 0) beatAnimal(a);
    }
  }
  if (any) { sfx.hit(); shake = Math.max(shake, 3); }
}
function hitPlayer(a) {
  const A = ANIMALS[a.k];
  const dmgIn = A.dmg * (a.mult || 1);
  const facing = (a.x - P.x) * P.face > 0;
  if (P.block && facing) {
    const d = dmgIn * (1 - SHIELD_BLOCK[S.shield] / 100);
    P.hp -= d; P.blockFlash = 0.25;
    sfx.clang();
    burst(P.x + P.face * 26, GROUND - 52, "#fff6c2", 10, 240);
    popup(P.x + P.face * 10, GROUND - 130, d > 0 ? "Blocked! -" + fmt(d) : "Blocked!", "#9fe8ff", 22);
    P.kx = -P.face * 140;
    a.kb = P.face * 220 * Math.min(1, 60 / A.w);
    const bounce = Math.round(SWORD_DMG[S.sword] * SHIELD_BOUNCE[S.shield]);
    if (bounce > 0) {
      a.hp -= bounce; a.flash = 0.15;
      popup(a.x, animalTop(a) - 22, "BOUNCE " + bounce + "!", MATS[S.shield].l, 24);
      if (a.hp <= 0) beatAnimal(a);
    }
  } else {
    P.hp -= dmgIn; P.hurt = 0.4; shake = 9;
    sfx.hurt();
    burst(P.x, GROUND - 60, "#ff5a6a", 10, 200);
    popup(P.x, GROUND - 130, "-" + fmt(dmgIn), "#ff6b7a", 26);
    P.kx = sign(P.x - a.x) * 330;
  }
  if (P.hp <= 0.001) {
    P.hp = 0; state = "lose"; endT = 0; sfx.lose(); save();

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);
  coinBump = Math.max(0, coinBump - dt * 4);
  if (shopMsg) { shopMsg.t -= dt; if (shopMsg.t <= 0) shopMsg = null; }
  for (const p of parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot != null) p.rot += dt * 6; }
  parts = parts.filter(p => p.life > 0);
  if (state === "win" || state === "lose") endT += dt;
  L.introT = Math.max(0, L.introT - dt);
  if (state !== "play" && state !== "win" && state !== "lose") return;

  for (const p of pops) { p.life -= dt; p.y -= 50 * dt; }
  pops = pops.filter(p => p.life > 0);
  for (const c of flyCoins) {
    c.t += dt;
    if (c.t > 0) {
      if (!c.sx) { c.sx = c.x; c.sy = c.y; }
      const u = Math.min(1, c.t / 0.6), e = u * u;
      c.x = c.sx + (34 - c.sx) * e; c.y = c.sy + (70 - c.sy) * e - Math.sin(u * Math.PI) * 80;
      if (u >= 1) c.done = true;
    }
  }
  flyCoins = flyCoins.filter(c => !c.done);

  for (const a of animals) {
    const A = ANIMALS[a.k];
    a.t += dt; a.flash = Math.max(0, a.flash - dt);
    if (a.dead) { a.deadT += dt; continue; }
    a.x += a.kb * dt; a.kb *= Math.pow(0.02, dt);
    const dx = P.x - a.x, gap = Math.abs(dx) - A.w / 2 - 16;
    if (state !== "play") { a.st = "rest"; a.stT = 1; }
    switch (a.st) {
      case "approach":
        a.face = sign(dx);
        if (gap > A.range || !a.entered) { a.x += a.face * A.speed * (gap > 220 ? 2.6 : 1) * dt; if (A.hop) a.hopT += dt; }
        else { a.st = "windup"; a.stT = A.windup; sfx.warn(); }
        break;
      case "windup":
        a.stT -= dt;
        if (a.stT <= 0) { a.st = "lunge"; a.stT = 0.24; a.hit = false; a.lungeT = 0; }
        break;
      case "lunge":
        a.stT -= dt; a.lungeT += dt;
        if (gap > 2) a.x += a.face * A.lunge * dt;
        if (!a.hit && gap < 8) { a.hit = true; hitPlayer(a); a.st = "back"; a.stT = 0.35; }
        else if (a.stT <= 0) { a.st = "back"; a.stT = 0.35; }
        break;
      case "back":
        a.stT -= dt; a.x -= a.face * A.speed * 0.7 * dt;
        if (a.stT <= 0) { a.st = "rest"; a.stT = A.cd * rand(0.6, 1.1); }
        break;
      case "rest":
        a.stT -= dt; a.face = sign(dx);
        if (a.stT <= 0 && state === "play") a.st = "approach";
        break;
    }
    // altitude: flyers hover and swoop, hoppers bounce
    if (A.fly) {
      const target = a.st === "lunge" ? 34 : a.st === "windup" ? 118 : 95 + Math.sin(a.t * 2) * 8;

    } else if (A.hop) {
      a.alt = a.st === "lunge" ? Math.sin(Math.min(1, a.lungeT / 0.24) * Math.PI) * 34 : a.st === "approach" ? Math.abs(Math.sin(a.hopT * 7)) * 20 : Math.max(0, a.alt - dt * 120);
    }
    const lo = A.w / 2 + 4, hi = W - A.w / 2 - 4;
    if (!a.entered && a.x >= lo && a.x <= hi) a.entered = true;
    if (a.entered) a.x = Math.max(lo, Math.min(hi, a.x));
  }
  animals = animals.filter(a => !a.dead || a.deadT < 0.8);
  if (state !== "play") return;

  // player
  P.hurt = Math.max(0, P.hurt - dt);
  P.blockFlash = Math.max(0, P.blockFlash - dt);
  P.block = held("block") && P.swingT <= 0;
  let dir = 0;
  if (held("left")) dir -= 1;
  if (held("right")) dir += 1;
  P.moving = dir !== 0;
  if (dir && !P.block) { P.face = dir; }
  if (dir) P.walkT += dt;
  P.x += (dir * (P.block ? SPEED * 0.4 : SPEED) + P.kx) * dt;
  P.kx *= Math.pow(0.02, dt);
  P.x = Math.max(28, Math.min(W - 28, P.x));
  if (P.swingT > 0) {

  } else if (held("swing")) trySwing();

  const alive = animals.reduce((n, a) => n + (a.dead ? 0 : 1), 0);
  if (L.queue > 0) {

    if (L.spawnT <= 0 && alive < 3) { spawnAnimal(); L.spawnT = 1.6; }
  } else if (alive === 0) {
    L.doneT += dt;
    if (L.doneT > 0.9) {
      state = "win"; endT = 0;
      if (L.n >= S.maxLevel) S.maxLevel = L.n + 1;
      selLevel = Math.min(L.n + 1, S.maxLevel);

    }
  }
}

  txt("Choose a level", W / 2, 34, 30, "#ffffff", "center", "#13301d", 7);
  drawBackButton(16, 12, "Back", () => { sfx.click(); state = "title"; });
  drawShopButton(W - 144, 12, 130, 44);
  const tw = 86, th = 78, gap = 4, x0 = (W - (tw * 10 + gap * 9)) / 2;
  const cur = levelInfo(selLevel);
  for (let i = 0; i < 20; i++) {
    const row = Math.floor(i / 10), x = x0 + (i % 10) * (tw + gap), y0 = 64 + row * (th + 6);
    const unlocked = i + 1 <= S.maxLevel, sel = !cur.legend && cur.kind === i;
    ctx.fillStyle = sel ? "#f2b632" : unlocked ? (ANIMALS[i].king ? "rgba(90,60,10,0.85)" : "rgba(20,60,35,0.85)") : "rgba(0,0,0,0.45)";
    rr(ctx, x, y0, tw, th, 12); ctx.fill();
    if (unlocked || i < 10) drawAnimalIcon(i, x + tw / 2, y0 + 32, tw - 16, 44, time, !unlocked);
    if (!unlocked) {
      ctx.fillStyle = "rgba(0,0,0,0.5)"; rr(ctx, x, y0, tw, th, 12); ctx.fill();
      if (i >= 10) txt("?", x + tw / 2, y0 + 32, 30, "#cfd8d0", "center");
      else { ctx.fillStyle = "#cfd8d0"; rr(ctx, x + tw / 2 - 10, y0 + 28, 20, 16, 4); ctx.fill(); ctx.strokeStyle = "#cfd8d0"; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(x + tw / 2, y0 + 28, 7, Math.PI, 0); ctx.stroke(); }
    }
    if (ANIMALS[i].king && unlocked) { ctx.save(); ctx.translate(x + tw - 14, y0 + 12); ctx.scale(0.5, 0.5); ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-16, -20); ctx.lineTo(-8, -10); ctx.lineTo(0, -24); ctx.lineTo(8, -10); ctx.lineTo(16, -20); ctx.lineTo(14, 0); ctx.closePath(); ctx.fill(); ctx.restore(); }
    txt(String(i + 1), x + 12, y0 + 12, 13, sel ? "#3a2508" : "#ffffff", "center");
    const nm = unlocked ? ANIMALS[i].name : "?";
    ctx.font = "bold 12px " + FONT; let fs = 12; while (fs > 8 && ctx.measureText(nm).width > tw - 6) { fs--; ctx.font = "bold " + fs + "px " + FONT; }
    txt(nm, x + tw / 2, y0 + th - 11, fs, sel ? "#3a2508" : "#ffffff", "center");
    if (unlocked) addBtn(x, y0, tw, th, () => { if (selLevel !== i + 1) { selLevel = i + 1; sfx.click(); } });
  }
  // selected level
  const A = ANIMALS[cur.kind];
  const bx = 150, by = 236, bw = W - 300, bh = 222;
  ctx.fillStyle = cur.legend ? "rgba(70,50,8,0.92)" : "rgba(20,60,35,0.92)"; rr(ctx, bx, by, bw, bh, 20); ctx.fill();
  ctx.strokeStyle = cur.legend ? "#ffd23f" : "#f2b632"; ctx.lineWidth = 3; ctx.stroke();
  txt("Level " + selLevel + (cur.legend ? " · LEGEND" : ""), W / 2, by + 28, 30, cur.legend ? "#ffd23f" : "#ffffff", "center", "#13301d", 6);
  const canL = selLevel > 1, canR = selLevel < S.maxLevel;
  [[bx + 16, -1, canL], [bx + bw - 76, 1, canR]].forEach(([x, d, on]) => {
    ctx.fillStyle = on ? "#2f9e55" : "rgba(255,255,255,0.12)"; rr(ctx, x, by + 66, 60, 70, 14); ctx.fill();
    ctx.fillStyle = on ? "#fff" : "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.moveTo(x + 30 + d * 12, by + 101); ctx.lineTo(x + 30 - d * 10, by + 84); ctx.lineTo(x + 30 - d * 10, by + 118); ctx.closePath(); ctx.fill();
    if (on) addBtn(x, by + 66, 60, 70, () => changeSel(d));
  });
  if (cur.legend) { ctx.save(); ctx.shadowColor = "#ffd23f"; ctx.shadowBlur = 20; }
  drawAnimalIcon(cur.kind, W / 2, by + 98, 220, 100, time, false);
  if (cur.legend) ctx.restore();
  txt(animalName(cur), W / 2, by + 166, 22, "#ffe48a", "center", "#13301d", 5);
  txt("Gives " + Math.round(A.coins * cur.mult) + " coins", W / 2, by + 192, 15, "#eaffe0", "center");
  bigButton(W / 2 - 110, by + bh - 4, 220, 52, "PLAY", "#2f9e55", () => startLevel(selLevel), 26);
  if (selLevel < S.maxLevel) {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; rr(ctx, bx + bw - 170, by + 12, 154, 34, 10); ctx.fill();
    txt("Newest level ▶▶", bx + bw - 93, by + 29, 15, "#fff", "center");
    addBtn(bx + bw - 170, by + 12, 154, 34, () => { selLevel = S.maxLevel; sfx.click(); });
  }
}

function drawEnd() {
  const a = Math.min(1, endT * 2), win = baseState() === "win";
  ctx.fillStyle = "rgba(8,30,16," + (0.55 * a).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const s = 1 + Math.max(0, 0.4 - endT) * 1.5;
  ctx.save(); ctx.translate(W / 2, 120); ctx.scale(s, s);
  if (win) txt("You beat level " + L.n + "!", 0, 0, 58, "#ffd23f", "center", "#5a3a00", 11);
  else txt("Oh no!", 0, 0, 72, "#ff6b7a", "center", "#3a0d14", 12);
  ctx.restore();
  const A = ANIMALS[L.kind];
  if (win) {
    txt("You earned " + L.earned + " coins", W / 2, 186, 26, "#ffffff", "center", "#13301d", 6);
    const next = levelInfo(L.n + 1), NA = ANIMALS[next.kind];
    const nextNew = next.kind >= 10 && !next.legend && S.beat.indexOf(next.kind) < 0;
    txt("Next up: " + (nextNew ? "a NEW animal..." : next.legend ? "a Legend level!" : "the " + NA.name), W / 2, 212, 19, "#eaffe0", "center", "#13301d", 4);
  } else {
    txt("The " + animalName(levelInfo(L.n)) + " got you this time.", W / 2, 186, 26, "#ffffff", "center", "#13301d", 6);
    txt(L.earned > 0 ? "You still keep the " + L.earned + " coins you won." : "Try your best! A shop upgrade might help.", W / 2, 222, 19, "#eaffe0", "center", "#13301d", 4);
    txt("Tip: hold the shield when you see the  !", W / 2, 252, 17, "#ffe48a", "center", "#13301d", 4);
  }
  if (endT > 0.7) {
    const nextN = Math.min(L.n + 1, S.maxLevel);
    if (win) bigButton(W / 2 - 330, 290, 210, 62, "Next level", "#2f9e55", () => startLevel(nextN), 24);
    else bigButton(W / 2 - 330, 290, 210, 62, "Try again", "#2f9e55", () => startLevel(L.n), 24);
    bigButton(W / 2 - 105, 290, 210, 62, "Shop", "#c4871a", openShop, 24);
    bigButton(W / 2 + 120, 290, 210, 62, "Levels", "#3a7bd5", goLevels, 24);
    if (!touchMode) txt("SPACE: " + (win ? "next level" : "try again") + " · U: shop · L: levels", W / 2, 400, 15, "#d6f5c8", "center", "#13301d", 3);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- shop screen ---------------- */
const PX = 50, PY = 30, PW = 860, PH = 470;
function buyButton(x, y, w, cost, maxed, fn, key) {
  const can = !maxed && S.coins >= cost;
  ctx.fillStyle = can ? "#2f9e55" : "#4f6b58"; rr(ctx, x, y, w, 46, 12); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.2)"; rr(ctx, x, y + 40, w, 6, 3); ctx.fill();
  if (maxed) txt("MAXED OUT!", x + w / 2, y + 22, 18, "#fff", "center");
  else { drawCoin(x + w / 2 - 34, y + 22, 10, 0); txt(String(cost), x + w / 2 - 18, y + 22, 20, can ? "#fff" : "#c9d6cc", "left"); }
  if (!touchMode && key) txt(key, x + w - 14, y + 22, 12, "rgba(255,255,255,0.6)", "center");
  addBtn(x, y, w, 46, fn);
}
function drawShop() {
  ctx.fillStyle = "rgba(5,20,10,0.6)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#16402a"; rr(ctx, PX, PY, PW, PH, 22); ctx.fill();
  ctx.strokeStyle = "#f2b632"; ctx.lineWidth = 3; ctx.stroke();
  txt("Shop", PX + 30, PY + 40, 32, "#ffffff", "left", "#0b2416", 6);
  drawCoin(PX + PW - 200, PY + 40, 14, time * 2);
  txt(String(S.coins), PX + PW - 180, PY + 41, 28, "#ffe48a", "left", "#3a2508", 6);
  const cx = PX + PW - 58, cy = PY + 16;
  ctx.fillStyle = "#d63a3a"; rr(ctx, cx, cy, 44, 44, 12); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineCap = "round";
  line(cx + 14, cy + 14, cx + 30, cy + 30); line(cx + 30, cy + 14, cx + 14, cy + 30);
  addBtn(cx, cy, 44, 44, closeShop);
  const items = [
    { key: "sword", title: "Sword", stat: (t) => SWORD_DMG[t] + " damage", draw: (t) => { ctx.rotate(-0.6); ctx.translate(-30, 0); ctx.scale(1.5, 1.5); drawSword(t, time); } },
    { key: "shield", title: "Shield", stat: (t) => "blocks " + SHIELD_BLOCK[t] + "%" + (SHIELD_BOUNCE[t] ? " + bounces back" : ""), draw: (t) => { ctx.scale(1.7, 1.7); drawShield(t, time); } },
    { key: "armour", title: "Armour", stat: (t) => ARMOUR_HP[t] + " health", draw: (t) => { ctx.scale(2, 2); drawChestplate(t, time); } }
  ];
  const y = PY + 76, h = 284, gap = 18, w = (PW - 48 - gap * 2) / 3;
  items.forEach((it, i) => {
    const x = PX + 24 + i * (w + gap), tier = S[it.key], maxed = tier >= SHOP_TOP;
    ctx.fillStyle = "#1f5236"; rr(ctx, x, y, w, h, 16); ctx.fill();
    ctx.strokeStyle = MATS[tier].secret ? "#ff9ad8" : "#2f7a48"; ctx.lineWidth = 2; ctx.stroke();
    txt(it.title, x + w / 2, y + 26, 22, "#fff", "center");
    ctx.save(); ctx.translate(x + w / 2, y + 96); it.draw(tier); ctx.restore();
    txt("Now: " + MATS[tier].name, x + w / 2, y + 154, 17, MATS[tier].secret ? "#ff9ad8" : "#ffffff", "center");
    txt(it.stat(tier), x + w / 2, y + 178, 14, "#eaffe0", "center");
    if (maxed) txt("The best there is!", x + w / 2, y + 204, 15, "#ffd23f", "center");
    else if (MATS[tier + 1].secret) txt("Next: ??? a secret one!", x + w / 2, y + 204, 15, "#ff9ad8", "center");
    else txt("Next: " + MATS[tier + 1].name + " · " + it.stat(tier + 1), x + w / 2, y + 204, 14, "#b8f28f", "center");
    buyButton(x + 22, y + 222, w - 44, maxed ? 0 : COSTS[tier + 1], maxed, () => buy(it.key), String(i + 1));
  });
  // upgrade order strip: secret ones stay hidden until you own one
  const best = Math.max(S.sword, S.shield, S.armour);
  const sy = y + h + 16, sw = (PW - 48) / MATS.length;
  txt("Upgrade order", PX + 30, sy, 14, "#b9dcc4", "left");
  MATS.forEach((M, i) => {
    const mx = PX + 24 + sw * i + sw / 2, hidden = M.secret && i > best;
    if (hidden) { ctx.fillStyle = "#3a1f5a"; rr(ctx, mx - sw / 2 + 3, sy + 14, sw - 6, 22, 8); ctx.fill(); txt("?", mx, sy + 26, 14, "#ff9ad8", "center"); }
    else {
      ctx.fillStyle = M.rainbow ? "#ff9ad8" : M.c; rr(ctx, mx - sw / 2 + 3, sy + 14, sw - 6, 22, 8); ctx.fill();
      ctx.strokeStyle = M.d; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = "bold 11px " + FONT; let fs = 11; while (fs > 7 && ctx.measureText(M.name).width > sw - 10) { fs--; ctx.font = "bold " + fs + "px " + FONT; }
      txt(M.name, mx, sy + 26, fs, i === 6 || i === 9 ? "#fff" : "#1d1b2e", "center");
    }
  });
  if (shopMsg) {
    ctx.globalAlpha = Math.min(1, shopMsg.t * 3);
    txt(shopMsg.text, W / 2, PY + PH + 18, 19, "#ffe48a", "center", "#0b2416", 6);
    ctx.globalAlpha = 1;
  } else if (!touchMode) txt("1, 2, 3 to buy · U or Esc to go back", W / 2, PY + PH + 18, 13, "#b9dcc4", "center", "#0b2416", 4);
}

/* ---------------- render ---------------- */
function render() {
  ui = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b2416"; ctx.fillRect(0, 0, vw, vh);
  if (vh > vw * 1.1) {
    ctx.font = "bold 16px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = "#d6f5c8";
    ctx.fillText("Turn your phone sideways for a bigger game ↻", vw / 2, Math.max(30, offY / 2));
  }
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (shake > 0 && state === "play") ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  const base = baseState();
  const shopOpen = state === "shop";
  drawWorld();
  if (base === "title") drawTitle();
  else if (base === "levels") drawLevels();
  else { drawHUD(); if (base === "play") drawTouchControls(); else drawEnd(); }
  if (shopOpen) { ui = []; drawShop(); }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// hook for automated testing
window.__bta = { S, P, L, get state() { return state; }, get animals() { return animals; }, startLevel, openShop, closeShop, buy, goLevels };
})();
</script>
</body>
