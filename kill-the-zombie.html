<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Kill the Zombie: swing your sword, collect coins and upgrade from Wood all the way to Netherite!">
<title>Kill the Zombie</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0a1f; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
"use strict";

/* =========================================================
   KILL THE ZOMBIE
   Side-view sword game. Beat zombies, grab coins, upgrade
   your sword (Wood -> Netherite), your coin drops and your
   hearts, and decorate your stickman and sword.
   ========================================================= */

const W = 960, H = 540, GROUND = 448;
const FONT = '"Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif';
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------------- data ---------------- */
const SWORDS = [
  { name: "Wood",      dmg: 1,  cost: 0,   blade: "#c08a4e", edge: "#7a4f22", shine: "#e6b67c", guard: "#6b4423" },
  { name: "Stone",     dmg: 2,  cost: 15,  blade: "#a3a3a3", edge: "#666666", shine: "#d2d2d2", guard: "#5c5c5c" },
  { name: "Iron",      dmg: 4,  cost: 40,  blade: "#e3e8ee", edge: "#9099a4", shine: "#ffffff", guard: "#727a84" },
  { name: "Copper",    dmg: 7,  cost: 100, blade: "#e0834a", edge: "#9c4e22", shine: "#ffbe8f", guard: "#8a4a24" },
  { name: "Gold",      dmg: 11, cost: 220, blade: "#f8cf4a", edge: "#c4931b", shine: "#fff4b0", guard: "#b8860b" },
  { name: "Diamond",   dmg: 17, cost: 450, blade: "#63e9ec", edge: "#1fa3b3", shine: "#e0ffff", guard: "#1f8f9c", sparkle: true },
  { name: "Netherite", dmg: 26, cost: 900, blade: "#4d434c", edge: "#241e24", shine: "#9a8b98", guard: "#2a2329", glow: "#b46cff" }
];
const COIN_MAX = 20, HEART_START = 3, HEART_MAX = 8;
function coinCost(lvl) { return Math.round(8 * Math.pow(1.55, lvl - 1)); }
const HEART_COSTS = { 3: 20, 4: 45, 5: 90, 6: 160, 7: 260 };

const DECO = {
  body:    { label: "Stickman", opts: ["#1d1b2e", "#2f6fe0", "#8a3fd1", "#e0479a", "#d63a3a", "#2f9e55"] },
  hat:     { label: "Hat",      opts: ["none", "crown", "cap", "wizard", "bow", "helmet"] },
  cape:    { label: "Cape",     opts: ["none", "#d63a3a", "#2f6fe0", "#8a3fd1", "#e0479a", "#f2b632"] },
  handle:  { label: "Handle",   opts: ["#7a4a22", "#c43030", "#2a5fc4", "#7d3cc4", "#e05aa6", "#2a2a2a"] },
  gem:     { label: "Gem",      opts: ["none", "#ff3355", "#3388ff", "#33dd77", "#ff77cc", "#ffd23f"] },
  pattern: { label: "Pattern",  opts: ["plain", "stripes", "stars", "dots", "zigzag"] }
};
const DECO_KEYS = ["body", "hat", "cape", "handle", "gem", "pattern"];

const SHIRTS = ["#5a7bd6", "#d66a5a", "#8f6ad6", "#d6b25a", "#4fb0a4", "#c46aa8", "#7d8a99"];
const ACCS = ["none", "none", "none", "cone", "bucket", "bow"];

/* ---------------- save ---------------- */
const SAVE_KEY = "killTheZombie.v1";
const S = {
  coins: 0, sword: 0, coinLvl: 1, hearts: HEART_START, best: 0, muted: false,
  deco: { body: 0, hat: 0, cape: 0, handle: 0, gem: 0, pattern: 0 }
};
function clampInt(v, lo, hi, def) { v = Math.floor(Number(v)); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
  if (!d || typeof d !== "object") return;
  S.coins = clampInt(d.coins, 0, 1e9, 0);
  S.sword = clampInt(d.sword, 0, SWORDS.length - 1, 0);
  S.coinLvl = clampInt(d.coinLvl, 1, COIN_MAX, 1);
  S.hearts = clampInt(d.hearts, HEART_START, HEART_MAX, HEART_START);
  S.best = clampInt(d.best, 0, 1e9, 0);
  S.muted = !!d.muted;
  if (d.deco && typeof d.deco === "object") {
    for (const k of DECO_KEYS) S.deco[k] = clampInt(d.deco[k], 0, DECO[k].opts.length - 1, 0);
  }
}
let dirty = false, saveTimer = 0;
function save() { dirty = false; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
load();

/* ---------------- screen ---------------- */
let scale = 1, offX = 0, offY = 0, dpr = 1, vw = W, vh = H;
const bgC = document.createElement("canvas");
let bgK = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  buildBG();
}
window.addEventListener("resize", resize);

/* ---------------- helpers ---------------- */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function starPath(g, cx, cy, r1, r2, n) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.55, y - s * 0.05, x - s * 0.55, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.6, x - s * 0.1, y + s * 0.75, x, y + s);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.75, x + s * 0.55, y + s * 0.6, x + s * 0.55, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 0.05, x, y, x, y + s * 0.35);
  ctx.closePath();
}
function txt(s, x, y, size, color, align, stroke, sw) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  if (stroke) { ctx.lineJoin = "round"; ctx.strokeStyle = stroke; ctx.lineWidth = sw || Math.max(3, size / 6); ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function drawCoin(x, y, r, spin) {
  const sx = Math.max(0.15, Math.abs(Math.cos(spin || 0)));
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  ctx.fillStyle = "#c8901a"; circle(0, 0, r);
  ctx.fillStyle = "#f7c843"; circle(0, 0, r * 0.8);
  ctx.fillStyle = "#ffe48a"; circle(-r * 0.22, -r * 0.22, r * 0.3);
  ctx.restore();
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- background ---------------- */
function buildBG() {
  const k = Math.max(1, scale * dpr);
  if (Math.abs(k - bgK) < 0.01 && bgC.width) return;
  bgK = k;
  bgC.width = Math.round(W * k); bgC.height = Math.round(H * k);
  const g = bgC.getContext("2d");
  g.setTransform(k, 0, 0, k, 0, 0);
  paintBG(g);
}
function paintBG(g) {
  const R = mulberry(7);
  let gr = g.createLinearGradient(0, 0, 0, GROUND);
  gr.addColorStop(0, "#151233"); gr.addColorStop(0.6, "#2d2560"); gr.addColorStop(1, "#4c3f84");
  g.fillStyle = gr; g.fillRect(0, 0, W, GROUND);
  for (let i = 0; i < 80; i++) {
    g.globalAlpha = 0.3 + R() * 0.7; g.fillStyle = "#fff";
    g.beginPath(); g.arc(R() * W, R() * 300, 0.5 + R() * 1.4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  // moon
  const mg = g.createRadialGradient(790, 95, 30, 790, 95, 120);
  mg.addColorStop(0, "rgba(255,248,215,0.35)"); mg.addColorStop(1, "rgba(255,248,215,0)");
  g.fillStyle = mg; g.fillRect(650, 0, 300, 230);
  g.fillStyle = "#f8f1cf"; g.beginPath(); g.arc(790, 95, 46, 0, 7); g.fill();
  g.fillStyle = "#e6dcb3";
  [[775, 82, 9], [806, 104, 7], [796, 76, 4], [770, 110, 5]].forEach(c => { g.beginPath(); g.arc(c[0], c[1], c[2], 0, 7); g.fill(); });
  // hills
  g.fillStyle = "#251f4d"; g.beginPath(); g.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, 345 + Math.sin(x * 0.008) * 22 + Math.sin(x * 0.021) * 10);
  g.lineTo(W, GROUND); g.fill();
  g.fillStyle = "#2e2758"; g.beginPath(); g.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, 392 + Math.sin(x * 0.012 + 2) * 14);
  g.lineTo(W, GROUND); g.fill();
  // bare trees
  g.strokeStyle = "#1c1738"; g.lineCap = "round";
  function tree(x, h) {
    g.lineWidth = 9; g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x + 4, GROUND - h); g.stroke();
    g.lineWidth = 5;
    g.beginPath(); g.moveTo(x + 2, GROUND - h * 0.55); g.lineTo(x - 34, GROUND - h * 0.85); g.stroke();
    g.beginPath(); g.moveTo(x + 3, GROUND - h * 0.7); g.lineTo(x + 38, GROUND - h * 0.95); g.stroke();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(x - 20, GROUND - h * 0.75); g.lineTo(x - 28, GROUND - h * 0.98); g.stroke();
    g.beginPath(); g.moveTo(x + 24, GROUND - h * 0.85); g.lineTo(x + 30, GROUND - h * 1.08); g.stroke();
  }
  tree(95, 190); tree(880, 160);
  // fence
  g.strokeStyle = "#251f47"; g.lineWidth = 3;
  g.beginPath(); g.moveTo(150, GROUND - 26); g.lineTo(810, GROUND - 26); g.stroke();
  g.beginPath(); g.moveTo(150, GROUND - 14); g.lineTo(810, GROUND - 14); g.stroke();
  g.fillStyle = "#251f47";
  for (let x = 150; x <= 810; x += 30) { g.beginPath(); g.moveTo(x - 3, GROUND); g.lineTo(x - 3, GROUND - 34); g.lineTo(x, GROUND - 40); g.lineTo(x + 3, GROUND - 34); g.lineTo(x + 3, GROUND); g.fill(); }
  // tombstones
  [[235, -0.08], [415, 0.05], [575, -0.04], [735, 0.09]].forEach(([x, a], i) => {
    g.save(); g.translate(x, GROUND + 2); g.rotate(a);
    g.fillStyle = "#5a5580";
    g.beginPath(); g.moveTo(-17, 0); g.lineTo(-17, -32); g.arc(0, -32, 17, Math.PI, 0); g.lineTo(17, 0); g.closePath(); g.fill();
    g.fillStyle = "#47426a";
    if (i % 2) { g.fillRect(-2.5, -40, 5, 24); g.fillRect(-9, -33, 18, 5); }
    else { g.font = "bold 11px " + FONT; g.textAlign = "center"; g.fillText("RIP", 0, -26); }
    g.restore();
  });
  // ground
  gr = g.createLinearGradient(0, GROUND, 0, H);
  gr.addColorStop(0, "#5a3d2b"); gr.addColorStop(1, "#33221a");
  g.fillStyle = gr; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = "#3e8a4c"; g.fillRect(0, GROUND - 2, W, 12);
  g.fillStyle = "#4fa35c";
  for (let x = 0; x < W; x += 9) { g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x + 4, GROUND - 6 - R() * 5); g.lineTo(x + 8, GROUND); g.fill(); }
  g.fillStyle = "rgba(0,0,0,0.18)";
  for (let i = 0; i < 40; i++) { g.beginPath(); g.ellipse(R() * W, GROUND + 22 + R() * (H - GROUND - 30), 3 + R() * 6, 2 + R() * 3, 0, 0, 7); g.fill(); }
}

/* ---------------- audio ---------------- */
let AC = null, lastCoinSfx = 0;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
}
function tone(freq, dur, type, vol, slide, at) {
  if (S.muted || !AC) return;
  try {
    const t = AC.currentTime + (at || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
let noiseBuf = null;
function whoosh(vol, freq) {
  if (S.muted || !AC) return;
  try {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(freq * 0.6, t); f.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.14);
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + 0.18);
  } catch (e) {}
}
const sfx = {
  swing() { whoosh(0.18, 1400); },
  hit() { tone(150, 0.1, "square", 0.07, -70); },
  pop() { tone(320, 0.22, "triangle", 0.09, -230); },
  coin(now) { if (now - lastCoinSfx < 0.06) return; lastCoinSfx = now; tone(1320, 0.06, "square", 0.035); tone(1760, 0.09, "square", 0.035, 0, 0.05); },
  hurt() { tone(240, 0.3, "sawtooth", 0.08, -160); },
  buy() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, "square", 0.05, 0, i * 0.07)); },
  no() { tone(130, 0.18, "square", 0.06); tone(110, 0.2, "square", 0.06, 0, 0.12); },
  click() { tone(880, 0.05, "triangle", 0.06); },
  ko() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, "triangle", 0.08, 0, i * 0.14)); }
};

/* ---------------- game state ---------------- */
let state = "title", prevState = "title", shopTab = 0, koT = 0, time = 0, shake = 0;
let touchMode = false;
try { touchMode = window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
let shopMsg = null, coinBump = 0;
const P = { x: W / 2, face: 1, swingT: 0, swingHit: false, hp: HEART_START, inv: 0, walkT: 0, moving: false, kx: 0, hurt: 0 };
const SPEED = 240, SWING_DUR = 0.32;
let zombies = [], coins = [], parts = [], pops = [];
const run = { kills: 0, spawnT: 0.6, startBest: 0 };

function resetRun() {
  zombies = []; coins = []; parts = []; pops = [];
  run.kills = 0; run.spawnT = 0.6; run.startBest = S.best;
  P.x = W / 2; P.face = 1; P.hp = S.hearts; P.inv = 1; P.swingT = 0; P.kx = 0; P.hurt = 0;
}
function startGame() { ensureAudio(); sfx.click(); resetRun(); state = "play"; }
function openShop() { if (state === "shop") return; sfx.click(); prevState = state; state = "shop"; shopMsg = null; }
function closeShop() { sfx.click(); state = prevState === "shop" ? "play" : prevState; save(); }
function toggleMute() { S.muted = !S.muted; save(); if (!S.muted) { ensureAudio(); sfx.click(); } }

/* ---------------- input ---------------- */
const keys = { left: false, right: false, swing: false };
const ptr = new Map();
function held(role) {
  if (keys[role]) return true;
  for (const r of ptr.values()) if (r === role) return true;
  return false;
}
function canAct() { return state === "play"; }
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " " || k === "Spacebar" || k.startsWith("Arrow")) e.preventDefault();
  ensureAudio();
  if (state === "title") { if (k === " " || k === "Enter") startGame(); else if (k === "u" || k === "U") openShop(); return; }
  if (state === "ko") {
    if ((k === " " || k === "Enter") && koT > 0.8) { sfx.click(); resetRun(); state = "play"; }
    else if (k === "u" || k === "U") openShop();
    return;
  }
  if (state === "shop") {
    if (k === "Escape" || k === "u" || k === "U") closeShop();
    else if (k === "1") buySword(); else if (k === "2") buyCoin(); else if (k === "3") buyHeart();
    else if (k === "Tab") { e.preventDefault(); shopTab = 1 - shopTab; sfx.click(); }
    return;
  }
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = true;
  else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = true;
  else if (k === " " || k === "Spacebar") { if (!keys.swing) trySwing(true); keys.swing = true; }
  else if (k === "u" || k === "U") openShop();
  else if (k === "m" || k === "M") toggleMute();
});
window.addEventListener("keyup", (e) => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
  else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  else if (k === " " || k === "Spacebar") keys.swing = false;
});
window.addEventListener("blur", () => { keys.left = keys.right = keys.swing = false; ptr.clear(); save(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

let ui = [];
function addBtn(x, y, w, h, fn) { ui.push({ x, y, w, h, fn }); }
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale };
}
const TB = { left: { x: 72, y: 470, r: 44 }, right: { x: 178, y: 470, r: 44 }, swing: { x: W - 88, y: 458, r: 60 } };
function touchRole(p) {
  if (!touchMode) return null;
  for (const k of ["left", "right", "swing"]) { const b = TB[k]; if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) return k; }
  return null;
}
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  ensureAudio();
  if (e.pointerType === "touch") touchMode = true;
  const p = toLogical(e);
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (state === "title") { startGame(); return; }
  if (state === "ko") { if (koT > 0.8) { sfx.click(); resetRun(); state = "play"; } return; }
  if (state !== "play") return;
  const role = touchRole(p) || "swing";
  ptr.set(e.pointerId, role);
  if (role === "swing") trySwing(true);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener("pointermove", (e) => {
  if (!ptr.has(e.pointerId)) return;
  const cur = ptr.get(e.pointerId);
  if (cur === "left" || cur === "right") {
    const r = touchRole(toLogical(e));
    if (r === "left" || r === "right") ptr.set(e.pointerId, r);
  }
});
function endPtr(e) { ptr.delete(e.pointerId); }
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---------------- shop actions ---------------- */
function deny() { sfx.no(); shopMsg = { text: "Not enough coins yet!", t: 1.6 }; }
function bought(text) { sfx.buy(); shopMsg = { text, t: 1.6 }; dirty = true; save(); burst(W / 2, 260, "#ffd23f", 24, 260); }
function buySword() {
  if (S.sword >= SWORDS.length - 1) return;
  const c = SWORDS[S.sword + 1].cost;
  if (S.coins < c) return deny();
  S.coins -= c; S.sword++;
  bought("You got a " + SWORDS[S.sword].name + " sword!");
}
function buyCoin() {
  if (S.coinLvl >= COIN_MAX) return;
  const c = coinCost(S.coinLvl);
  if (S.coins < c) return deny();
  S.coins -= c; S.coinLvl++;
  bought("Zombies now drop " + S.coinLvl + " coins!");
}
function buyHeart() {
  if (S.hearts >= HEART_MAX) return;
  const c = HEART_COSTS[S.hearts];
  if (S.coins < c) return deny();
  S.coins -= c; S.hearts++; P.hp = Math.min(S.hearts, P.hp + 1);
  bought("Extra heart! You have " + S.hearts + " now.");
}
function canAffordAny() {
  return (S.sword < SWORDS.length - 1 && S.coins >= SWORDS[S.sword + 1].cost) ||
         (S.coinLvl < COIN_MAX && S.coins >= coinCost(S.coinLvl)) ||
         (S.hearts < HEART_MAX && S.coins >= HEART_COSTS[S.hearts]);
}

/* ---------------- gameplay ---------------- */
function trySwing(fresh) {
  if (!canAct() || P.swingT > 0) return;
  // if not walking, turn to face the closest zombie (kind to small players)
  if (!held("left") && !held("right")) {
    let best = null, bd = 1e9;
    for (const z of zombies) { if (z.dead) continue; const d = Math.abs(z.x - P.x); if (d < bd) { bd = d; best = z; } }
    if (best && bd < 260) P.face = best.x >= P.x ? 1 : -1;
  }
  P.swingT = SWING_DUR; P.swingHit = false;
  sfx.swing();
}
function spawnZombie() {
  const k = run.kills;
  const fromLeft = Math.random() < 0.5;
  let type = "normal";
  const r = Math.random();
  if (k >= 12 && r < 0.14) type = "big";
  else if (k >= 6 && r < 0.36) type = "speedy";
  const baseHp = Math.min(60, 2 + Math.floor(k / 10));
  const z = {
    x: fromLeft ? -30 : W + 30, face: fromLeft ? 1 : -1, type,
    shirt: pick(SHIRTS), acc: pick(ACCS), t: Math.random() * 10,
    flash: 0, stun: 0, kvx: 0, dead: false, deadT: 0
  };
  const spd = 58 + Math.min(42, k * 0.6);
  if (type === "normal") { z.maxHp = baseHp; z.speed = spd * rand(0.88, 1.12); z.scale = 1; z.coins = 1; }
  else if (type === "speedy") { z.maxHp = Math.max(1, Math.ceil(baseHp * 0.6)); z.speed = (95 + Math.min(50, k * 0.4)) * rand(0.9, 1.1); z.scale = 0.8; z.coins = 1; z.acc = "cap"; }
  else { z.maxHp = baseHp * 3; z.speed = (28 + Math.min(20, k * 0.2)) * rand(0.9, 1.1); z.scale = 1.45; z.coins = 3; }
  z.hp = z.maxHp;
  z.w = 34 * z.scale;
  zombies.push(z);
}
function burst(x, y, color, n, spd, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(0.3, 1) * (spd || 200);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rand(0.35, 0.7), max: 0.7, color, size: rand(2, 4.5), grav: grav == null ? 500 : grav });
  }
}
function puff(x, y, s) {
  for (let i = 0; i < 12; i++) {
    parts.push({ x: x + rand(-18, 18) * s, y: y + rand(-30, 10) * s, vx: rand(-40, 40), vy: rand(-90, -30), life: rand(0.4, 0.8), max: 0.8, color: pick(["#a9c79a", "#8fae86", "#d8e3d0"]), size: rand(7, 13) * s, grav: -40, puff: true });
  }
}
function popup(x, y, text, color, size) { pops.push({ x, y, text, color, size: size || 24, life: 0.9 }); }
function killZombie(z) {
  z.dead = true; z.deadT = 0; z.stun = 0;
  run.kills++;
  if (run.kills > S.best) { S.best = run.kills; dirty = true; }
  sfx.pop();
  puff(z.x, GROUND - 50 * z.scale, z.scale);
  const value = z.coins * S.coinLvl;
  const n = Math.min(value, 12);
  const each = Math.floor(value / n), extra = value % n;
  for (let i = 0; i < n; i++) {
    coins.push({ x: z.x, y: GROUND - 60 * z.scale, vx: rand(-170, 170), vy: rand(-430, -250), v: each + (i < extra ? 1 : 0), t: 0, spin: Math.random() * 6 });
  }
  if (z.type === "big") shake = Math.max(shake, 8);
}
function doHit() {
  const dmg = SWORDS[S.sword].dmg;
  let hitAny = false;
  for (const z of zombies) {
    if (z.dead) continue;
    const rel = (z.x - P.x) * P.face;
    if (rel > -14 && rel < 74 + z.w / 2) {
      z.hp -= dmg; z.flash = 0.12; z.stun = 0.3;
      z.kvx = P.face * (z.type === "big" ? 170 : 330);
      hitAny = true;
      popup(z.x + rand(-8, 8), GROUND - 118 * z.scale, String(dmg), "#ffffff", 26);
      burst(z.x - P.face * z.w * 0.3, GROUND - 58 * z.scale, SWORDS[S.sword].shine, 7, 220);
      if (z.hp <= 0) killZombie(z);
    }
  }
  if (hitAny) { sfx.hit(); shake = Math.max(shake, 3); }
}
function hurtPlayer(src) {
  P.hp -= 1; P.inv = 1.3; P.hurt = 0.35; shake = 9;
  P.kx = (P.x >= src.x ? 1 : -1) * 320;
  sfx.hurt();
  burst(P.x, GROUND - 60, "#ff5a6a", 10, 200);
  for (const z of zombies) {
    if (z.dead) continue;
    if (Math.abs(z.x - P.x) < 140) { z.kvx = (z.x >= P.x ? 1 : -1) * 300; z.stun = 0.45; }
  }
  if (P.hp <= 0) {
    P.hp = 0; state = "ko"; koT = 0; sfx.ko();
    for (const c of coins) S.coins += c.v;
    coins = [];
    save();
  }
}

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);
  coinBump = Math.max(0, coinBump - dt * 4);
  if (shopMsg) { shopMsg.t -= dt; if (shopMsg.t <= 0) shopMsg = null; }
  saveTimer += dt;
  if (dirty && saveTimer > 2) { saveTimer = 0; save(); }
  // particles and popups keep moving in the shop too (they're pretty)
  for (const p of parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  if (state === "ko") koT += dt;
  if (state === "shop" || state === "title") return;

  for (const p of pops) { p.life -= dt; p.y -= 50 * dt; }
  pops = pops.filter(p => p.life > 0);

  // zombies always animate a little (also on KO screen, they wander)
  for (const z of zombies) {
    z.t += dt; z.flash = Math.max(0, z.flash - dt);
    if (z.dead) { z.deadT += dt; continue; }
    if (z.stun > 0) {
      z.stun -= dt; z.x += z.kvx * dt; z.kvx *= Math.pow(0.03, dt);
    } else if (state === "play") {
      const d = P.x - z.x;
      z.face = d >= 0 ? 1 : -1;
      if (Math.abs(d) > z.w / 2 + 10) z.x += z.face * z.speed * dt;
    } else if (state === "ko") {
      z.x += Math.sin(z.t * 1.3) * 12 * dt; // victory shuffle
    }
    z.x = Math.max(-80, Math.min(W + 80, z.x));
  }
  zombies = zombies.filter(z => !z.dead || z.deadT < 0.75);
  if (state === "ko") return;

  // player
  P.inv = Math.max(0, P.inv - dt);
  P.hurt = Math.max(0, P.hurt - dt);
  let dir = 0;
  if (held("left")) dir -= 1;
  if (held("right")) dir += 1;
  P.moving = dir !== 0;
  if (dir) { P.face = dir; P.walkT += dt; }
  P.x += (dir * SPEED + P.kx) * dt;
  P.kx *= Math.pow(0.02, dt);
  P.x = Math.max(28, Math.min(W - 28, P.x));

  if (P.swingT > 0) {
    P.swingT -= dt;
    const prog = 1 - P.swingT / SWING_DUR;
    if (!P.swingHit && prog >= 0.36) { P.swingHit = true; doHit(); }
    if (P.swingT < 0) P.swingT = 0;
  } else if (held("swing")) trySwing(false);

  // zombie touches player
  if (P.inv <= 0) {
    for (const z of zombies) {
      if (z.dead || z.stun > 0) continue;
      if (Math.abs(z.x - P.x) < z.w / 2 + 14) { hurtPlayer(z); break; }
    }
  }
  if (state !== "play") return;

  // spawning
  run.spawnT -= dt;
  const alive = zombies.reduce((n, z) => n + (z.dead ? 0 : 1), 0);
  const maxAlive = Math.min(10, 3 + Math.floor(run.kills / 6));
  if (run.spawnT <= 0) {
    if (alive < maxAlive) spawnZombie();
    run.spawnT = Math.max(0.7, 1.8 - run.kills * 0.025) * rand(0.8, 1.2);
  }

  // coins
  const tx = P.x, ty = GROUND - 52;
  for (const c of coins) {
    c.t += dt; c.spin += dt * 9;
    if (c.t < 0.55) {
      c.vy += 1100 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.y > GROUND - 9) { c.y = GROUND - 9; c.vy *= -0.45; c.vx *= 0.7; }
    } else {
      const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1;
      const sp = 300 + (c.t - 0.55) * 1400;
      c.x += dx / d * sp * dt; c.y += dy / d * sp * dt;
      if (d < 22) {
        c.got = true; S.coins += c.v; dirty = true; coinBump = 1;
        sfx.coin(time);
        popup(P.x + rand(-14, 14), GROUND - 112, "+" + c.v, "#ffd23f", 20);
      }
    }
  }
  coins = coins.filter(c => !c.got);
}

/* ---------------- drawing: sword ---------------- */
function bladePath(L) {
  ctx.beginPath();
  ctx.moveTo(4, -5); ctx.lineTo(L - 12, -5); ctx.lineTo(L, 0); ctx.lineTo(L - 12, 5); ctx.lineTo(4, 5);
  ctx.closePath();
}
function drawPattern(pat, L, M) {
  if (pat === "stripes") {
    ctx.strokeStyle = M.edge; ctx.globalAlpha = 0.55; ctx.lineWidth = 3;
    for (let x = 6; x < L + 10; x += 9) line(x, 7, x + 8, -7);
  } else if (pat === "stars") {
    ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.85;
    for (let x = 12; x < L - 6; x += 13) { starPath(ctx, x, 0, 4, 1.8, 5); ctx.fill(); }
  } else if (pat === "dots") {
    ctx.fillStyle = M.edge; ctx.globalAlpha = 0.6;
    for (let x = 10; x < L - 6; x += 8) circle(x, (x / 8) % 2 < 1 ? -2 : 2, 1.8);
  } else if (pat === "zigzag") {
    ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(5, 0);
    for (let x = 5, up = true; x < L; x += 5, up = !up) ctx.lineTo(x, up ? -3 : 3);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function swordLen(tier) { return 46 + tier * 3; }
function drawSword(tier, d, t) {
  const M = SWORDS[tier], L = swordLen(tier);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.fillStyle = DECO.handle.opts[d.handle]; rr(ctx, -16, -3.5, 18, 7, 3); ctx.fill();
  ctx.fillStyle = M.guard; rr(ctx, -21, -4.5, 6, 9, 2.5); ctx.fill();
  if (M.glow) { ctx.shadowColor = M.glow; ctx.shadowBlur = 12 + Math.sin(t * 5) * 5; }
  bladePath(L); ctx.fillStyle = M.blade; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
  const pat = DECO.pattern.opts[d.pattern];
  if (pat !== "plain") { ctx.save(); bladePath(L); ctx.clip(); drawPattern(pat, L, M); ctx.restore(); }
  ctx.strokeStyle = M.shine; ctx.lineWidth = 2; line(8, -2.5, L - 15, -2.5);
  bladePath(L); ctx.strokeStyle = M.edge; ctx.lineWidth = 2; ctx.stroke();
  if (M.glow) { ctx.strokeStyle = M.glow; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; line(8, 2, L - 14, 2); ctx.globalAlpha = 1; }
  ctx.fillStyle = M.guard; rr(ctx, -1, -12, 6, 24, 2.5); ctx.fill();
  const g = DECO.gem.opts[d.gem];
  if (g !== "none") {
    ctx.fillStyle = g; circle(2, 0, 4.2);
    ctx.fillStyle = "rgba(255,255,255,0.75)"; circle(1, -1.6, 1.4);
  }
  if (M.sparkle) {
    const sp = (t * 1.2) % 1;
    ctx.globalAlpha = Math.sin(sp * Math.PI);
    ctx.fillStyle = "#ffffff"; starPath(ctx, 10 + sp * (L - 22), -1, 5, 1.2, 4); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- drawing: stickman ---------------- */
const KF = [[0, -1.1, 0.5], [0.2, -2.4, -1.9], [0.5, 0.8, 0.5], [1, -1.1, 0.5]];
function swingPose(p) {
  for (let i = 0; i < KF.length - 1; i++) {
    const a = KF[i], b = KF[i + 1];
    if (p <= b[0]) {
      const u = Math.max(0, Math.min(1, (p - a[0]) / (b[0] - a[0])));
      const e = u * u * (3 - 2 * u);
      return [a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
    }
  }
  return [KF[3][1], KF[3][2]];
}
function drawHat(type, hy) {
  ctx.lineWidth = 2; ctx.lineJoin = "round";
  if (type === "crown") {
    ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#c4931b";
    ctx.beginPath(); ctx.moveTo(-11, hy - 9); ctx.lineTo(-12, hy - 23); ctx.lineTo(-6, hy - 16); ctx.lineTo(0, hy - 27);
    ctx.lineTo(6, hy - 16); ctx.lineTo(12, hy - 23); ctx.lineTo(11, hy - 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ff3355"; circle(0, hy - 14, 2.6);
  } else if (type === "cap") {
    ctx.fillStyle = "#d63a3a";
    ctx.beginPath(); ctx.arc(0, hy - 3, 14, Math.PI, Math.PI * 2); ctx.fill();
    rr(ctx, 2, hy - 6, 18, 4.5, 2); ctx.fill();
    ctx.fillStyle = "#fff"; circle(0, hy - 16, 2);
  } else if (type === "wizard") {
    ctx.fillStyle = "#5b3cc4";
    ctx.beginPath(); ctx.moveTo(-15, hy - 8); ctx.lineTo(15, hy - 8); ctx.lineTo(-6, hy - 46); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, hy - 8, 18, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd23f"; starPath(ctx, -2, hy - 22, 5, 2.2, 5); ctx.fill();
  } else if (type === "bow") {
    ctx.fillStyle = "#ff77cc";
    ctx.beginPath(); ctx.moveTo(-5, hy - 13); ctx.lineTo(-16, hy - 21); ctx.lineTo(-16, hy - 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5, hy - 13); ctx.lineTo(6, hy - 21); ctx.lineTo(6, hy - 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e0479a"; circle(-5, hy - 13, 3.5);
  } else if (type === "helmet") {
    ctx.fillStyle = "#9aa3ad";
    ctx.beginPath(); ctx.arc(0, hy - 1, 15.5, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9d0d8"; rr(ctx, -15.5, hy - 3, 31, 4, 2); ctx.fill();
    ctx.fillStyle = "#d63a3a"; ctx.beginPath(); ctx.ellipse(-3, hy - 20, 9, 4.5, -0.4, 0, 7); ctx.fill();
  }
}
function drawStickman(x, y, face, o) {
  const s = o.scale || 1, d = o.deco || S.deco, t = o.t || 0;
  const col = DECO.body.opts[d.body];
  ctx.save(); ctx.translate(x, y); ctx.scale(face * s, s);
  const step = o.moving ? Math.sin(o.walkT * 11) : 0;
  const bob = o.moving ? -Math.abs(Math.sin(o.walkT * 11)) * 3 : Math.sin(t * 2.5) * 1.2;
  const hipY = -38 + bob, neckY = -76 + bob, headY = -91 + bob, shY = -70 + bob;
  let sw = -1.1, arm = 0.5;
  if (o.swing != null) [sw, arm] = swingPose(o.swing);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // cape
  if (d.cape > 0) {
    const cc = DECO.cape.opts[d.cape];
    const wv = Math.sin(t * 6 + (o.walkT || 0) * 5) * 4 - (o.moving ? 6 : 0);
    ctx.fillStyle = cc;
    ctx.beginPath(); ctx.moveTo(3, shY - 4); ctx.lineTo(-5, shY - 4);
    ctx.quadraticCurveTo(-18, hipY - 8, -28 + wv, -10);
    ctx.lineTo(-8 + wv * 0.5, -8);
    ctx.quadraticCurveTo(-4, hipY - 6, 3, shY - 4);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 2; ctx.stroke();
  }
  // legs
  ctx.strokeStyle = col; ctx.lineWidth = 5;
  const f1x = step * 14, f1y = step > 0 ? -step * 5 : 0;
  const f2x = -step * 14, f2y = step < 0 ? step * 5 : 0;
  ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(f1x / 2 + 4, (hipY + f1y) / 2); ctx.lineTo(f1x, f1y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(f2x / 2 + 4, (hipY + f2y) / 2); ctx.lineTo(f2x, f2y); ctx.stroke();
  // body
  line(0, hipY, 0, neckY);
  // back arm
  const ba = o.swing != null ? -0.4 : 0;
  line(0, shY, -8 - step * 6 + ba * 10, shY + 25);
  // head
  ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.arc(0, headY, 13, 0, 7); ctx.fill();
  ctx.lineWidth = 4.5; ctx.stroke();
  ctx.fillStyle = "#1d1b2e";
  if (o.hurt) {
    ctx.lineWidth = 2; ctx.strokeStyle = "#1d1b2e";
    line(3, headY - 5, 8, headY); line(8, headY - 5, 3, headY);
    circle(5, headY + 6, 2.4);
  } else {
    circle(5.5, headY - 2, 2.3);
    ctx.strokeStyle = "#1d1b2e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(4, headY + 2, 5, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }
  drawHat(DECO.hat.opts[d.hat], headY);

  // swoosh trail
  if (o.swing != null && o.swing > 0.18 && o.swing < 0.75) {
    const a = Math.min(1, (0.75 - o.swing) / 0.3);
    const R = 26 + swordLen(o.sword) * 0.8;
    ctx.strokeStyle = "rgba(255,255,255," + (0.45 * a).toFixed(3) + ")";
    ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(0, shY, R, -2.1, Math.max(-2.0, sw * 0.9)); ctx.stroke();
  }
  // sword arm + sword
  const hx = Math.cos(arm) * 26, hy = shY + Math.sin(arm) * 26;
  ctx.strokeStyle = col; ctx.lineWidth = 5;
  line(0, shY, hx, hy);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(sw); drawSword(o.sword, d, t); ctx.restore();
  ctx.fillStyle = col; circle(hx, hy, 4);
  ctx.restore();
}

/* ---------------- drawing: zombie ---------------- */
function drawZombie(z) {
  const s = z.scale;
  ctx.save(); ctx.translate(z.x, GROUND);
  if (z.dead) {
    const k = Math.min(1, z.deadT / 0.3);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, z.deadT - 0.25) / 0.45);
    ctx.rotate(-z.face * k * 1.45);
  }
  ctx.scale(z.face * s, s);
  const F = z.flash > 0;
  const c = (v) => F ? "#ffffff" : v;
  const t = z.t;
  const wob = z.stun > 0 || z.dead ? 0 : Math.sin(t * 7);
  const ab = Math.sin(t * 4) * 2;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // legs
  ctx.fillStyle = c("#3d3650");
  ctx.fillRect(-10 + wob * 3, -27, 9, 26); ctx.fillRect(2 - wob * 3, -27, 9, 26);
  ctx.fillStyle = c("#241f30");
  rr(ctx, -12 + wob * 3, -7, 14, 7, 3); ctx.fill(); rr(ctx, 0 - wob * 3, -7, 14, 7, 3); ctx.fill();
  // back arm
  ctx.strokeStyle = c("#5e9e4f"); ctx.lineWidth = 8;
  line(-3, -56, 25, -59 + ab);
  // torso
  ctx.fillStyle = c(z.shirt); rr(ctx, -15, -65, 30, 41, 6); ctx.fill();
  ctx.fillStyle = F ? "#fff" : "rgba(0,0,0,0.16)";
  ctx.fillRect(-11, -44, 9, 9);
  ctx.beginPath(); ctx.moveTo(-15, -27); ctx.lineTo(-10, -21); ctx.lineTo(-5, -27); ctx.lineTo(0, -21); ctx.lineTo(5, -27); ctx.lineTo(10, -21); ctx.lineTo(15, -27); ctx.lineTo(15, -24); ctx.lineTo(-15, -24); ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle = c("#86c96f"); rr(ctx, -16, -97, 32, 35, 10); ctx.fill();
  ctx.fillStyle = F ? "#fff" : "rgba(0,0,0,0.1)"; rr(ctx, -16, -97, 11, 35, 10); ctx.fill();
  // hair
  ctx.strokeStyle = c("#2f3a2a"); ctx.lineWidth = 3;
  line(-8, -96, -11, -103); line(-2, -97, -1, -105); line(4, -96, 8, -102);
  // eyes
  ctx.fillStyle = c("#ffffff"); circle(7, -84, 7.5); circle(-5, -82, 4.6);
  ctx.fillStyle = c("#1d1b2e");
  if (z.stun > 0 && !z.dead) {
    ctx.strokeStyle = c("#1d1b2e"); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(7, -84, 3.5, t * 12, t * 12 + 4.5); ctx.stroke();
  } else { circle(9.5, -83, 3.2); circle(-3.6, -82, 2); }
  // mouth
  ctx.strokeStyle = c("#2f3a2a"); ctx.lineWidth = 2.5;
  line(-4, -71, 12, -71);
  ctx.lineWidth = 1.6;
  for (const sx of [-1, 4, 9]) line(sx, -74, sx, -68);
  // front arm
  ctx.strokeStyle = c("#86c96f"); ctx.lineWidth = 8;
  line(2, -55, 30, -53 - ab);
  ctx.fillStyle = c("#86c96f"); circle(31, -53 - ab, 5.5);
  // accessory
  if (z.acc === "cone") {
    ctx.fillStyle = c("#ff8a2a");
    ctx.beginPath(); ctx.moveTo(-13, -95); ctx.lineTo(13, -95); ctx.lineTo(0, -126); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c("#ffffff"); ctx.beginPath(); ctx.moveTo(-8, -106); ctx.lineTo(8, -106); ctx.lineTo(6, -111); ctx.lineTo(-6, -111); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c("#ff8a2a"); rr(ctx, -16, -98, 32, 5, 2); ctx.fill();
  } else if (z.acc === "bucket") {
    ctx.fillStyle = c("#9aa3ad");
    ctx.beginPath(); ctx.moveTo(-14, -94); ctx.lineTo(14, -94); ctx.lineTo(11, -113); ctx.lineTo(-11, -113); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c("#c9d0d8"); ctx.fillRect(-11, -110, 22, 3);
  } else if (z.acc === "bow") {
    ctx.fillStyle = c("#ff77cc");
    ctx.beginPath(); ctx.moveTo(-2, -98); ctx.lineTo(-12, -106); ctx.lineTo(-12, -90); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2, -98); ctx.lineTo(8, -106); ctx.lineTo(8, -90); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c("#e0479a"); circle(-2, -98, 3);
  } else if (z.acc === "cap") {
    ctx.fillStyle = c("#f2b632");
    ctx.beginPath(); ctx.arc(0, -94, 15, Math.PI, Math.PI * 2); ctx.fill();
    rr(ctx, -26, -97, 14, 4.5, 2); ctx.fill();
  }
  ctx.restore();
  // health bar
  if (!z.dead && z.hp < z.maxHp) {
    const bw = 44 * s, bx = z.x - bw / 2, by = GROUND - (z.acc === "cone" ? 134 : 118) * s;
    ctx.fillStyle = "rgba(0,0,0,0.55)"; rr(ctx, bx - 2, by - 2, bw + 4, 9, 4); ctx.fill();
    ctx.fillStyle = "#e84855"; rr(ctx, bx, by, Math.max(2, bw * z.hp / z.maxHp), 5, 2.5); ctx.fill();
  }
}

/* ---------------- drawing: HUD, controls, screens ---------------- */
function drawShopButton(x, y, w, h, pulse) {
  const g = pulse ? 0.5 + 0.5 * Math.sin(time * 6) : 0;
  if (pulse) { ctx.shadowColor = "#ffd23f"; ctx.shadowBlur = 10 + g * 14; }
  ctx.fillStyle = "#f2b632"; rr(ctx, x, y, w, h, 12); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
  ctx.fillStyle = "#c4871a"; rr(ctx, x, y + h - 6, w, 6, 3); ctx.fill();
  drawCoin(x + 24, y + h / 2 - 1, 10, 0);
  txt(touchMode ? "SHOP" : "SHOP (U)", x + 40 + (w - 40) / 2, y + h / 2 - 1, 18, "#3a2508", "center");
  addBtn(x, y, w, h, openShop);
}
function drawMuteButton(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.35)"; rr(ctx, x, y, 44, 44, 12); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.moveTo(x + 11, y + 18); ctx.lineTo(x + 17, y + 18); ctx.lineTo(x + 24, y + 11); ctx.lineTo(x + 24, y + 33); ctx.lineTo(x + 17, y + 26); ctx.lineTo(x + 11, y + 26); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  if (S.muted) { line(x + 28, y + 17, x + 36, y + 27); line(x + 36, y + 17, x + 28, y + 27); }
  else { ctx.beginPath(); ctx.arc(x + 25, y + 22, 7, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 25, y + 22, 12, -0.8, 0.8); ctx.stroke(); }
  addBtn(x, y, 44, 44, toggleMute);
}
function drawHUD() {
  // hearts
  for (let i = 0; i < S.hearts; i++) {
    const x = 26 + i * 30, y = 14;
    heartPath(x, y, 24);
    ctx.fillStyle = i < P.hp ? "#ff4d5e" : "rgba(0,0,0,0.35)"; ctx.fill();
    ctx.strokeStyle = i < P.hp ? "#a8152b" : "rgba(255,255,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
  }
  // coins
  const cb = 1 + coinBump * 0.25;
  ctx.save(); ctx.translate(30, 62); ctx.scale(cb, cb); drawCoin(0, 0, 13, time * 2); ctx.restore();
  txt(String(S.coins), 52, 63, 28, "#ffe48a", "left", "#2a1d05", 6);
  txt(SWORDS[S.sword].name + " sword · " + SWORDS[S.sword].dmg + " damage · " + S.coinLvl + " coin" + (S.coinLvl > 1 ? "s" : "") + " per zombie", 16, 96, 15, "#e8e2ff", "left", "#1a1535", 4);
  // kills
  txt("Zombies beaten: " + run.kills, W / 2, 26, 22, "#ffffff", "center", "#1a1535", 5);
  txt("Best: " + S.best, W / 2, 52, 16, "#cfc6ff", "center", "#1a1535", 4);
  drawMuteButton(W - 198, 14);
  drawShopButton(W - 144, 14, 130, 44, canAffordAny());
}
function drawTouchControls() {
  if (!touchMode || state !== "play") return;
  const on = (r) => held(r);
  for (const k of ["left", "right"]) {
    const b = TB[k];
    ctx.fillStyle = on(k) ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.18)";
    circle(b.x, b.y, b.r);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    const dx = k === "left" ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(b.x + dx * 16, b.y); ctx.lineTo(b.x - dx * 10, b.y - 16); ctx.lineTo(b.x - dx * 10, b.y + 16); ctx.closePath(); ctx.fill();
  }
  const b = TB.swing;
  ctx.fillStyle = on("swing") ? "rgba(255,90,106,0.75)" : "rgba(255,90,106,0.5)";
  circle(b.x, b.y, b.r);
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
  ctx.save(); ctx.translate(b.x - 18, b.y + 18); ctx.rotate(-0.8); ctx.scale(0.7, 0.7); drawSword(S.sword, S.deco, time); ctx.restore();
  txt("SWING", b.x, b.y + 38, 13, "#fff", "center", "rgba(0,0,0,0.4)", 3);
}
function drawWorld() {
  ctx.drawImage(bgC, 0, 0, W, H);
  for (const c of coins) drawCoin(c.x, c.y, 8, c.spin);
  for (const z of zombies) if (z.dead) drawZombie(z);
  for (const z of zombies) if (!z.dead) drawZombie(z);
  const blink = P.inv > 0 && state === "play" && Math.floor(time * 14) % 2 === 0;
  if (state !== "title") {
    ctx.globalAlpha = blink ? 0.4 : 1;
    drawStickman(P.x, GROUND, P.face, {
      t: time, walkT: P.walkT, moving: P.moving && state === "play", hurt: P.hurt > 0 || state === "ko",
      swing: P.swingT > 0 ? 1 - P.swingT / SWING_DUR : null, sword: S.sword, deco: S.deco
    });
    ctx.globalAlpha = 1;
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5)) * (p.puff ? 0.7 : 1);
    ctx.fillStyle = p.color; circle(p.x, p.y, p.size);
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2.5);
    txt(p.text, p.x, p.y, p.size, p.color, "center", "#1a1535", 5);
  }
  ctx.globalAlpha = 1;
}
function bigButton(x, y, w, h, label, color, fn, size) {
  ctx.fillStyle = color; rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.22)"; rr(ctx, x, y + h - 7, w, 7, 4); ctx.fill();
  txt(label, x + w / 2, y + h / 2 - 2, size || 26, "#ffffff", "center", "rgba(0,0,0,0.3)", 4);
  addBtn(x, y, w, h, fn);
}
function drawTitle() {
  ctx.fillStyle = "rgba(10,8,25,0.35)"; ctx.fillRect(0, 0, W, H);
  const wob = Math.sin(time * 2) * 3;
  ctx.save(); ctx.translate(W / 2, 112 + wob); ctx.rotate(-0.03);
  txt("KILL THE", 0, -38, 46, "#ffffff", "center", "#1a1535", 10);
  txt("ZOMBIE", 0, 22, 92, "#8be26f", "center", "#1a3512", 14);
  ctx.restore();
  // drips
  ctx.fillStyle = "#8be26f";
  [[-120, 0.0], [-40, 0.8], [70, 0.3], [150, 1.4]].forEach(([dx, ph]) => {
    const l = 10 + ((time * 0.7 + ph) % 1.6) * 14;
    rr(ctx, W / 2 + dx, 160 + wob, 7, l, 3.5); ctx.fill();
  });
  // demo characters
  const demoSwing = (time % 1.6) / 0.5;
  drawStickman(200, GROUND, 1, { t: time, sword: S.sword, deco: S.deco, swing: demoSwing < 1 ? demoSwing : null, scale: 1.4 });
  const dz = { x: 760, face: -1, type: "normal", shirt: "#5a7bd6", acc: "cone", t: time, flash: 0, stun: 0, dead: false, scale: 1.4, hp: 1, maxHp: 1, w: 40 };
  drawZombie(dz);
  bigButton(W / 2 - 120, 230, 240, 66, "PLAY", "#2f9e55", startGame, 32);
  bigButton(W / 2 - 120, 308, 240, 50, "Shop & decorate", "#c4871a", openShop, 20);
  const help = touchMode ? "Arrows to walk · red button to swing" : "← → to walk · SPACE to swing · U for the shop";
  txt(help, W / 2, 384, 17, "#e8e2ff", "center", "#1a1535", 4);
  if (S.coins > 0 || S.best > 0) txt("Coins: " + S.coins + "   ·   Best: " + S.best + " zombies", W / 2, 410, 16, "#ffe48a", "center", "#1a1535", 4);
  drawMuteButton(W - 60, 14);
}
function drawKO() {
  const a = Math.min(1, koT * 2);
  ctx.fillStyle = "rgba(10,8,25," + (0.55 * a).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const s = 1 + Math.max(0, 0.4 - koT) * 1.5;
  ctx.save(); ctx.translate(W / 2, 130); ctx.scale(s, s);
  txt("BONK!", 0, 0, 76, "#ff5a6a", "center", "#3a0d14", 12);
  ctx.restore();
  txt("The zombies got you!", W / 2, 192, 28, "#ffffff", "center", "#1a1535", 6);
  txt("You beat " + run.kills + " zombie" + (run.kills === 1 ? "" : "s") + (run.kills > run.startBest ? " - new best!" : ""), W / 2, 230, 22, "#ffe48a", "center", "#1a1535", 5);
  txt("Your coins and upgrades are safe.", W / 2, 262, 18, "#e8e2ff", "center", "#1a1535", 4);
  if (koT > 0.8) {
    bigButton(W / 2 - 230, 292, 220, 62, "Play again", "#2f9e55", () => { sfx.click(); resetRun(); state = "play"; }, 24);
    bigButton(W / 2 + 10, 292, 220, 62, "Shop", "#c4871a", openShop, 24);
    if (!touchMode) txt("or press SPACE to play again", W / 2, 376, 15, "#cfc6ff", "center", "#1a1535", 3);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- shop screen ---------------- */
const PX = 50, PY = 30, PW = 860, PH = 480;
function card(x, y, w, h) {
  ctx.fillStyle = "#2b2452"; rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = "#4a3f86"; ctx.lineWidth = 2; ctx.stroke();
}
function buyButton(x, y, w, cost, maxed, fn, key) {
  const can = !maxed && S.coins >= cost;
  const col = maxed ? "#5b5580" : can ? "#2f9e55" : "#5b5580";
  ctx.fillStyle = col; rr(ctx, x, y, w, 46, 12); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.2)"; rr(ctx, x, y + 40, w, 6, 3); ctx.fill();
  if (maxed) txt("MAXED OUT!", x + w / 2, y + 22, 18, "#fff", "center");
  else {
    drawCoin(x + w / 2 - 34, y + 22, 10, 0);
    txt(String(cost), x + w / 2 - 18, y + 22, 20, can ? "#fff" : "#c9c3e8", "left");
  }
  if (!touchMode && key) txt(key, x + w - 14, y + 22, 12, "rgba(255,255,255,0.6)", "center");
  addBtn(x, y, w, 46, fn);
}
function drawShop() {
  ctx.fillStyle = "rgba(10,8,25,0.6)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#1e1940"; rr(ctx, PX, PY, PW, PH, 22); ctx.fill();
  ctx.strokeStyle = "#f2b632"; ctx.lineWidth = 3; ctx.stroke();
  // tabs
  const tabs = ["Upgrades", "Decorate"];
  tabs.forEach((label, i) => {
    const x = PX + 24 + i * 170, y = PY + 18, on = shopTab === i;
    ctx.fillStyle = on ? "#f2b632" : "#2b2452"; rr(ctx, x, y, 158, 44, 12); ctx.fill();
    txt(label, x + 79, y + 22, 20, on ? "#3a2508" : "#cfc6ff", "center");
    addBtn(x, y, 158, 44, () => { if (shopTab !== i) { shopTab = i; sfx.click(); } });
  });
  // coins
  drawCoin(PX + PW - 200, PY + 40, 14, time * 2);
  txt(String(S.coins), PX + PW - 180, PY + 41, 28, "#ffe48a", "left", "#2a1d05", 6);
  // close
  const cx = PX + PW - 58, cy = PY + 16;
  ctx.fillStyle = "#d63a3a"; rr(ctx, cx, cy, 44, 44, 12); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineCap = "round";
  line(cx + 14, cy + 14, cx + 30, cy + 30); line(cx + 30, cy + 14, cx + 14, cy + 30);
  addBtn(cx, cy, 44, 44, closeShop);

  if (shopTab === 0) drawUpgrades(); else drawDecorate();

  if (shopMsg) {
    ctx.globalAlpha = Math.min(1, shopMsg.t * 3);
    txt(shopMsg.text, W / 2, PY + PH + 16, 20, "#ffe48a", "center", "#1a1535", 6);
    ctx.globalAlpha = 1;
  } else if (!touchMode) {
    txt("Press U or Esc to go back · Tab to switch", W / 2, PY + PH + 16, 13, "#8f86c4", "center", "#1e1940", 4);
  }
}
function drawUpgrades() {
  const y = PY + 78, h = 262, w = 254, gap = 18, x0 = PX + 24;
  // sword
  let x = x0;
  card(x, y, w, h);
  txt("Sword", x + w / 2, y + 26, 22, "#fff", "center");
  ctx.save(); ctx.translate(x + w / 2 - 40, y + 92); ctx.rotate(-0.35); ctx.scale(1.5, 1.5); drawSword(S.sword, S.deco, time); ctx.restore();
  txt("Now: " + SWORDS[S.sword].name + " (" + SWORDS[S.sword].dmg + " dmg)", x + w / 2, y + 140, 16, "#e8e2ff", "center");
  const maxS = S.sword >= SWORDS.length - 1;
  txt(maxS ? "The best sword there is!" : "Next: " + SWORDS[S.sword + 1].name + " (" + SWORDS[S.sword + 1].dmg + " dmg)", x + w / 2, y + 166, 16, maxS ? "#b46cff" : "#8be26f", "center");
  buyButton(x + 22, y + 196, w - 44, maxS ? 0 : SWORDS[S.sword + 1].cost, maxS, buySword, "1");
  // coins
  x += w + gap;
  card(x, y, w, h);
  txt("Coin Power", x + w / 2, y + 26, 22, "#fff", "center");
  const stack = Math.min(S.coinLvl, 8);
  for (let i = 0; i < stack; i++) drawCoin(x + w / 2 - (stack - 1) * 9 + i * 18, y + 92 - (i % 2) * 6, 15, time * 2 + i);
  txt("Now: " + S.coinLvl + " coin" + (S.coinLvl > 1 ? "s" : "") + " per zombie", x + w / 2, y + 140, 16, "#e8e2ff", "center");
  const maxC = S.coinLvl >= COIN_MAX;
  txt(maxC ? "Coin master!" : "Next: " + (S.coinLvl + 1) + " coins per zombie", x + w / 2, y + 166, 16, "#8be26f", "center");
  buyButton(x + 22, y + 196, w - 44, maxC ? 0 : coinCost(S.coinLvl), maxC, buyCoin, "2");
  // hearts
  x += w + gap;
  card(x, y, w, h);
  txt("Hearts", x + w / 2, y + 26, 22, "#fff", "center");
  for (let i = 0; i < S.hearts; i++) {
    const hx = x + w / 2 - (S.hearts - 1) * 13 + i * 26;
    heartPath(hx, y + 70 + (i % 2) * 8, 22); ctx.fillStyle = "#ff4d5e"; ctx.fill(); ctx.strokeStyle = "#a8152b"; ctx.lineWidth = 2; ctx.stroke();
  }
  txt("Now: " + S.hearts + " hearts", x + w / 2, y + 140, 16, "#e8e2ff", "center");
  const maxH = S.hearts >= HEART_MAX;
  txt(maxH ? "Super tough!" : "Next: " + (S.hearts + 1) + " hearts", x + w / 2, y + 166, 16, "#8be26f", "center");
  buyButton(x + 22, y + 196, w - 44, maxH ? 0 : HEART_COSTS[S.hearts], maxH, buyHeart, "3");
  // sword path
  const sy = y + h + 16, sw = (PW - 48) / SWORDS.length;
  txt("Sword path", PX + 30, sy + 4, 15, "#cfc6ff", "left");
  SWORDS.forEach((M, i) => {
    const cx = PX + 24 + sw * i + sw / 2, cy = sy + 42;
    const owned = i <= S.sword;
    ctx.globalAlpha = owned ? 1 : 0.35;
    if (i === S.sword) { ctx.fillStyle = "rgba(242,182,50,0.25)"; rr(ctx, cx - sw / 2 + 4, sy + 16, sw - 8, 66, 10); ctx.fill(); }
    ctx.save(); ctx.translate(cx - 24, cy + 4); ctx.rotate(-0.5); ctx.scale(0.62, 0.62); drawSword(i, S.deco, time); ctx.restore();
    txt(M.name, cx, cy + 30, 13, owned ? "#fff" : "#9a93c8", "center");
    ctx.globalAlpha = 1;
  });
}
function drawSwatch(key, idx, x, y, w, h) {
  const v = DECO[key].opts[idx];
  const on = S.deco[key] === idx;
  ctx.fillStyle = "#2b2452"; rr(ctx, x, y, w, h, 10); ctx.fill();
  if (key === "hat") {
    ctx.save(); ctx.translate(x + w / 2, y + h - 1); ctx.scale(0.8, 0.8);
    ctx.fillStyle = "#fffaf0"; ctx.strokeStyle = "#1d1b2e"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -14, 13, 0, 7); ctx.fill(); ctx.stroke();
    if (v === "none") { /* bare head */ } else drawHat(v, -14);
    ctx.restore();
  } else if (key === "pattern") {
    ctx.save(); ctx.translate(x + 8, y + h / 2); ctx.scale(0.72, 0.72);
    const M = SWORDS[S.sword], L = 58;
    bladePath(L); ctx.fillStyle = M.blade; ctx.fill();
    if (v !== "plain") { ctx.save(); bladePath(L); ctx.clip(); drawPattern(v, L, M); ctx.restore(); }
    bladePath(L); ctx.strokeStyle = M.edge; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  } else if (v === "none") {
    ctx.strokeStyle = "#7d74b8"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 11, 0, 7); ctx.stroke();
    line(x + w / 2 - 8, y + h / 2 + 8, x + w / 2 + 8, y + h / 2 - 8);
  } else {
    ctx.fillStyle = v;
    if (key === "gem") { circle(x + w / 2, y + h / 2, 11); ctx.fillStyle = "rgba(255,255,255,0.7)"; circle(x + w / 2 - 3, y + h / 2 - 4, 3); }
    else { rr(ctx, x + 8, y + 8, w - 16, h - 16, 7); ctx.fill(); }
  }
  if (on) { ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 3.5; rr(ctx, x - 1, y - 1, w + 2, h + 2, 11); ctx.stroke(); }
  addBtn(x, y, w, h, () => { if (S.deco[key] !== idx) { S.deco[key] = idx; sfx.click(); dirty = true; save(); } });
}
function drawDecorate() {
  // preview
  const px = PX + 24, py = PY + 78, pw = 270, ph = 370;
  card(px, py, pw, ph);
  ctx.save(); rr(ctx, px, py, pw, ph, 16); ctx.clip();
  ctx.fillStyle = "#3e8a4c"; ctx.fillRect(px, py + ph - 60, pw, 60);
  const demo = (time % 2.2) / 0.55;
  drawStickman(px + pw / 2 - 20, py + ph - 60, 1, { t: time, sword: S.sword, deco: S.deco, swing: demo < 1 ? demo : null, scale: 2.1 });
  ctx.restore();
  txt("Make it yours!", px + pw / 2, py + 24, 20, "#fff", "center");
  txt("Decorating is free", px + pw / 2, py + 48, 14, "#8be26f", "center");
  // options
  const ox = PX + 316, rowH = 61;
  DECO_KEYS.forEach((key, r) => {
    const y = PY + 82 + r * rowH;
    txt(DECO[key].label, ox, y + 24, 17, "#e8e2ff", "left");
    const n = DECO[key].opts.length;
    for (let i = 0; i < n; i++) drawSwatch(key, i, ox + 104 + i * 72, y, 62, 48);
  });
}

/* ---------------- render ---------------- */
function render() {
  ui = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0d0a1f"; ctx.fillRect(0, 0, vw, vh);
  if (vh > vw * 1.1) {
    ctx.font = "bold 16px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = "#cfc6ff";
    ctx.fillText("Turn your phone sideways for a bigger game ↻", vw / 2, Math.max(30, offY / 2));
  }
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (shake > 0 && state === "play") ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawWorld();
  if (state === "title") drawTitle();
  else if (state === "play") { drawHUD(); drawTouchControls(); }
  else if (state === "ko") { drawHUD(); drawKO(); }
  else if (state === "shop") { if (prevState !== "title") drawHUD(); ui = []; drawShop(); }
  ctx.restore();
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// small hook for automated testing
window.__ktz = { S, P, run, get state() { return state; }, get zombies() { return zombies; }, get coins() { return coins; }, startGame, openShop, closeShop, buySword, buyCoin, buyHeart, spawnZombie, update, render };
})();
</script>
