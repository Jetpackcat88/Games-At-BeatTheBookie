function lvCfg(n) {
  const world = Math.floor((n - 1) / 3) % WORLDS.length;
  const bossLevel = n % 3 === 0;
  return {
    world, bossLevel,
    count: Math.min(40, 10 + 2 * n) - (bossLevel ? 4 : 0),
    hp: Math.round(1.5 + 1.2 * Math.pow(n, 1.75)),
    mult: 1 + Math.floor((n - 1) / 3),
    speed: 58 + Math.min(60, n * 3),
    maxAlive: Math.min(10, 3 + Math.floor(n / 2)),
    gap: Math.max(0.55, 1.7 - n * 0.05)
  };
}

/* ======================= SAVE ======================= */
const SAVE_KEY = "killTheZombie.v1";
const S = {
  coins: 0, sword: 0, coinLvl: 1, hearts: HEART_START, best: 0, muted: false,
  deco: { body: 0, hat: 0, cape: 0, handle: 0, gem: 0, pattern: 0, trail: 0 },
  maxLevel: 1, total: 0, swingLvl: 0, reachLvl: 0, critLvl: 0, pets: [], unlocked: [], seenSword: 6
};
function clampInt(v, lo, hi, def) { v = Math.floor(Number(v)); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }
function isUnlocked(key, idx) { return idx < DECO[key].base || S.unlocked.indexOf(key + ":" + idx) >= 0; }
(function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
  if (!d || typeof d !== "object") return;
  S.coins = clampInt(d.coins, 0, 1e12, 0);
  S.sword = clampInt(d.sword, 0, SWORDS.length - 1, 0);
  S.coinLvl = clampInt(d.coinLvl, 1, COIN_MAX, 1);
  S.hearts = clampInt(d.hearts, HEART_START, HEART_MAX, HEART_START);
  S.best = clampInt(d.best, 0, 1e9, 0);
  S.muted = !!d.muted;
  S.maxLevel = clampInt(d.maxLevel, 1, 100000, 1);
  S.total = clampInt(d.total, 0, 1e12, S.best);
  S.swingLvl = clampInt(d.swingLvl, 0, 5, 0);
  S.reachLvl = clampInt(d.reachLvl, 0, 5, 0);
  S.critLvl = clampInt(d.critLvl, 0, 5, 0);
  S.seenSword = clampInt(d.seenSword, 6, SWORDS.length - 1, 6);
  if (Array.isArray(d.pets)) S.pets = PETS.map(p => p.id).filter(id => d.pets.indexOf(id) >= 0);
  if (Array.isArray(d.unlocked)) S.unlocked = d.unlocked.filter(u => typeof u === "string" && /^[a-z]+:\d+$/.test(u));
  if (d.deco && typeof d.deco === "object") {
    for (const k of DECO_KEYS) S.deco[k] = clampInt(d.deco[k], 0, DECO[k].opts.length - 1, 0);
  }
  for (const k of DECO_KEYS) if (!isUnlocked(k, S.deco[k])) S.deco[k] = 0;
})();
let dirty = false, saveTimer = 0;
function save() { dirty = false; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function lockedList() {
  const out = [];
  for (const k of DECO_KEYS) for (let i = DECO[k].base; i < DECO[k].opts.length; i++) if (!isUnlocked(k, i)) out.push([k, i]);
  return out;
}

/* ======================= SCREEN ======================= */
let scale = 1, offX = 0, offY = 0, dpr = 1, vw = W, vh = H;
const bgCache = {};
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  for (const k in bgCache) delete bgCache[k];
}
window.addEventListener("resize", resize);
function getBG(w) {
  const k = Math.max(1, scale * dpr);
  const c = bgCache[w];
  if (c && Math.abs(c.k - k) < 0.01) return c.cv;
  const cnv = document.createElement("canvas");
  cnv.width = Math.round(W * k); cnv.height = Math.round(H * k);
  const g = cnv.getContext("2d");
  g.setTransform(k, 0, 0, k, 0, 0);
  paintBG(g, w);
  bgCache[w] = { k, cv: cnv };
  return cnv;
}

/* ======================= HELPERS ======================= */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); ctx.fill(); }
function starPath(g, cx, cy, r1, r2, n) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.55, y - s * 0.05, x - s * 0.55, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.6, x - s * 0.1, y + s * 0.75, x, y + s);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.75, x + s * 0.55, y + s * 0.6, x + s * 0.55, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 0.05, x, y, x, y + s * 0.35);
  ctx.closePath();
}
function txt(s, x, y, size, color, align, stroke, sw) {
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  if (stroke) { ctx.lineJoin = "round"; ctx.strokeStyle = stroke; ctx.lineWidth = sw || Math.max(3, size / 6); ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function fitTxt(s, x, y, size, maxW, color, align, stroke, sw) {
  ctx.font = "bold " + size + "px " + FONT;
  while (size > 9 && ctx.measureText(s).width > maxW) { size -= 1; ctx.font = "bold " + size + "px " + FONT; }
  txt(s, x, y, size, color, align, stroke, sw);
}
function drawCoin(x, y, r, spin) {
  const sx = Math.max(0.15, Math.abs(Math.cos(spin || 0)));
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  ctx.fillStyle = "#c8901a"; circle(0, 0, r);
  ctx.fillStyle = "#f7c843"; circle(0, 0, r * 0.8);
  ctx.fillStyle = "#ffe48a"; circle(-r * 0.22, -r * 0.22, r * 0.3);
  ctx.restore();
}
function fmtNum(n) { n = Math.round(n); return n >= 100000 ? Math.round(n / 1000) + "k" : n.toLocaleString("en-IE"); }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const RAINBOW = ["#ff5d5d", "#ffa14d", "#ffe14d", "#5ddc6a", "#4db8ff", "#9a6bff"];

/* ======================= BACKGROUNDS ======================= */
function paintBG(g, wi) {
  const Wd = WORLDS[wi], R = mulberry(7 + wi * 31);
  const rpick = (arr) => arr[Math.floor(R() * arr.length)];
  let gr = g.createLinearGradient(0, 0, 0, GROUND);
  gr.addColorStop(0, Wd.sky[0]); gr.addColorStop(0.6, Wd.sky[1]); gr.addColorStop(1, Wd.sky[2]);
  g.fillStyle = gr; g.fillRect(0, 0, W, GROUND);
  const night = wi === 0 || wi === 1 || wi === 4 || wi === 6;
  if (night) for (let i = 0; i < (wi === 6 ? 160 : 80); i++) {
    g.globalAlpha = 0.3 + R() * 0.7; g.fillStyle = wi === 4 ? "#ffcfa0" : "#fff";
    g.beginPath(); g.arc(R() * W, R() * (wi === 6 ? 380 : 300), 0.5 + R() * 1.4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  const glow = (x, y, r, col) => { const m = g.createRadialGradient(x, y, r * 0.3, x, y, r); m.addColorStop(0, col); m.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = m; g.fillRect(x - r, y - r, r * 2, r * 2); };
  const disc = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  if (wi === 0) { glow(790, 95, 120, "rgba(255,248,215,0.35)"); disc(790, 95, 46, "#f8f1cf"); g.fillStyle = "#e6dcb3"; [[775, 82, 9], [806, 104, 7], [796, 76, 4], [770, 110, 5]].forEach(c => { g.beginPath(); g.arc(c[0], c[1], c[2], 0, 7); g.fill(); }); }
  if (wi === 1) { glow(170, 90, 110, "rgba(200,255,200,0.3)"); disc(170, 90, 40, "#dff7d0"); }
  if (wi === 2) { glow(760, 330, 220, "rgba(255,240,180,0.6)"); disc(760, 330, 70, "#fff3c2"); }
  if (wi === 3) { glow(180, 80, 120, "rgba(255,255,255,0.6)"); disc(180, 80, 40, "#fffbe6"); }
  if (wi === 4) { glow(480, 300, 300, "rgba(255,120,40,0.25)"); }
  if (wi === 5) { glow(800, 90, 120, "rgba(255,255,220,0.6)"); disc(800, 90, 44, "#fff6b8"); for (let i = 0; i < 6; i++) { g.fillStyle = "rgba(255,255,255,0.9)"; const cx = 80 + i * 160 + R() * 40, cy = 60 + R() * 90; [[0, 0, 26], [24, -8, 22], [46, 0, 24]].forEach(c => { g.beginPath(); g.arc(cx + c[0], cy + c[1], c[2], 0, 7); g.fill(); }); } }
  if (wi === 6) {
    glow(200, 110, 110, "rgba(120,180,255,0.35)"); disc(200, 110, 52, "#3a7bd5");
    g.fillStyle = "#3fa55a"; [[185, 95, 16, 22], [215, 125, 18, 12], [195, 135, 8, 6]].forEach(c => { g.beginPath(); g.ellipse(c[0], c[1], c[2], c[3], 0.3, 0, 7); g.fill(); });
    g.fillStyle = "rgba(255,255,255,0.5)"; g.beginPath(); g.ellipse(210, 80, 22, 6, 0.2, 0, 7); g.fill();
    disc(760, 70, 22, "#e0a060"); g.strokeStyle = "#f0d0a0"; g.lineWidth = 4; g.beginPath(); g.ellipse(760, 70, 40, 9, -0.3, 0, 7); g.stroke();
    disc(620, 160, 9, "#ff7a9a");
  }
  g.fillStyle = Wd.hills[0]; g.beginPath(); g.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, 345 + Math.sin(x * 0.008 + wi) * 22 + Math.sin(x * 0.021) * 10);
  g.lineTo(W, GROUND); g.fill();
  if (wi === 3) {

  }
}

/* ======================= RENDER / LOOP ======================= */
function render() {
  ui = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0d0a1f"; ctx.fillRect(0, 0, vw, vh);
  if (vh > vw * 1.1) { ctx.font = "bold 16px " + FONT; ctx.textAlign = "center"; ctx.fillStyle = "#cfc6ff"; ctx.fillText("Turn your phone sideways for a bigger game ↻", vw / 2, Math.max(30, offY / 2)); }
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (shake > 0 && state === "play") ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawWorld();
  let base = state === "reveal" ? revealReturn : state;
  const shopOpen = base === "shop";
  if (shopOpen) base = prevState;
  if (base === "title") drawTitle();
  else if (base === "play") { drawHUD(); drawTouchControls(); }
  else if (base === "ko") { drawHUD(); drawKO(); }
  else if (base === "levelup") { drawHUD(); drawLevelUp(); }
  if (shopOpen) { ui = []; drawShop(); }
  if (state === "reveal") { ui = []; drawReveal(); }
  ctx.restore();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  try { update(dt); } catch (e) { console.error(e); }
  try { render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

window.__ktz = { S, P, LV, get state() { return state; }, get zombies() { return zombies; }, get coins() { return coins; }, get boxes() { return boxes; },
  startLevel, openShop, closeShop, buySword, buyUp, buyPet, spawnBoss, closeReveal, levelComplete, nextLevel,
  openBox: (g) => { openBox({ x: P.x, y: GROUND - 22, t: 1, guaranteed: !!g }); },
  setTab: (t) => { shopTab = t; }, addZombie: (type, x) => { const z = makeZombie(type, x, x < P.x ? 1 : -1); zombies.push(z); return z; },
  setPow: (k, v) => { P.pow[k] = v; } };
})();
