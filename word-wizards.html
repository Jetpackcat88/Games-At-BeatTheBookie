  function drawSpaced(text, x, y, extra) {
    const total = cx.measureText(text).width + extra * (text.length - 1);
    let px = x - total / 2;
    cx.textAlign = "left";
    for (const ch of text) {
      cx.fillText(ch, px, y);
      px += cx.measureText(ch).width + extra;
    }
    cx.textAlign = "center";
  }

  function renderWave(R) {
    renderPrompt(R);
    R.blots.forEach((b, i) => drawBlot(b, i, false));
  }

  function renderSpell(R, isBoss) {
    const s = R.spell;
    if (!s) return;
    // The logic layer advances s.idx the instant a word is solved, but the
    // next word's tiles only load after the celebration delay. Render the word
    // that matches the tiles on screen, or the slot row visibly resizes.
    const word = (G.spellShown && G.spellShown.length === s.slots.length)
      ? G.spellShown
      : (s.words[Math.min(s.idx, s.words.length - 1)] || s.words[0]).word;
    G._renderedLen = word.length;   // instrumentation for the flicker test
    // big blot
    const bigB = { lane: 0.5, progress: (170 - FIELD_TOP) / (FIELD_BOT - FIELD_TOP), seed: 0.4, alive: true, wrongAt: G.spellShake > 0 ? G.spellShake : 0, word: "" };
    if (isBoss) {
      cx.save(); cx.translate(0, 10);
      drawBlot(bigB, -1, true);
      cx.restore();
      // segments
      for (let i = 0; i < 3; i++) {
        const on = i >= R.boss.segmentsDone;
        cx.fillStyle = on ? PAL.heart : "rgba(255,255,255,0.15)";
        rr(cx, W / 2 - 60 + i * 42, 258, 36, 14, 7); cx.fill();
      }
      cx.fillStyle = "#fff"; cx.font = F(18, 900); cx.textAlign = "center";
      cx.fillText("Spell the words to win!", W / 2, 296);
    } else {
      drawBlot(bigB, -1, true);
      cx.fillStyle = "rgba(255,255,255,0.75)"; cx.font = F(16, 700); cx.textAlign = "center";
      cx.fillText(`Word ${s.idx + 1} of ${s.total} — monsters are waiting politely`, W / 2, 282);
    }
    // speech bubble: always a working listen button (speak + re-reveal)
    panel(W / 2 - 90, 300, 180, 62, 22);
    cx.fillStyle = PAL.ink; cx.font = F(26, 900);
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText("🔊", W / 2 - 26, 334);
    cx.font = F(16, 700);
    cx.fillText(G.reveal && G.reveal.t > 0 ? "look!" : "look again", W / 2 + 26, 334);
    hits.push({
      x: W / 2 - 90, y: 300, w: 180, h: 62, fn: () => {
        G.reveal = { word, t: 1.2 };
        G.promptPulse = 0.5;
        TTS.speak(word);   // bonus if the device has a voice; harmless if not
      }, id: "replay"
    });

    if (G.spellShake > 0) G.spellShake -= G.dt;
    const shakeX = G.spellShake > 0 ? Math.sin(G.time * 45) * 5 * G.spellShake : 0;

    // reveal card — the word, big, right where it's about to be built
    if (G.reveal && G.reveal.t > 0 && G.reveal.word === word) {
      G.reveal.t -= G.dt;
      const a = Math.min(1, G.reveal.t / 0.3);
      cx.save();
      cx.globalAlpha = a;
      const pu = 1 + Math.max(0, (G.promptPulse || 0)) * 0.12;
      cx.translate(W / 2, 372); cx.scale(pu, pu); cx.translate(-W / 2, -372);
      panel(W / 2 - 150, 348, 300, 52, 16);
      cx.fillStyle = PAL.ink;
      cx.font = F(fitFont(cx, word, 268, 34, 900), 900);
      cx.textAlign = "center"; cx.textBaseline = "middle";
      drawSpaced(word, W / 2, 374, 2.5);
      cx.restore();
    }
    if ((G.promptPulse || 0) > 0) G.promptPulse -= G.dt;

    // slots
    const n = word.length;
    const sw = Math.min(52, (W - 44) / n - 6);
    const startX = W / 2 - (n * (sw + 6) - 6) / 2 + shakeX;
    for (let i = 0; i < n; i++) {
      const x = startX + i * (sw + 6), y = 396;
      cx.fillStyle = "rgba(0,0,0,0.3)";
      rr(cx, x + 1, y + 3, sw, sw + 8, 10); cx.fill();
      cx.fillStyle = s.slots[i] ? PAL.parch : "rgba(246,234,210,0.35)";
      rr(cx, x, y, sw, sw + 8, 10); cx.fill();
      if (s.slots[i]) {
        cx.fillStyle = PAL.ink;
        cx.font = F(sw * 0.62, 900);
        cx.fillText(s.slots[i].ch, x + sw / 2, y + (sw + 8) / 2 + 1);
      } else if (s.hints) {
        cx.fillStyle = "rgba(46,35,56,0.28)";
        cx.font = F(sw * 0.62, 900);
        cx.fillText(word[i], x + sw / 2, y + (sw + 8) / 2 + 1);
      }
    }
    // tiles
    const tiles = s.tiles;
    const perRow = 5, tsz = 58, tgap = 10;
    const rows = Math.ceil((tiles.length + 1) / perRow);
    const gy = 520;
    const items = tiles.map(t => ({ t })).concat([{ back: true }]);
    items.forEach((it, k) => {
      const r = Math.floor(k / perRow), c = k % perRow;
      const rowCount = Math.min(perRow, items.length - r * perRow);
      const rx = W / 2 - (rowCount * (tsz + tgap) - tgap) / 2;
      const x = rx + c * (tsz + tgap), y = gy + r * (tsz + tgap);
      if (it.back) {
        button(x, y, tsz, tsz, "⌫", () => G.run.tapBackspace(), { px: 26, id: "bs" });
      } else {
        const t = it.t;
        if (t.used) {
          cx.fillStyle = "rgba(246,234,210,0.15)";
          rr(cx, x, y, tsz, tsz, 12); cx.fill();
        } else {
          button(x, y, tsz, tsz, t.ch, () => G.run.tapTile(t.id), { px: 30, id: "tile" + t.id });
        }
      }
    });
  }

  function renderDoors(R) {
    cx.fillStyle = "rgba(255,255,255,0.9)"; cx.textAlign = "center";
    cx.font = F(24, 900);
    cx.fillText("Choose a door", W / 2, 168);
    const n = R.doors.length;
    const dw = 106, dh = 168, gap = 18;
    const startX = W / 2 - (n * (dw + gap) - gap) / 2;
    R.doors.forEach((d, i) => {
      const bob = Math.sin(G.time * 2 + i * 1.4) * 4;
      const x = startX + i * (dw + gap), y = 250 + bob;
      // arched door
      cx.fillStyle = "rgba(0,0,0,0.35)";
      rr(cx, x + 3, y + 5, dw, dh, 40); cx.fill();
      cx.fillStyle = d.type === "boss" ? "#5a2440" : PAL.purple;
      cx.beginPath();
      cx.moveTo(x, y + dh); cx.lineTo(x, y + 52);
      cx.quadraticCurveTo(x + dw / 2, y - 26, x + dw, y + 52);
      cx.lineTo(x + dw, y + dh); cx.closePath(); cx.fill();
      cx.fillStyle = PAL.parch;
      rr(cx, x + 12, y + dh - 56, dw - 24, 40, 10); cx.fill();
      cx.font = F(34, 700);
      cx.fillText(d.icon, x + dw / 2, y + 66);
      cx.fillStyle = PAL.ink;
      cx.font = F(fitFont(cx, d.label, dw - 34, 21, 900), 900);
      cx.fillText(d.label, x + dw / 2, y + dh - 35);
      hits.push({ x, y: 250, w: dw, h: dh, fn: () => G.run.chooseDoor(i), id: "door" + i });
    });
  }

  function renderTreasure(R) {
    cx.textAlign = "center";
    cx.fillStyle = "rgba(255,255,255,0.9)"; cx.font = F(24, 900);
    cx.fillText(R.treasure.opened ? "Ooh, shiny!" : "Tap the chest!", W / 2, 200);
    const y = 400, open = R.treasure.opened;
    cx.fillStyle = "#7a4a2a";
    rr(cx, W / 2 - 70, y, 140, 84, 12); cx.fill();
    cx.fillStyle = "#8f5a35";
    cx.save(); cx.translate(W / 2, y);
    cx.rotate(open ? -0.5 : 0);
    cx.beginPath();
    cx.moveTo(-70, 0); cx.quadraticCurveTo(0, -56, 70, 0); cx.closePath(); cx.fill();
    cx.restore();
    cx.fillStyle = PAL.gold;
    rr(cx, W / 2 - 10, y + 8, 20, 26, 5); cx.fill();
    if (open) { drawCoin(W / 2 - 26, y - 8, 12); drawCoin(W / 2 + 22, y - 16, 10); }
    hits.push({ x: W / 2 - 90, y: y - 60, w: 180, h: 160, fn: () => G.run.openChest(), id: "chest" });
  }

  function renderRest(R) {
    cx.textAlign = "center";
    cx.fillStyle = "rgba(255,255,255,0.9)"; cx.font = F(24, 900);
    cx.fillText(R.rest.taken ? "Cosy…" : "Tap to rest", W / 2, 200);
    // lantern + bedroll
    const y = 380;
    cx.fillStyle = PAL.gold;
    cx.beginPath(); cx.arc(W / 2, y - 40, 14 + Math.sin(G.time * 3) * 2, 0, 7); cx.fill();
    const rg = cx.createRadialGradient(W / 2, y - 40, 8, W / 2, y - 40, 130);
    rg.addColorStop(0, "rgba(255,207,107,0.35)"); rg.addColorStop(1, "rgba(255,207,107,0)");
    cx.fillStyle = rg; cx.fillRect(W / 2 - 160, y - 190, 320, 320);
    cx.fillStyle = "#7a4a6a";
    rr(cx, W / 2 - 80, y + 40, 160, 44, 22); cx.fill();
    drawHeart(W / 2, y + 10, 15, true);
    hits.push({ x: W / 2 - 110, y: y - 80, w: 220, h: 220, fn: () => G.run.takeRest(), id: "rest" });
  }

  function scrResult() {
    drawHubBG();
    const s = G.runOver;
    if (!s) { setScreen("hub"); return; }
    const newBest = s.floor > G.preBest;
    cx.textAlign = "center";
    panel(36, 170, W - 72, 400, 24);
    cx.fillStyle = PAL.ink;
    cx.font = F(26, 900);
    cx.fillText(s.reason === "quit" ? "A brave retreat!" : "The ink got too thick!", W / 2, 226);
    cx.font = F(18, 700);
    cx.fillText("Back to the bookshop you go", W / 2, 256);
    cx.font = F(22, 800); cx.textAlign = "left";
    const rows = [
      ["🏰", `Floor climbed`, String(s.floor)],
      ["🦋", `Words freed`, String(s.wordsFreed.length)],
      ["", `Coins earned`, String(s.coins)],
      ["⭐", `Best streak`, String(s.bestStreak)]
    ];
    rows.forEach((r, i) => {
      const y = 316 + i * 56;
      cx.textAlign = "left"; cx.textBaseline = "middle";
      if (r[0]) { cx.font = F(26, 700); cx.fillText(r[0], 66, y); }
      else drawCoin(78, y, 12);
      cx.textAlign = "left"; cx.font = F(20, 700); cx.fillStyle = PAL.ink;
      cx.fillText(r[1], 108, y);
      cx.textAlign = "right"; cx.font = F(22, 900);
      cx.fillText(r[2], W - 66, y);
      cx.textAlign = "left";
    });
    if (newBest) {
      cx.textAlign = "center";
      const bw = 210, by = 544;
      cx.save();
      cx.translate(W / 2, by + 16);
      cx.rotate(Math.sin(G.time * 3) * 0.03);
      cx.fillStyle = PAL.gold;
      rr(cx, -bw / 2, -18, bw, 36, 18); cx.fill();
      cx.fillStyle = PAL.ink; cx.font = F(17, 900);
      cx.textBaseline = "middle";
      cx.fillText("★ NEW BEST FLOOR ★", 0, 1);
      cx.restore();
    }
    cx.textAlign = "center";
    button(W / 2 - 130, 600, 260, 66, "Back to the Bookshop", () => setScreen("hub"), { gold: true, px: 22, id: "back" });
    if (newBest && !G._bestCelebrated) { G._bestCelebrated = true; spConfetti(60); Audio2.play("fanfare"); }
  }

  // ---------------- Main loop ----------------------------------
  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = clamp((ts - last) / 1000, 0, 0.05);
    last = ts;
    G.dt = dt; G.time += dt;
    hits.length = 0;
    try {

    if (G.holdId) {
      G.holdT = (G.holdT || 0) + G.dt;
      if (G.holdT >= HOLD_TIME) {
        const id = G.holdId;
        G.holdId = null; G.holdT = 0;
        if (id === "sign") {
          Audio2.play("fanfare"); vib(30);
          G.guWho = 0; G.guConfirm = false; G.shopScroll = 0;
          setScreen("grownups");
        }
      }
    } else G.holdT = 0;

    if (G.run && G.screen === "run" && !G.paused) {
      const RR = G.run.snapshot();
      G.flashLeft = (RR.phase === "flash" && RR.flash && RR.flash.shown) ? RR._timer : 0;
      G.run.tick(dt);
      handleRunEvents();
    }
    // animate coin counter toward truth even without particles
    if (G.profile && coinsFly.length === 0 && G.dispCoins < G.profile.coins) {
      G.dispCoins = Math.min(G.profile.coins, G.dispCoins + dt * 60);
    }

    cx.setTransform(S, 0, 0, S, OX, OY);
    // camera shake
    if (shakeT > 0) {
      cx.translate((rnd() - 0.5) * shakeMag, (rnd() - 0.5) * shakeMag);
    }
    cx.textBaseline = "middle";

    switch (G.screen) {
      case "title": scrTitle(); break;
      case "profiles": scrProfiles(); break;
      case "name": scrName(); break;
      case "colour": scrColour(); break;
      case "hub": G._bestCelebrated = false; scrHub(); break;
      case "shop": scrShop(); break;
      case "sisters": scrSisters(); break;
      case "bookshelf": scrBookshelf(); break;
      case "grownups": scrGrownups(); break;
      case "run": scrRun(); break;
      case "result": scrResult(); break;
    }

    updateFX(dt);
    drawFX();

    // letterbox mask (device space)
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.fillStyle = "#120c22";
    if (OX > 0) { cx.fillRect(0, 0, OX, DEVH); cx.fillRect(DEVW - OX, 0, OX, DEVH); }
    if (OY > 0) { cx.fillRect(0, 0, DEVW, OY); cx.fillRect(0, DEVH - OY, DEVW, OY); }
    } catch (err) {
      if (!G.fatal) G.fatal = String((err && err.stack) || err);
    }
    if (G.fatal) drawFatal();
  }

  function drawFatal() {
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.fillStyle = "rgba(18,12,34,0.94)";
    cx.fillRect(0, 0, DEVW, DEVH);
    cx.fillStyle = "#ff9d7d";
    cx.font = "600 " + Math.round(14 * (window.devicePixelRatio || 1)) + "px monospace";
    cx.textAlign = "left"; cx.textBaseline = "top";
    const pad = Math.round(16 * (window.devicePixelRatio || 1));
    const lh = Math.round(20 * (window.devicePixelRatio || 1));
    const lines = ("Oops! Please screenshot this for Dad:\n\n" + G.fatal).split("\n");
    lines.slice(0, 16).forEach((l, i) => cx.fillText(l.slice(0, 70), pad, pad * 2 + i * lh));
  }

  // ---------------- Input ---------------------------------------
  const DRAG_SLOP = 10;   // move further than this and it's a scroll, not a tap
  const HOLD_TIME = 0.9;  // long-press duration for the grown-ups corner

  function fireHit(x, y) {
    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
        G.pressId = h.id;
        setTimeout(() => { if (G.pressId === h.id) G.pressId = null; }, 130);
        h.fn();
        return true;
      }
    }
    return false;
  }

  function onPointer(e) {
    e.preventDefault();
    Audio2.ensure(); TTS.init();
    const { x, y } = toLogical(e);
    // long-press targets (the hub sign) start a hold timer instead of firing
    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      if (h.hold && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
        G.holdId = h.id; G.holdT = 0; G.holdX = x; G.holdY = y;
        return;
      }
    }
    // Scrollable screens defer the tap to pointerup so a drag doesn't buy things.
    if (G.scrollView && (G.screen === "shop" || G.screen === "bookshelf" || G.screen === "grownups")) {
      const V = G.scrollView;
      G.drag = {
        x0: x, y0: y, scroll0: G.shopScroll || 0, moved: false,
        onThumb: x > V.x + V.w - 34,   // grabbing the slider itself
        vel: 0, lastY: y, lastT: G.time
      };
      return;
    }
    fireHit(x, y);
  }

  function onPointerMove(e) {
    if (G.holdId) {
      const { x, y } = toLogical(e);
      if (Math.abs(x - G.holdX) > DRAG_SLOP || Math.abs(y - G.holdY) > DRAG_SLOP) G.holdId = null;
      return;
    }
    if (!G.drag) return;
    e.preventDefault();
    const { x, y } = toLogical(e);
    const d = G.drag, V = G.scrollView;
    if (!V) return;
    if (Math.abs(y - d.y0) > DRAG_SLOP || Math.abs(x - d.x0) > DRAG_SLOP) d.moved = true;
    if (!d.moved) return;
    const maxScroll = Math.max(0, V.contentH - V.h);
    if (d.onThumb) {
      // slider: map finger position along the track to scroll position
      const track = V.h - 40;
      const frac = clamp((y - V.y - 20) / track, 0, 1);
      G.shopScroll = frac * maxScroll;
    } else {
      // flick the list itself
      G.shopScroll = clamp(d.scroll0 - (y - d.y0), 0, maxScroll);
      const dt = Math.max(0.001, G.time - d.lastT);
      d.vel = -(y - d.lastY) / dt;
      d.lastY = y; d.lastT = G.time;
    }
  }

  function onPointerUp(e) {
    if (G.holdId) { G.holdId = null; G.holdT = 0; return; }
    if (!G.drag) return;
    e.preventDefault();
    const d = G.drag;
    const { x, y } = toLogical(e);
    if (!d.moved) fireHit(x, y);              // it was a tap after all
    else if (!d.onThumb) G.scrollVel = clamp(d.vel, -2600, 2600);   // let it glide
    G.drag = null;
  }

  // ---------------- Boot -----------------------------------------
  function boot() {
    cv = document.getElementById("c");
    cx = cv.getContext("2d");
    Store.load();
    G.indexObj = L.buildDistractorIndex(20260713);
    resize();
    addEventListener("resize", resize);
    cv.addEventListener("pointerdown", onPointer, { passive: false });
    cv.addEventListener("pointermove", onPointerMove, { passive: false });
    cv.addEventListener("pointerup", onPointerUp, { passive: false });
    cv.addEventListener("pointercancel", () => { G.drag = null; }, { passive: false });
    cv.addEventListener("contextmenu", e => e.preventDefault());
    addEventListener("error", ev => { if (!G.fatal) G.fatal = String(ev.message || ev.error || "unknown error"); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) Store.save(); });
    requestAnimationFrame(frame);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  // Test hook: the exact inverse of toLogical(), so tests tap real screen points.
  function toClient(lx, ly) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    return { x: (lx * S + OX) / dpr, y: (ly * S + OY) / dpr };
  }
  return { G, Store, hits: () => hits, toClient };
})(
  typeof WW_DATA !== "undefined" ? WW_DATA : null,
  typeof WW_LOGIC !== "undefined" ? WW_LOGIC : null
);

</script>
</body>
</html>
