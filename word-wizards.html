const WW_LOGIC = (function (DATA) {

  // ---------------- RNG (deterministic, seedable) ------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------------- Config (tunable, test-visible) -----------
  const CONFIG = {
    HEARTS: 3,
    ZAP: 2,                 // coins per rescued word (Word Match)
    SPELL_WORD: 3,          // coins per solved Spell-It word
    STREAK_MIN: 3,          // streak length where bonus kicks in
    STREAK_BONUS: 1,
    STORM_NEED: 5,          // consecutive corrects to charge Word Storm
    STORM_BONUS: 8,
    CLEAR_BASE: 6,          // floor-clear bonus = CLEAR_BASE + floor
    TREASURE_BASE: 12,      // treasure = TREASURE_BASE + 2 * floor
    TREASURE_PER_FLOOR: 2,
    BOSS_COINS: 30,
    REST_HEAL: 1,
    REST_FULL_COINS: 8,     // consolation if resting at full hearts
    CHALLENGE_MULT: 2,
    WAVES_EARLY: 3, WAVES_LATE: 4, WAVES_LATE_FLOOR: 3,
    BLOTS_EARLY: 3, BLOTS_LATE: 4, BLOTS_LATE_FLOOR: 6,
    DUR_BASE: 14, DUR_PER_FLOOR: 0.7, DUR_PER_WAVE: 0.4, DUR_MIN: 3.2,
    SPELL_WORDS_PER_FLOOR: 3,
    BOSS_EVERY: 5,
    WAVE_DELAY: 0.9,        // pause between waves (s)
    REACH_DELAY: 1.1,       // pause after a blot reaches the wizard
    EASY_MIX: 0.25,         // chance a word comes from one tier below
    SURGE: 0.10,            // wrong tap: how far every blotling lurches closer
    WRONG_LOCK: 1.0,        // wrongly-tapped blotling is un-tappable this long
    SHOP_REFRESH: 3,        // merchant stock size
    DEEP_TIER_EVERY: 10,    // deeper floors also draw harder words
    ODD_ROUNDS: 2, SENTENCE_ROUNDS: 2, FLASH_ROUNDS: 3,
    REWARD_CAP_FLOOR: 12,   // coins stop scaling with depth here, so a deep run
                            // doesn't out-earn a shallow one several times over
    FLASH_TIME: 0.9,        // Speedy Flash: how long the word is visible
    REVIEW_BONUS: 5         // "You caught a tricky word! +5"
  };

  // ---------------- Small string tools -----------------------
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 99;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0]; dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return dp[n];
  }

  const ASC = new Set("bdfhklt"), DESC = new Set("gjpqy");
  function silhouette(w) {
    let s = "";
    for (const ch of w) s += ASC.has(ch) ? "A" : DESC.has(ch) ? "D" : "x";
    return s;
  }

  function isRude(w) {
    if (DATA.RUDE_EXACT.includes(w)) return true;
    for (const bad of DATA.RUDE_SUBSTRING) if (w.includes(bad)) return true;
    return false;
  }

  // ---------------- Pseudoword generator ---------------------
  // Single letter-swap / transposition that stays pronounceable-ish.
  function makePseudoword(word, rng, realSet) {
    const ops = shuffle(rng, ["vowel", "conf", "trans"]);
    for (let attempt = 0; attempt < 30; attempt++) {
      const op = ops[attempt % ops.length];
      const chars = word.split("");
      let out = null;
      if (op === "vowel") {
        const idxs = [];
        for (let i = 0; i < chars.length; i++) if (DATA.VOWELS.includes(chars[i])) idxs.push(i);
        if (idxs.length) {
          const i = pick(rng, idxs);
          const repl = pick(rng, DATA.VOWELS.split("").filter(v => v !== chars[i]));
          chars[i] = repl; out = chars.join("");
        }
      } else if (op === "conf") {
        const idxs = [];
        for (let i = 0; i < chars.length; i++) if (DATA.CONFUSIONS[chars[i]]) idxs.push(i);
        if (idxs.length) {
          const i = pick(rng, idxs);
          chars[i] = pick(rng, DATA.CONFUSIONS[chars[i]]);
          out = chars.join("");
        }
      } else { // transpose adjacent internal letters (keeps first letter)
        if (word.length >= 4) {
          const i = 1 + Math.floor(rng() * (word.length - 2));
          if (chars[i] !== chars[i + 1]) {
            [chars[i], chars[i + 1]] = [chars[i + 1], chars[i]];
            out = chars.join("");
          }
        }
      }
      if (!out || out === word) continue;
      if (realSet.has(out)) continue;
      if (isRude(out)) continue;
      if (!/[aeiou]/.test(out)) continue;
      if (/(.)\1\1/.test(out)) continue;
      if (/q(?!u)/.test(out)) continue;
      return out;
    }
    return null;
  }

  // ---------------- Distractor index -------------------------
  // Precomputed once: for every target word, a ranked list of
  // real near-miss candidates, padded with pseudowords when the
  // real pool is thin.
  function buildDistractorIndex(rngSeed) {
    const rng = mulberry32(rngSeed || 1234);
    const targets = [];
    DATA.TIERS.forEach(t => targets.push(...t));
    const poolAll = Array.from(new Set([...targets, ...DATA.DISTRACTOR_POOL]));
    const realSet = new Set(poolAll);
    const silhs = new Map(poolAll.map(w => [w, silhouette(w)]));
    const byLen = new Map();
    for (const w of poolAll) {
      const k = w.length;
      if (!byLen.has(k)) byLen.set(k, []);
      byLen.get(k).push(w);
    }
    const index = new Map();
    const stats = { total: 0, withPseudo: 0, pseudoOnly: 0 };
    for (const w of targets) {
      const cands = [];
      const sw = silhs.get(w);
      for (let L = w.length - 2; L <= w.length + 2; L++) {
        const bucket = byLen.get(L);
        if (!bucket) continue;
        for (const c of bucket) {
          if (c === w) continue;
          const d = levenshtein(w, c);
          if (d > 2) continue;
          let score = (3 - d) * 3;
          const dl = Math.abs(c.length - w.length);
          score += dl === 0 ? 2 : dl === 1 ? 1 : 0;
          if (c[0] === w[0]) score += 2;
          if (silhs.get(c) === sw) score += 3;
          if (c[c.length - 1] === w[w.length - 1]) score += 1;
          cands.push({ w: c, score, pseudo: false });
        }
      }
      cands.sort((a, b) => b.score - a.score);
      let top = cands.slice(0, 8);
      stats.total++;
      if (top.length < 4) {
        const have = new Set(top.map(c => c.w));
        let guard = 0;
        while (top.length < 4 && guard++ < 40) {
          const p = makePseudoword(w, rng, realSet);
          if (p && !have.has(p)) { have.add(p); top.push({ w: p, score: 1, pseudo: true }); }
        }
        stats.withPseudo++;
        if (!top.some(c => !c.pseudo)) stats.pseudoOnly++;
      }
      index.set(w, top);
    }
    return { index, stats, realSet };
  }

  function getDistractors(indexObj, word, n, rng, exclude) {
    const list = (indexObj.index.get(word) || []).filter(c => !exclude.has(c.w));
    const pool = shuffle(rng, list.slice(0, 6));
    const out = [];
    for (const c of pool) {
      if (out.length >= n) break;
      if (!out.includes(c.w)) out.push(c.w);
    }
    let guard = 0;
    while (out.length < n && guard++ < 30) {
      const p = makePseudoword(word, rng, indexObj.realSet);
      if (p && !out.includes(p) && !exclude.has(p)) out.push(p);
    }
    return out;
  }

  // ---------------- Spell-It tile sets ------------------------
  function tileSetFor(word, rng) {
    const letters = word.split("");
    const nDecoys = word.length > 9 ? 2 : 3;
    const decoys = [];
    for (const i of shuffle(rng, letters.map((_, k) => k))) {
      if (decoys.length >= nDecoys) break;
      const opts = DATA.CONFUSIONS[letters[i]];
      if (!opts) continue;
      const p = pick(rng, opts);
      if (!word.includes(p) && !decoys.includes(p)) decoys.push(p);
    }
    for (const c of shuffle(rng, DATA.COMMON_DECOY_LETTERS.split(""))) {
      if (decoys.length >= nDecoys) break;
      if (!word.includes(c) && !decoys.includes(c)) decoys.push(c);
    }
    const tiles = shuffle(rng, [...letters, ...decoys]).map((ch, i) => ({ id: i, ch, used: false }));
    return tiles;
  }

  // ---------------- Word picking ------------------------------
  function pickWord(tierEff, rng, exclude) {
    let tier = tierEff;
    if (tier > 1 && rng() < CONFIG.EASY_MIX) tier -= 1;
    for (const t of [tier, tierEff, 1]) {
      const bank = DATA.TIERS[t - 1].filter(w => !exclude.has(w));
      if (bank.length) return { word: pick(rng, bank), tier: t };
    }
    return { word: pick(rng, DATA.TIERS[0]), tier: 1 };
  }

  // ---------------- Save schema (pure helpers) ----------------
  const SAVE_VERSION = 1;
  function makeDefaultSave() {
    return {
      v: SAVE_VERSION,
      profiles: [],
      shared: { library: 0 },
      settings: { muted: false, tts: true }
    };
  }
  function newProfile(name, colour) {
    return {
      id: "p" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      name, colour,
      coins: 0, bestFloor: 0, wordsFreed: 0, runsPlayed: 0,
      tier: 1, tierVotes: 0, tierCooldown: 0,
      wordStats: {}, storyPages: 0, chaptersRead: 0,
      recent: { 1: [], 2: [], 3: [], 4: [], 5: [] },
      reviewPouch: [],
      unlocks: { cosmetics: [], pets: [], upgrades: [] },
      equipped: {},
      lastGift: null,
      createdAt: Date.now()
    };
  }
  function recordAnswer(profile, tier, ok) {
    const arr = profile.recent[tier] || (profile.recent[tier] = []);
    arr.push(ok ? 1 : 0);
    if (arr.length > 20) arr.shift();
  }
  function validateSave(obj) {
    if (!obj || typeof obj !== "object") return null;
    if (obj.v !== SAVE_VERSION) return null;
    if (!Array.isArray(obj.profiles)) return null;
    return obj;
  }

  // ---------------- Run state machine -------------------------
  // Phases: wave | spell | boss | treasure | rest | doors | runEnd
  function createRun(opts) {
    const rng = mulberry32(opts.rngSeed || (Date.now() & 0xffffffff));
    const indexObj = opts.indexObj; // shared, prebuilt
    const baseTier = clamp(opts.tier || 1, 1, DATA.MAX_TIER);
    // Modifiers from owned pets + upgrades (see DATA.SHOP)
    const M = Object.assign({
      extraHearts: 0,     // Cat, Golden Heart
      slowMul: 1,         // Sloth, Patience Charm  (lower = slower blots)
      coinMult: 1,        // Coin Magnet
      shield: false,      // Second-Chance Shield: one forgiven mistake per floor
      owl: false,         // reveals first letter, once per floor
      dragonet: false,    // burns one decoy tile in Spell-It
      revealBonus: 0      // Bright Lantern: longer word reveal (used by UI)
    }, opts.mods || {});
    const maxHearts = (opts.maxHearts || CONFIG.HEARTS) + M.extraHearts;

    const R = {
      phase: "none",
      floor: 0, floorKind: "battle", mode: "match",
      hearts: maxHearts, maxHearts,
      runCoins: 0,
      streak: 0, bestStreak: 0,
      stormCharge: 0, stormReady: false,
      wordsFreed: [],
      wordLog: [],           // {word, ok} — per-word mastery evidence
      answers: [],           // {tier, ok} — for adaptive data
      reviewPouch: [],       // escaped/missed words (new this run)
      pouchCleared: [],      // review words they nailed
      pouchMissed: [],       // review words still tricky
      promptReview: false,
      storyPages: 0,
      blots: [], prompt: null, promptTier: baseTier,
      spell: null, boss: null,
      rhyme: null, odd: null, sentence: null, flash: null,

      R.answers.push({ tier, ok: false });
    }

    // ---- floors ----
    function enterFloor(kind) {
      R.floor++;
      R.floorKind = kind;
      R._usedWords.clear();
      R._coinMult = 1; R._tierBoost = 0;
      R.doors = []; R.treasure = null; R.rest = null; R.spell = null; R.boss = null;
      R.blots = []; R.prompt = null;
      R.rhyme = null; R.odd = null; R.sentence = null; R.flash = null;

      R.shieldReady = M.shield;      // shield recharges every floor
      R._slowT = M.slowMul;          // slow-motion bubble expires with the floor
      R._owlUsed = false;
      R._floorPenalty = 0;
      if (R._doubleNext) { R._coinMult *= 2; R._doubleNext = false; }
      R._tierBoost += Math.floor(R.floor / CONFIG.DEEP_TIER_EVERY);   // the tower deepens
      if (kind === "challenge") { R._tierBoost += 1; R._coinMult *= CONFIG.CHALLENGE_MULT; }
      if (kind === "shop") {
        R.phase = "shop";
        R.shop = { items: rollShop(), bought: [] };
        emit({ t: "floorStart", floor: R.floor, kind, mode: null });
        return;
      }

      if (kind === "battle" || kind === "challenge") {
        R.mode = nextMode();
        R._lastMode = R.mode;
        emit({ t: "floorStart", floor: R.floor, kind, mode: R.mode });
        startMode(R.mode);
      } else if (kind === "treasure") {
        R.phase = "treasure";
        R.treasure = {
          opened: false,
          amount: CONFIG.TREASURE_BASE + CONFIG.TREASURE_PER_FLOOR * Math.min(R.floor, CONFIG.REWARD_CAP_FLOOR)
        };
        emit({ t: "floorStart", floor: R.floor, kind, mode: null });
      } else if (kind === "rest") {
        R.phase = "rest";
        R.rest = { taken: false, healed: 0, coins: 0 };
        emit({ t: "floorStart", floor: R.floor, kind, mode: null });
      } else if (kind === "boss") {
        emit({ t: "floorStart", floor: R.floor, kind, mode: "boss" });
        startBoss();
      }
    }

    function finishRoom(clearBonus) {
      if (clearBonus) {
        const depth = Math.min(R.floor, CONFIG.REWARD_CAP_FLOOR);
        const c = grant((CONFIG.CLEAR_BASE + depth) * R._coinMult, "clear");
        emit({ t: "floorClear", floor: R.floor, coins: c });
      }
      makeDoors();
    }

    function makeDoors() {
      const next = R.floor + 1;
      if (next % CONFIG.BOSS_EVERY === 0) {
        R.doors = [{ type: "boss", label: "Boss", icon: "👑" }];
      } else {
        const opts = [
          { type: "battle", label: "Battle", icon: "🗡️", w: 0.40 },
          { type: "treasure", label: "Treasure", icon: "💰", w: 0.22 },
          { type: "rest", label: "Rest", icon: "❤️", w: R.hearts < R.maxHearts ? 0.20 : 0.06 }
        ];
        if (next >= 3) opts.push({ type: "challenge", label: "Challenge", icon: "⭐", w: 0.18 });
        if (next >= 2) opts.push({ type: "shop", label: "Shop", icon: "🛒", w: 0.18 });
        const count = rng() < 0.35 ? 2 : Math.min(3, opts.length);
        const chosen = [];
        const pool = opts.slice();
        while (chosen.length < count && pool.length) {
          const total = pool.reduce((s, o) => s + o.w, 0);
          let r = rng() * total;
          let idx = 0;
          for (let i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) { idx = i; break; } }
          chosen.push(pool.splice(idx, 1)[0]);
        }
        R.doors = shuffle(rng, chosen).map(o => ({ type: o.type, label: o.label, icon: o.icon }));
      }
      R.phase = "doors";
      emit({ t: "doors", options: R.doors });
    }

    // ---- Mode rotation ----
    // Keeps it fresh; never the same mode twice running. Comprehension modes
    // (sentence/odd) unlock a little later so floor 1 is always simple.
    // Word Match is the only mode where monsters can actually reach you, so it
    // carries most of the run's risk. Weight it heavily or the tower gets safe
    // and a good reader simply climbs forever.
    function nextMode() {
      const pool = [
        { m: "match", w: 0.40 },
        { m: "spell", w: 0.22 }
      ];
      if (R.floor >= 2) pool.push({ m: "rhyme", w: 0.12 });
      if (R.floor >= 3) pool.push({ m: "flash", w: 0.12 });
      if (R.floor >= 4) pool.push({ m: "odd", w: 0.07 }, { m: "sentence", w: 0.07 });
      const choices = pool.filter(o => o.m !== R._lastMode);
      const list = choices.length ? choices : pool;
      const total = list.reduce((s2, o) => s2 + o.w, 0);
      let r = rng() * total;
      for (const o of list) { r -= o.w; if (r <= 0) return o.m; }
      return list[0].m;
    }
    function startMode(m) {
      if (m === "match") startMatchFloor();
      else if (m === "spell") startSpellFloor();
      else if (m === "rhyme") startRhymeFloor();
      else if (m === "odd") startOddFloor();
      else if (m === "sentence") startSentenceFloor();
      else if (m === "flash") startFlashFloor();
      else startMatchFloor();
    }

    // ---- Rhyme Time: tap everything that rhymes ----
    function startRhymeFloor() {
      R.phase = "rhyme";
      const fam = pick(rng, DATA.RHYMES);
      const nRhyme = Math.min(fam.rhymes.length, 2 + Math.floor(rng() * 2)); // 2–3
      const rhymes = shuffle(rng, fam.rhymes).slice(0, nRhyme);
      const foils = shuffle(rng, fam.foils).slice(0, Math.max(2, 5 - nRhyme));
      const cards = shuffle(rng, [
        ...rhymes.map(w => ({ word: w, ok: true, tapped: false })),
        ...foils.map(w => ({ word: w, ok: false, tapped: false }))
      ]);
      R.rhyme = { key: fam.key, cards, found: 0, need: rhymes.length };
      emit({ t: "rhymeStart", key: fam.key, need: rhymes.length });
      emit({ t: "speak", word: fam.key });
    }
    function tapRhyme(i) {
      if (R.phase !== "rhyme" || R._pendingAction) return;
      const c = R.rhyme.cards[i];
      if (!c || c.tapped) return;
      c.tapped = true;
      if (c.ok) {
        correctAnswered(effTier());
        logWord(c.word, true);
        R.rhyme.found++;
        R.wordsFreed.push(c.word);
        const coins = puzzlePay(CONFIG.ZAP);
        emit({ t: "rhymeHit", idx: i, word: c.word, coins, left: R.rhyme.need - R.rhyme.found });
        if (R.rhyme.found >= R.rhyme.need) {
          schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
        }
      } else {
        wrongAnswered(effTier());
        logWord(c.word, false);
        emit({ t: "rhymeMiss", idx: i, word: c.word });
        puzzleMiss();
      }
    }

    // ---- Odd One Out ----
    function startOddFloor() {
      R.phase = "odd";
      R._oddRound = 0;
      loadOdd();
    }
    function loadOdd() {
      const cat = pick(rng, DATA.CATEGORIES);
      // Never draw the odd word from an overlapping category — "is an owl an
      // animal or a thing that flies?" is a fair argument, not a puzzle.
      const conflicts = cat.conflicts || [];
      const others = DATA.CATEGORIES.filter(c =>
        c.name !== cat.name &&
        !conflicts.includes(c.name) &&
        !(c.conflicts || []).includes(cat.name));
      const oddCat = pick(rng, others);
      const inWords = shuffle(rng, cat.words).slice(0, 3);
      const oddWord = pick(rng, oddCat.words.filter(w => !cat.words.includes(w)));
      const cards = shuffle(rng, [
        ...inWords.map(w => ({ word: w, odd: false, out: false })),
        { word: oddWord, odd: true, out: false }
      ]);
      R.odd = {
        category: cat.name, cards, done: false,
        round: R._oddRound + 1, total: CONFIG.ODD_ROUNDS
      };
      emit({ t: "oddStart", category: cat.name, round: R.odd.round, total: R.odd.total });
    }
    function tapOdd(i) {
      if (R.phase !== "odd" || R.odd.done || R._pendingAction) return;
      const c = R.odd.cards[i];
      if (!c || c.out) return;
      if (c.odd) {
        R.odd.done = true;
        correctAnswered(effTier());
        logWord(c.word, true);
        R.wordsFreed.push(c.word);
        const coins = puzzlePay(CONFIG.SPELL_WORD + 2);
        emit({ t: "oddHit", idx: i, word: c.word, coins });
        R._oddRound++;
        if (R._oddRound >= CONFIG.ODD_ROUNDS) schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
        else schedule(CONFIG.WAVE_DELAY, loadOdd);
      } else {
        wrongAnswered(effTier());
        c.out = true;                 // crossed out, so they close in on the answer
        emit({ t: "oddMiss", idx: i, word: c.word });
        puzzleMiss();
      }
    }

    // ---- Sentence Gate ----
    function bandFor(t) { return t <= 2 ? 1 : t <= 3 ? 2 : 3; }
    function startSentenceFloor() {
      R.phase = "sentence";
      R._sentRound = 0;
      loadSentence();
    }
    function loadSentence() {
      const band = bandFor(effTier());
      const pool = DATA.SENTENCES.filter(s2 => s2.band === band && !R._usedWords.has(s2.text));
      const s2 = pick(rng, pool.length ? pool : DATA.SENTENCES.filter(x => x.band === band));
      R._usedWords.add(s2.text);
      R.sentence = {
        text: s2.text, answer: s2.answer,
        options: shuffle(rng, s2.options.slice()),
        out: [], done: false,
        round: R._sentRound + 1, total: CONFIG.SENTENCE_ROUNDS
      };
      emit({ t: "sentenceStart", text: s2.text, round: R.sentence.round, total: R.sentence.total });
    }
    function tapSentence(i) {
      if (R.phase !== "sentence" || R.sentence.done || R._pendingAction) return;
      const opt = R.sentence.options[i];
      if (!opt || R.sentence.out.includes(i)) return;
      if (opt === R.sentence.answer) {
        R.sentence.done = true;
        correctAnswered(effTier());
        logWord(opt, true);
        R.wordsFreed.push(opt);
        const coins = puzzlePay(CONFIG.SPELL_WORD + 3);
        emit({ t: "sentenceHit", idx: i, word: opt, coins });
        R._sentRound++;
        if (R._sentRound >= CONFIG.SENTENCE_ROUNDS) schedule(CONFIG.WAVE_DELAY + 0.4, () => finishRoom(true));
        else schedule(CONFIG.WAVE_DELAY + 0.4, loadSentence);
      } else {
        wrongAnswered(effTier());
        logWord(R.sentence.answer, false);
        R.sentence.out.push(i);
        emit({ t: "sentenceMiss", idx: i, word: opt });
        puzzleMiss();
      }
    }

    // ---- Speedy Flash ----
    function startFlashFloor() {
      R.phase = "flash";
      R._flashRound = 0;
      loadFlash();
    }
    function loadFlash() {
      const { word, tier } = pickWord(effTier(), rng, R._usedWords);
      R._usedWords.add(word);
      const ds = getDistractors(indexObj, word, 3, rng, new Set([word]));
      R.flash = {
        word, tier,
        options: shuffle(rng, [word, ...ds]),
        showFor: CONFIG.FLASH_TIME + M.revealBonus,
        out: [], shown: true, done: false,
        round: R._flashRound + 1, total: CONFIG.FLASH_ROUNDS
      };
      emit({ t: "flashStart", word, showFor: R.flash.showFor, round: R.flash.round, total: R.flash.total });
      emit({ t: "speak", word });
      schedule(R.flash.showFor, () => {
        if (R.flash) { R.flash.shown = false; emit({ t: "flashHide" }); }
      });
    }
    function tapFlash(i) {
      if (R.phase !== "flash" || R.flash.shown || R.flash.done || R._pendingAction) return;
      const opt = R.flash.options[i];
      if (!opt || R.flash.out.includes(i)) return;
      if (opt === R.flash.word) {
        R.flash.done = true;
        correctAnswered(R.flash.tier);
        logWord(opt, true);
        R.wordsFreed.push(opt);
        const coins = puzzlePay(CONFIG.SPELL_WORD + 1);
        emit({ t: "flashHit", idx: i, word: opt, coins });
        R._flashRound++;
        if (R._flashRound >= CONFIG.FLASH_ROUNDS) schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
        else schedule(CONFIG.WAVE_DELAY, loadFlash);
      } else {
        wrongAnswered(R.flash.tier);
        logWord(R.flash.word, false);
        R.flash.out.push(i);
        emit({ t: "flashMiss", idx: i, word: opt });
        puzzleMiss();
      }
    }

    // A miss in the puzzle rooms. Per the brief, pressure only ever comes from
    // monster proximity — so these cost the streak and the floor's payout,
    // never a heart. Guessing is punished in the currency kids actually care about.
    function puzzleMiss() {
      R._floorPenalty = (R._floorPenalty || 0) + 1;
      emit({ t: "puzzleMiss", penalty: R._floorPenalty });
    }
    function puzzlePay(base) {
      const mult = Math.max(0.25, 1 - 0.35 * (R._floorPenalty || 0));
      return grant(Math.max(1, Math.round(base * mult)) * R._coinMult, "puzzle");
    }

    // ---- Word Match ----
    function startMatchFloor() {
      R.phase = "wave";
      R._wavesTotal = R.floor < CONFIG.WAVES_LATE_FLOOR ? CONFIG.WAVES_EARLY : CONFIG.WAVES_LATE;
      R._waveIdx = 0;
      spawnWave();
    }
    function blotCount() {
      return R.floor >= CONFIG.BLOTS_LATE_FLOOR ? CONFIG.BLOTS_LATE : CONFIG.BLOTS_EARLY;
    }
    function waveDuration() {
      return Math.max(CONFIG.DUR_MIN,
        CONFIG.DUR_BASE - CONFIG.DUR_PER_FLOOR * (R.floor - 1) - CONFIG.DUR_PER_WAVE * R._waveIdx);
    }
    function spawnWave() {
      const n = blotCount();
      const t = effTier();
      // A word they got wrong resurfaces a couple of floors later — and pays.
      let word, tier, isReview = false;
      const due = R._pouch.find(e => e.due <= R.floor && !R._usedWords.has(e.word));
      if (due && rng() < 0.7) {
        word = due.word; tier = t; isReview = true;
      } else {
        const p2 = pickWord(t, rng, R._usedWords);
        word = p2.word; tier = p2.tier;
      }
      R._usedWords.add(word);
      R.prompt = word; R.promptTier = tier; R.promptReview = isReview;
      const ds = getDistractors(indexObj, word, n - 1, rng, R._usedWords);
      const words = shuffle(rng, [word, ...ds]);
      const lanes = shuffle(rng, n === 3 ? [0.22, 0.5, 0.78] : [0.15, 0.38, 0.62, 0.85]);
      const D = waveDuration();
      R.blots = words.map((w, i) => ({
        word: w, isTarget: w === word,
        progress: -0.06 * i,
        speed: (1 / D) * (0.95 + rng() * 0.1),
        lane: lanes[i], seed: rng(),
        alive: true, fleeing: false, wrongAt: 0, lockT: 0
      }));
      emit({ t: "wave", index: R._waveIdx, total: R._wavesTotal, word });
      emit({ t: "speak", word });
    }
    function resolveWave(freedByStorm) {
      for (const b of R.blots) if (b.alive) { b.alive = false; b.fleeing = true; }
      R._waveIdx++;
      if (R._waveIdx >= R._wavesTotal) {
        schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
      } else {
        schedule(CONFIG.WAVE_DELAY, spawnWave);
      }
    }

    function tapBlot(i) {
      if (R.phase !== "wave") return;
      const b = R.blots[i];
      if (!b || !b.alive) return;
      if (b.lockT > 0) return;          // briefly un-tappable after a wrong guess
      if (b.isTarget) {
        const bonus = R.streak + 1 >= CONFIG.STREAK_MIN ? CONFIG.STREAK_BONUS : 0;
        correctAnswered(R.promptTier);
        logWord(b.word, true);
        let c = grant((CONFIG.ZAP + bonus) * R._coinMult, "zap");
        R.wordsFreed.push(b.word);
        b.alive = false;
        if (R.promptReview) {
          // mistakes literally become treasure
          const extra = grant(CONFIG.REVIEW_BONUS, "review");
          c += extra;
          R._pouch = R._pouch.filter(e => e.word !== b.word);
          R.pouchCleared.push(b.word);
          emit({ t: "reviewWin", word: b.word, coins: extra });
        }
        emit({ t: "zap", idx: i, word: b.word, coins: c, streak: R.streak });
        resolveWave(false);
      } else {
        wrongAnswered(R.promptTier);
        logWord(R.prompt, false);
        b.wrongAt = 1;
        b.lockT = CONFIG.WRONG_LOCK;
        // Guessing costs runway, not hearts: everything lurches closer.
        for (const o of R.blots) {
          if (o.alive) o.progress = Math.min(0.985, o.progress + CONFIG.SURGE);
        }
        if (!R.reviewPouch.includes(R.prompt)) R.reviewPouch.push(R.prompt);
        if (R.promptReview) R.pouchMissed.push(R.prompt);
        emit({ t: "wrong", idx: i, surge: CONFIG.SURGE });
      }
    }

    function useSkip() {
      if (R.skipTokens <= 0) return;
      if (R.phase === "wave") {
        R.skipTokens--;
        const target = R.blots.find(b => b.isTarget);
        if (target) target.alive = false;
        emit({ t: "skip", word: R.prompt });
        resolveWave(true);
      } else if (R.phase === "spell") {
        R.skipTokens--;
        const s = R.spell;
        emit({ t: "skip", word: s.words[s.idx].word });
        s.idx++;
        if (s.idx >= s.total) schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
        else schedule(CONFIG.WAVE_DELAY, loadSpellWord);
      }
    }

    function tapStorm() {
      if (!R.stormReady || R.phase !== "wave") return;
      R.stormReady = false; R.stormCharge = 0;
      const target = R.blots.find(b => b.isTarget);
      let c = 0;
      if (target && target.alive) {
        R.wordsFreed.push(target.word);
        c = grant(CONFIG.ZAP * R._coinMult + CONFIG.STORM_BONUS, "storm");
        target.alive = false;
      }
      emit({ t: "storm", coins: c, word: target ? target.word : null });
      resolveWave(true);
    }

    // ---- Spell-It ----
    function startSpellFloor() {
      R.phase = "spell";
      const words = [];
      for (let i = 0; i < CONFIG.SPELL_WORDS_PER_FLOOR; i++) {
        const { word, tier } = pickWord(effTier(), rng, R._usedWords);
        R._usedWords.add(word);
        words.push({ word, tier });
      }
      R.spell = { words, idx: 0, slots: [], tiles: [], fails: 0, hints: false, total: words.length };
      loadSpellWord();
    }
    function loadSpellWord() {
      const s = R.spell;
      const w = s.words[s.idx].word;
      s.slots = new Array(w.length).fill(null);
      s.tiles = tileSetFor(w, rng);
      s.fails = 0; s.hints = false;
      s.firstLetter = false;
      // Dragonet burns away one decoy tile
      if (M.dragonet) {
        // burn a tile whose letter appears more often in the tiles than in the word
        let burn = -1;
        for (let i = 0; i < s.tiles.length; i++) {
          const ch = s.tiles[i].ch;
          const inWord = w.split("").filter(c => c === ch).length;
          const inTiles = s.tiles.filter(t => t.ch === ch).length;
          if (inTiles > inWord) { burn = i; break; }
        }
        if (burn >= 0) {
          const gone = s.tiles.splice(burn, 1)[0];
          emit({ t: "dragonet", ch: gone.ch });
        }
      }
      // Owl reveals the first letter, once per floor
      if (M.owl && !R._owlUsed) {
        R._owlUsed = true;
        s.firstLetter = true;
        emit({ t: "owl", ch: w[0] });
      }
      emit({ t: "spellWord", word: w, index: s.idx, total: s.total, boss: R.phase === "boss" });
      emit({ t: "speak", word: w });
    }
    function currentSpellWord() {
      const s = R.spell; return s ? s.words[s.idx].word : null;
    }
    function tapTile(id) {
      if (R.phase !== "spell" && R.phase !== "boss") return;
      const s = R.spell;
      const tile = s.tiles.find(t => t.id === id);
      if (!tile || tile.used) return;
      const slot = s.slots.indexOf(null);
      if (slot === -1) return;
      s.slots[slot] = { ch: tile.ch, tileId: id };
      tile.used = true;
      emit({ t: "tileTap", slot, ch: tile.ch });
      if (s.slots.indexOf(null) === -1) checkSpell();
    }
    function tapBackspace() {
      if (R.phase !== "spell" && R.phase !== "boss") return;
      const s = R.spell;
      for (let i = s.slots.length - 1; i >= 0; i--) {
        if (s.slots[i]) {
          const tile = s.tiles.find(t => t.id === s.slots[i].tileId);
          if (tile) tile.used = false;
          s.slots[i] = null;
          emit({ t: "backspace", slot: i });
          return;
        }
      }
    }
    function checkSpell() {
      const s = R.spell;
      const word = s.words[s.idx].word;
      const attempt = s.slots.map(x => x.ch).join("");
      const isBoss = R.phase === "boss";
      if (attempt === word) {
        correctAnswered(s.words[s.idx].tier);
        logWord(word, true);
        R.wordsFreed.push(word);
        if (isBoss) {
          R.boss.segmentsDone++;
          emit({ t: "bossHit", segment: R.boss.segmentsDone, word });
          if (R.boss.segmentsDone >= 3) {
            const c = grant(CONFIG.BOSS_COINS * R._coinMult, "boss");
            R.storyPages++;
            emit({ t: "bossDown", coins: c, floor: R.floor, page: R.storyPages });
            schedule(1.4, () => finishRoom(false));
          } else {
            s.idx++;
            schedule(0.9, loadSpellWord);
          }
        } else {
          const c = grant(CONFIG.SPELL_WORD * R._coinMult, "spell");
          emit({ t: "spellSolve", word, coins: c, streak: R.streak });
          s.idx++;
          if (s.idx >= s.total) schedule(CONFIG.WAVE_DELAY, () => finishRoom(true));
          else schedule(CONFIG.WAVE_DELAY, loadSpellWord);
        }
      } else {
        wrongAnswered(s.words[s.idx].tier);
        logWord(word, false);
        s.fails++;
        // return tiles
        for (const slot of s.slots) {
          const tile = s.tiles.find(t => t.id === slot.tileId);
          if (tile) tile.used = false;
        }
        s.slots = new Array(word.length).fill(null);
        const hintAt = isBoss ? 1 : 2;
        if (s.fails >= hintAt && !s.hints) { s.hints = true; emit({ t: "hintsOn", word }); }
        emit({ t: "spellFail", fails: s.fails });
        if (isBoss) {
          loseHeart("boss");
        }
      }
    }

    // ---- Boss ----
    function startBoss() {
      R.phase = "boss";
      const t = effTier();
      const bank = DATA.TIERS[t - 1].filter(w => !R._usedWords.has(w));
      const sorted = bank.slice().sort((a, b) => a.length - b.length);
      const third = Math.max(1, Math.floor(sorted.length / 3));
      const easy = pick(rng, sorted.slice(0, third));
      const med = pick(rng, sorted.slice(third, third * 2).filter(w => w !== easy));
      const hard = pick(rng, sorted.slice(third * 2).filter(w => w !== easy && w !== med));
      const words = [easy, med, hard].map(w => { R._usedWords.add(w); return { word: w, tier: t }; });
      R.boss = { segmentsDone: 0, isQueen: R.floor === 25 };

      if (!this.available) return;
      let vs = [];
      try { vs = speechSynthesis.getVoices() || []; } catch (e) { return; }
      if (!vs.length) return;
      // Android reports "en_GB" as often as "en-GB", and casing varies.
      const norm = v => String(v.lang || "").toLowerCase().replace(/_/g, "-");
      // HARD FILTER: only ever consider English voices. Picking the top of an
      // unfiltered list is how a French voice ends up reading English words.
      const english = vs.filter(v => norm(v).startsWith("en") ||
        /english|united kingdom|ireland|irish|british/i.test(v.name || ""));
      if (!english.length) {
        // No English voice at all: leave voice null and let the engine choose
        // via utterance.lang rather than forcing a foreign-accent voice.
        this.voice = null;
        this.status = "no English voice installed";
        return;
      }
      const score = v => {
        const l = norm(v), n = String(v.name || "");
        if (l.startsWith("en-ie")) return 6;
        if (l.startsWith("en-gb")) return 5;
        if (/ireland|irish/i.test(n)) return 4;
        if (/united kingdom|british/i.test(n)) return 3;
        if (l.startsWith("en-au") || l.startsWith("en-nz")) return 2; // closer than US
        if (l.startsWith("en")) return 1;
        return 0;
      };
      this.voice = english.slice().sort((a, b) => score(b) - score(a))[0] || null;
    },
    init() {
      if (!this.available || this.tried) return;
      this.tried = true;
      this.pickVoice();
      // warm up the engine inside the user gesture (Android/Chrome)
      try {
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0; speechSynthesis.speak(u);
      } catch (e) { }
    },
    speak(word) {
      if (!this.on || !word) return;
      if (!this.available) { this.status = "no speechSynthesis in this browser"; return; }
      if (!this.voice) this.pickVoice();   // voices frequently load after boot
      try {
        // Must run SYNCHRONOUSLY inside the user gesture: Android Chrome
        // ignores speak() calls deferred by setTimeout out of user activation.
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        speechSynthesis.resume(); // un-stick paused engines (Android quirk)
        const u = new SpeechSynthesisUtterance(word);
        if (this.voice) u.voice = this.voice;
        u.lang = (this.voice && this.voice.lang) || "en-GB";
        u.rate = 0.92; u.pitch = 1.0; u.volume = 1;
        u.onstart = () => { this.spoke = true; this.failed = false; this.status = "speaking"; };
        u.onerror = (ev) => {
          const err = (ev && ev.error) || "error";
          if (err === "interrupted" || err === "canceled") return;
          this.status = "error: " + err;
          if (!this.spoke) this.failed = true;
        };
        this.attempts++;
        speechSynthesis.speak(u);
      } catch (e) {
        this.failed = true;
        this.status = "threw: " + (e && e.message);
      }
    },
    diagnose() {
      if (!this.available) return "speechSynthesis missing (in-app browser?)";
      let n = 0;
      try { n = speechSynthesis.getVoices().length; } catch (e) { }
      const v = this.voice
        ? (this.voice.name || "?") + " (" + (this.voice.lang || "?") + ")"
        : "engine default (en-GB)";
      return "Voice: " + v + " · " + n + " installed";
    }
  };
  // Kick voice loading immediately — in Chrome the first getVoices() call
  // is what starts the async load, so by the first tap they exist.
  if ("speechSynthesis" in window) {
    try {
      speechSynthesis.addEventListener("voiceschanged", () => TTS.pickVoice());
      TTS.pickVoice();
    } catch (e) { }
  }

  // ---------------- Canvas & view ------------------------------
  let cv, cx, S = 1, OX = 0, OY = 0, DEVW = 0, DEVH = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    DEVW = Math.floor(innerWidth * dpr); DEVH = Math.floor(innerHeight * dpr);
    cv.width = DEVW; cv.height = DEVH;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    S = Math.min(DEVW / W, DEVH / H);
    OX = (DEVW - W * S) / 2; OY = (DEVH - H * S) / 2;
  }
  function toLogical(e) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    return { x: (e.clientX * dpr - OX) / S, y: (e.clientY * dpr - OY) / S };
  }

  // ---------------- Particles & FX ----------------------------
  const parts = [];       // generic particles
  const coinsFly = [];    // vacuuming coins
  const butterflies = []; // word-rescue set pieces
  let zapLine = null, shakeT = 0, shakeMag = 0, dimT = 0;

  function spSparkle(x, y, col, n, spd) {
    for (let i = 0; i < (n || 10); i++) {
      const a = rnd() * Math.PI * 2, v = (spd || 90) * (0.4 + rnd() * 0.8);
      parts.push({ k: "sp", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: 0.5 + rnd() * 0.4, col, r: 2 + rnd() * 3 });
    }
  }
  function spConfetti(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        k: "cf", x: rnd() * W, y: -20 - rnd() * 120,
        vx: (rnd() - 0.5) * 60, vy: 90 + rnd() * 120, rot: rnd() * 6, vr: (rnd() - 0.5) * 8,
        t: 0, life: 2.4 + rnd(), col: [PAL.gold, PAL.mint, PAL.heart, "#c9a6ff", "#fff"][i % 5], r: 4 + rnd() * 4
      });
    }
  }
  function spInk(x, y, n) {
    for (let i = 0; i < (n || 8); i++) {
      const a = rnd() * Math.PI * 2, v = 70 * (0.3 + rnd());
      parts.push({ k: "ink", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.5 + rnd() * 0.3, col: PAL.blotHi, r: 3 + rnd() * 5 });
    }
  }
  function spCoins(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (rnd() - 0.5) * 2.2, v = 140 * (0.5 + rnd() * 0.8);
      coinsFly.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, hover: 0.30 + rnd() * 0.2, arrived: false });
    }
  }
  function spButterfly(word, x, y) {
    butterflies.push({ word, x, y, t: 0, phase: 0, lx: x, ly: y });
  }
  function shake(mag) { shakeT = 0.25; shakeMag = mag; }

  function updateFX(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.t += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === "sp" || p.k === "ink") p.vy += 160 * dt;
      if (p.k === "cf") { p.rot += p.vr * dt; p.vx += Math.sin(p.t * 6 + p.y) * 10 * dt; }
      if (p.t > p.life || p.y > H + 40) parts.splice(i, 1);
    }
    const tgt = { x: W - 52, y: 46 };
    for (let i = coinsFly.length - 1; i >= 0; i--) {
      const c = coinsFly[i]; c.t += dt;
      if (c.t < c.hover) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 300 * dt; }
      else {
        const k = 1 - Math.pow(0.0007, dt); // exponential chase
        c.x = lerp(c.x, tgt.x, k * 1.6); c.y = lerp(c.y, tgt.y, k * 1.6);
        if (Math.abs(c.x - tgt.x) < 10 && Math.abs(c.y - tgt.y) < 10) {
          coinsFly.splice(i, 1);
          G.dispCoins = Math.min(G.dispCoins + 1, targetCoins());
          if (coinsFly.length % 3 === 0) Audio2.play("coin");
          continue;
        }
      }
    }
    for (let i = butterflies.length - 1; i >= 0; i--) {
      const b = butterflies[i]; b.t += dt;
      if (b.t > 2.4) butterflies.splice(i, 1);
    }
    if (zapLine) { zapLine.t -= dt; if (zapLine.t <= 0) zapLine = null; }
    if (shakeT > 0) shakeT -= dt;
  }

  function drawFX() {
    for (const p of parts) {
      const a = 1 - p.t / p.life;
      cx.globalAlpha = clamp(a, 0, 1);
      cx.fillStyle = p.col;
      if (p.k === "cf") {
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r); cx.restore();
      } else {
        cx.beginPath(); cx.arc(p.x, p.y, p.r * (p.k === "ink" ? a : 1), 0, 7); cx.fill();
      }
    }
    cx.globalAlpha = 1;
    for (const c of coinsFly) drawCoin(c.x, c.y, 9);
    for (const b of butterflies) drawButterfly(b);
    if (zapLine) {
      cx.strokeStyle = PAL.mint; cx.lineWidth = 3.5; cx.globalAlpha = zapLine.t / 0.15;
      cx.beginPath();
      const { x1, y1, x2, y2 } = zapLine;
      cx.moveTo(x1, y1);
      const segs = 5;
      for (let i = 1; i <= segs; i++) {
        const t = i / segs;
        cx.lineTo(lerp(x1, x2, t) + (i < segs ? (rnd() - 0.5) * 22 : 0), lerp(y1, y2, t) + (i < segs ? (rnd() - 0.5) * 22 : 0));
      }
      cx.stroke(); cx.globalAlpha = 1;
    }
  }

  function drawButterfly(b) {
    // phase 1: word glows upward; phase 2: butterfly flutters away
    const p1 = 0.9;
    if (b.t < p1) {
      const t = easeOut(b.t / p1);
      const y = lerp(b.y, b.y - 90, t);
      cx.font = F(30, 800);
      cx.textAlign = "center"; cx.textBaseline = "middle";
      cx.globalAlpha = 0.9;
      cx.shadowColor = PAL.gold; cx.shadowBlur = 18 * t;
      cx.fillStyle = "#fff8e6";
      cx.fillText(b.word, b.x, y);
      cx.shadowBlur = 0; cx.globalAlpha = 1;
      b.lx = b.x; b.ly = y;
    } else {
      const t = (b.t - p1) / 1.5;
      const x = b.lx + t * 150 + Math.sin(t * 9) * 14;
      const y = b.ly - t * 240;
      const flap = Math.sin(b.t * 22) * 0.9;
      cx.save(); cx.translate(x, y); cx.globalAlpha = clamp(1.2 - t, 0, 1);
      cx.fillStyle = PAL.parch;
      cx.save(); cx.rotate(-0.3 - flap * 0.5);
      cx.beginPath(); cx.ellipse(-9, 0, 11, 7, 0, 0, 7); cx.fill(); cx.restore();
      cx.save(); cx.rotate(0.3 + flap * 0.5);
      cx.beginPath(); cx.ellipse(9, 0, 11, 7, 0, 0, 7); cx.fill(); cx.restore();
      cx.fillStyle = PAL.ink;
      cx.fillRect(-1.5, -7, 3, 14);
      cx.restore(); cx.globalAlpha = 1;
    }
  }

  // ---------------- Drawing helpers ----------------------------
  function drawCoin(x, y, r) {
    cx.fillStyle = PAL.goldDeep;
    cx.beginPath(); cx.arc(x, y + 1.5, r, 0, 7); cx.fill();
    cx.fillStyle = PAL.gold;
    cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
    cx.fillStyle = PAL.goldDeep;
    cx.font = F(r * 1.2, 800); cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText("¢".replace("¢", "✶"), x, y + 0.5);
  }
  function drawHeart(x, y, r, on) {
    cx.save(); cx.translate(x, y); cx.scale(r / 10, r / 10);
    cx.beginPath();
    cx.moveTo(0, 3);
    cx.bezierCurveTo(0, 0, -4, -3, -7, -1);
    cx.bezierCurveTo(-11, 2, -6, 8, 0, 12);
    cx.bezierCurveTo(6, 8, 11, 2, 7, -1);
    cx.bezierCurveTo(4, -3, 0, 0, 0, 3);
    cx.closePath();
    cx.fillStyle = on ? PAL.heart : "rgba(255,255,255,0.16)";
    cx.fill();
    if (on) { cx.fillStyle = "rgba(255,255,255,0.5)"; cx.beginPath(); cx.arc(-3, 1, 2.2, 0, 7); cx.fill(); }
    cx.restore();
  }
  function panel(x, y, w, h, r) {
    cx.fillStyle = "rgba(0,0,0,0.25)";
    rr(cx, x + 3, y + 5, w, h, r || 18); cx.fill();
    cx.fillStyle = PAL.parch;
    rr(cx, x, y, w, h, r || 18); cx.fill();
    cx.strokeStyle = PAL.parchShade; cx.lineWidth = 2;
    rr(cx, x + 4, y + 4, w - 8, h - 8, (r || 18) - 4); cx.stroke();
  }
  const hits = [];
  function button(x, y, w, h, label, fn, opts) {
    opts = opts || {};
    const base = opts.danger ? "#c4707c" : opts.gold ? PAL.gold : PAL.parch;
    const down = G.pressId === (opts.id || label);
    cx.fillStyle = "rgba(0,0,0,0.3)";
    rr(cx, x + 2, y + 4, w, h, 16); cx.fill();
    cx.fillStyle = down ? (opts.danger ? "#a85a66" : PAL.goldDeep) : base;
    rr(cx, x, y + (down ? 2 : 0), w, h, 16); cx.fill();
    cx.fillStyle = PAL.ink;
    const px = fitFont(cx, label, w - 24, opts.px || 24, 800);
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(label, x + w / 2, y + h / 2 + (down ? 2 : 0) + 1);
    hits.push({ x, y, w, h, fn, id: opts.id || label });
  }
  function iconButton(x, y, r, glyph, fn, id) {
    cx.fillStyle = "rgba(0,0,0,0.35)";
    cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,255,255,0.9)";
    cx.font = F(r * 1.1, 600); cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(glyph, x, y + 1);
    hits.push({ x: x - r, y: y - r, w: r * 2, h: r * 2, fn, id });
  }

  // eq: equipped map {hat, cape, wand, pet} — pass null for a bare wizard
  function drawWizard(x, y, sc, colour, pose, eq) {
    const t = G.time;
    const bob = Math.sin(t * 2.2) * 3 * sc;
    const E = eq || {};
    const item = id => (id && DATA.SHOP_INDEX[id]) || null;
    const hat = item(E.hat), cape = item(E.cape), wand = item(E.wand);
    cx.save(); cx.translate(x, y + bob); cx.scale(sc, sc);
    // shadow
    cx.fillStyle = "rgba(0,0,0,0.3)";
    cx.beginPath(); cx.ellipse(0, 46, 30, 8, 0, 0, 7); cx.fill();
    // cape (behind everything)
    if (cape) {
      const sway = Math.sin(t * 2.4) * 4;
      cx.fillStyle = cape.c;
      cx.beginPath();
      cx.moveTo(-14, -10);
      cx.quadraticCurveTo(-34 + sway, 16, -26 + sway, 46);
      cx.lineTo(26 + sway, 46);
      cx.quadraticCurveTo(34 + sway, 16, 14, -10);
      cx.closePath(); cx.fill();
      cx.fillStyle = "rgba(0,0,0,0.18)";
      cx.beginPath();
      cx.moveTo(0, -10); cx.lineTo(10 + sway, 46); cx.lineTo(-10 + sway, 46);
      cx.closePath(); cx.fill();
    }
    // robe
    cx.fillStyle = colour;
    cx.beginPath();
    cx.moveTo(-24, 44); cx.quadraticCurveTo(-30, 2, -12, -8);
    cx.lineTo(12, -8); cx.quadraticCurveTo(30, 2, 24, 44);
    cx.closePath(); cx.fill();
    cx.fillStyle = "rgba(0,0,0,0.15)";
    cx.beginPath(); cx.moveTo(0, -6); cx.lineTo(10, 44); cx.lineTo(-10, 44); cx.closePath(); cx.fill();
    // face
    cx.fillStyle = "#ffd9b8";
    cx.beginPath(); cx.arc(0, -18, 14, 0, 7); cx.fill();
    cx.fillStyle = PAL.ink;
    cx.beginPath(); cx.arc(-5, -19, 1.8, 0, 7); cx.arc(6, -19, 1.8, 0, 7); cx.fill();
    cx.strokeStyle = PAL.ink; cx.lineWidth = 1.6;
    cx.beginPath(); cx.arc(0.5, -14, 4, 0.15 * Math.PI, 0.85 * Math.PI); cx.stroke();
    // headgear
    drawHeadgear(hat, colour);
    // wand arm
    const raise = pose === "zap" ? -0.9 : Math.sin(t * 2.2) * 0.06;
    cx.save(); cx.translate(18, -2); cx.rotate(-0.5 + raise);
    cx.strokeStyle = wand && wand.id === "wand_bolt" ? "#c8a83a" : "#8a6b4a";
    cx.lineWidth = 4; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(26, -10); cx.stroke();
    const tipC = wand ? wand.c : PAL.mint;
    cx.save();
    cx.shadowColor = tipC; cx.shadowBlur = 10;
    cx.fillStyle = tipC; star(29, -12, 6);
    cx.restore();
    // wand trail sparkles
    if (wand && Math.random() < 0.25) {
      const gx = x + (29 * sc), gy = y + (-12 * sc) + bob;
      spSparkle(gx + (Math.random() - 0.5) * 10, gy + (Math.random() - 0.5) * 10, tipC, 1, 30);
    }
    cx.restore();
    cx.restore();
    if (E.pet) drawPet(x, y, sc, E.pet);
  }

  // Hats, in the girls' preferred register: adventurous, not frilly
  function drawHeadgear(hat, colour) {
    const c = hat ? hat.c : colour;
    const id = hat ? hat.id : "wizard";
    if (id === "goggles") {
      cx.fillStyle = "#6b5238";
      rr(cx, -16, -30, 32, 8, 3); cx.fill();
      cx.fillStyle = c;
      cx.beginPath(); cx.arc(-8, -26, 7, 0, 7); cx.arc(8, -26, 7, 0, 7); cx.fill();
      cx.fillStyle = "rgba(255,255,255,0.55)";
      cx.beginPath(); cx.arc(-10, -28, 2.4, 0, 7); cx.arc(6, -28, 2.4, 0, 7); cx.fill();
      return;
    }
    if (id === "horns") {
      cx.fillStyle = c;
      cx.beginPath(); cx.ellipse(0, -28, 20, 7, 0, 0, 7); cx.fill();
      cx.beginPath();
      cx.moveTo(-16, -30); cx.quadraticCurveTo(-26, -44, -12, -50);
      cx.quadraticCurveTo(-16, -40, -8, -32); cx.closePath(); cx.fill();
      cx.beginPath();
      cx.moveTo(16, -30); cx.quadraticCurveTo(26, -44, 12, -50);
      cx.quadraticCurveTo(16, -40, 8, -32); cx.closePath(); cx.fill();
      return;
    }
    if (id === "helm") {
      cx.fillStyle = c;
      cx.beginPath(); cx.arc(0, -26, 16, Math.PI, 0); cx.fill();
      rr(cx, -16, -27, 32, 8, 2); cx.fill();
      cx.fillStyle = "#d95763";
      rr(cx, -2, -48, 4, 18, 2); cx.fill();
      cx.beginPath(); cx.arc(0, -48, 5, 0, 7); cx.fill();
      return;
    }
    if (id === "ears") {
      cx.fillStyle = c;
      cx.beginPath(); cx.moveTo(-14, -26); cx.lineTo(-9, -42); cx.lineTo(-2, -28); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(14, -26); cx.lineTo(9, -42); cx.lineTo(2, -28); cx.closePath(); cx.fill();
      cx.fillStyle = "#ff9db0";
      cx.beginPath(); cx.moveTo(-11, -29); cx.lineTo(-9, -37); cx.lineTo(-5, -30); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(11, -29); cx.lineTo(9, -37); cx.lineTo(5, -30); cx.closePath(); cx.fill();
      return;
    }
    // classic pointy wizard hat (default + colour variants)
    cx.fillStyle = c;
    cx.beginPath(); cx.ellipse(0, -28, 22, 6, 0, 0, 7); cx.fill();
    cx.beginPath(); cx.moveTo(-13, -29); cx.quadraticCurveTo(2, -66, 10, -58);
    cx.quadraticCurveTo(8, -44, 13, -29); cx.closePath(); cx.fill();
    cx.fillStyle = PAL.gold;
    star(2, -50, 5);
  }

  // The pet trots along beside its wizard
  function drawPet(x, y, sc, petId) {
    const pet = DATA.SHOP_INDEX[petId];
    if (!pet) return;
    const t = G.time;
    const px = x - 42 * sc + Math.sin(t * 1.6) * 4 * sc;
    const py = y + 30 * sc + Math.sin(t * 3.1) * 3 * sc;
    cx.save();
    cx.translate(px, py);
    cx.scale(sc * 0.9, sc * 0.9);
    cx.fillStyle = "rgba(0,0,0,0.25)";
    cx.beginPath(); cx.ellipse(0, 14, 12, 4, 0, 0, 7); cx.fill();
    cx.font = F(26, 700); cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(pet.icon, 0, 0);
    cx.restore();
  }
  function star(x, y, r) {
    cx.save(); cx.translate(x, y); cx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r;
      cx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    cx.closePath(); cx.fill(); cx.restore();
  }

  function blotXY(b) {
    const x = b.lane * W;
    const y = FIELD_TOP + clamp(b.progress, -0.2, 1) * (FIELD_BOT - FIELD_TOP);
    return { x, y };
  }
  function drawBlot(b, i, big) {
    const { x, y } = blotXY(b);
    const t = G.time * (2.2 + b.seed);
    const squish = 1 + Math.sin(t * 2.6 + b.seed * 9) * 0.06;
    let sc = big ? 1.7 : 1;
    if (!b.alive) {
      b._deathT = (b._deathT || 0) + G.dt;
      sc *= Math.max(0, 1 - b._deathT * 4);
      if (sc <= 0) return;
    }
    const wob = b.wrongAt > 0 ? Math.sin(G.time * 40) * 4 * b.wrongAt : 0;
    cx.save(); cx.translate(x + wob, y);
    cx.scale(sc * squish, sc / squish);
    // body
    cx.fillStyle = b.wrongAt > 0.3 ? "#5a2440" : PAL.blot;
    cx.beginPath(); cx.ellipse(0, 0, 46, 38, 0, 0, 7); cx.fill();
    // drips
    cx.beginPath(); cx.ellipse(-26, 22, 9, 12, 0.4, 0, 7); cx.ellipse(24, 24, 7, 10, -0.4, 0, 7); cx.fill();
    cx.fillStyle = PAL.blotHi;
    cx.beginPath(); cx.ellipse(-14, -14, 14, 10, -0.5, 0, 7); cx.fill();
    // eyes (blink on seed timer)
    const blink = (Math.sin(G.time * 0.9 + b.seed * 20) > 0.97);
    cx.fillStyle = "#fff";
    if (blink) { cx.fillRect(-20, -6, 14, 3); cx.fillRect(6, -6, 14, 3); }
    else {
      cx.beginPath(); cx.arc(-13, -5, 8, 0, 7); cx.arc(13, -5, 8, 0, 7); cx.fill();

  function drawHubBG() {

  // ---------------- Run event plumbing --------------------------
  function bankCoins(n, x, y) {
    if (!n) return;
    G.profile.coins += n;
    spCoins(x, y, clamp(Math.round(n / 2), 3, 14));
  }
  function handleRunEvents() {
    const evs = G.run.drainEvents();
    const R = G.run.snapshot();
    for (const e of evs) {
      switch (e.t) {
        case "floorStart": {
          const names = { battle: "Battle", challenge: "Challenge ⭐", treasure: "Treasure", rest: "Rest", boss: "Boss" };
          G.banner = { text: `Floor ${e.floor} — ${names[e.kind] || ""}`, t: 1.4 };
          if (e.kind === "challenge") toast("Harder words, double coins!");
          break;
        }
        case "speak": {
          TTS.speak(e.word);   // enhancement only — never the sole channel
          break;
        }
        case "wrong": {
          // the surge: everything lurches closer, guessing costs runway
          Audio2.play("wrong"); shake(6); vib(25);
          toast("Careful! They crept closer");
          break;
        }
        case "shieldUsed": {
          Audio2.play("fanfare"); spSparkle(W / 2, 200, PAL.mint, 18, 90);
          toast("🛡️ Second chance! Saved you");
          break;
        }
        case "owl": {
          toast(`🦉 The owl says it starts with "${e.ch}"`);
          break;
        }
        case "dragonet": {
          toast(`🐉 Dragonet burned away the "${e.ch}"`);
          Audio2.play("zap");
          break;
        }
        case "storyPage": { toast("📖 You found a story page!"); break; }
        case "bought": {
          Audio2.play("fanfare"); spSparkle(W / 2, 420, PAL.gold, 22, 100);
          toast(`${e.label}!`);
          break;
        }
        case "tooPoor": {
          Audio2.play("wrong");
          toast(`Not enough coins — needs ${e.price}`);
          break;
        }
        case "skip": {
          toast(`⏭️ Skipped "${e.word}"`);
          Audio2.play("tick");
          break;
        }
        case "rhymeStart": { G.banner = { text: "Rhyme Time!", t: 1.2 }; break; }
        case "rhymeHit": {
          Audio2.play("zap"); spSparkle(W / 2, 300, PAL.mint, 12, 90); vib(8);
          if (e.left === 0) { Audio2.play("fanfare"); spConfetti(24); }
          break;
        }
        case "rhymeMiss": { Audio2.play("wrong"); shake(5); vib(20); toast(`"${e.word}" doesn't rhyme`); break; }
        case "puzzleMiss": { break; }   // coins shrink; handled by the mode's own toast
        case "oddStart": { G.banner = { text: "Odd One Out!", t: 1.2 }; break; }
        case "oddHit": { Audio2.play("fanfare"); spConfetti(26); vib(10); break; }
        case "oddMiss": { Audio2.play("wrong"); shake(6); vib(25); toast(`"${e.word}" fits the group`); break; }
        case "sentenceStart": { G.banner = { text: "Sentence Gate!", t: 1.2 }; break; }
        case "sentenceHit": { Audio2.play("fanfare"); spConfetti(26); vib(10); break; }
        case "sentenceMiss": { Audio2.play("wrong"); shake(6); vib(25); toast("That doesn't fit — try again"); break; }
        case "flashStart": { G.banner = { text: "Speedy Flash!", t: 1.0 }; break; }
        case "flashHide": { Audio2.play("tick"); break; }
        case "flashHit": { Audio2.play("fanfare"); spConfetti(24); vib(10); break; }
        case "flashMiss": { Audio2.play("wrong"); shake(6); vib(25); toast(`It was not "${e.word}"`); break; }
        case "reviewWin": {
          Audio2.play("fanfare"); spSparkle(W / 2, 300, PAL.gold, 20, 110);
          toast(`You caught a tricky word! +${e.coins}`);
          break;
        }
        case "spellWord": {
          // Fires exactly when new tiles are installed — safe to swap display.
          G.spellShown = e.word;
          // Always show the word first, then hide it. TTS is a bonus on top.
          G.reveal = { word: e.word, t: 1.2 };
          break;
        }
        case "zap": {
          const b = R.blots[e.idx];
          if (b) {
            const { x, y } = blotXY(b);
            zapLine = { x1: W / 2 + 30, y1: WIZ_Y - 20, x2: x, y2: y, t: 0.15 };
            spSparkle(x, y, PAL.mint, 14);
            spButterfly(e.word, x, y);
            bankCoins(e.coins, x, y);
          }
          G.wizPose = 0.3;
          Audio2.play("zap"); setTimeout(() => Audio2.play("pop"), 60);
          if (e.streak >= 2) Audio2.play("streak", { n: clamp(e.streak - 2, 0, 4) });
          vib(8);
          break;
        }
        case "wrong": Audio2.play("wrong"); vib([15, 30, 15]); break;
        case "reach": {
          spInk(W / 2, WIZ_Y - 30, 14); shake(6);
          Audio2.play("heart"); vib(60);
          break;
        }
        case "stormReady": Audio2.play("chargeUp"); G.stormPulse = 1; break;
        case "storm": {
          dimT = 0.35;
          for (const b of R.blots) { const p = blotXY(b); spSparkle(p.x, p.y, "#fff", 12); }
          bankCoins(e.coins, W / 2, 400);
          spConfetti(24);
          Audio2.play("storm"); vib([20, 40, 20, 40, 20]);
          break;
        }
        case "tileTap": Audio2.play("tick"); vib(6); break;
        case "backspace": Audio2.play("tickLow"); break;
        case "spellFail": Audio2.play("wrong"); G.spellShake = 0.4; vib([15, 30, 15]); break;
        case "hintsOn": spSparkle(W / 2, 430, PAL.gold, 16); break;
        case "spellSolve": {
          spButterfly(e.word, W / 2, 420);
          bankCoins(e.coins, W / 2, 430);
          Audio2.play("zap"); setTimeout(() => Audio2.play("coin"), 80);
          vib(10);
          break;
        }
        case "bossStart": Audio2.play("boom"); shake(5); break;
        case "bossHit": {
          spSparkle(W / 2, 200, PAL.mint, 22); spConfetti(10);
          Audio2.play("bossHit"); shake(4); vib(30);
          break;
        }
        case "bossDown": {
          spConfetti(70); bankCoins(e.coins, W / 2, 220);
          Audio2.play("fanfare"); vib([30, 50, 30, 50, 60]);
          toast("📖 A story page! Read it in the Bookshelf");
          break;
        }
        case "floorClear": {
          bankCoins(e.coins, W / 2, 380);
          Audio2.play("fanfare");
          break;
        }
        case "doors": Store.save(); break;
        case "doorChosen": Audio2.play("door"); break;
        case "treasure": {
          bankCoins(e.coins, W / 2, 430);
          Audio2.play("chest"); spSparkle(W / 2, 430, PAL.gold, 24); vib(20);
          break;
        }
        case "rest": {
          if (e.healed) { spSparkle(W / 2, WIZ_Y - 40, PAL.heart, 16); Audio2.play("heal"); }
          else { bankCoins(e.coins, W / 2, 430); Audio2.play("coin"); }
          break;
        }
        case "heartLost": break;
        case "runEnd": finishRun(e.summary); break;
      }
    }
  }

  function startRun() {
    G.preBest = G.profile.bestFloor;
    G._chaptersBefore = chaptersUnlocked(G.profile);
    G.run = L.createRun({
      tier: G.profile.tier,
      rngSeed: (Date.now() ^ (G.profile.coins * 2654435761)) >>> 0,
      indexObj: G.indexObj,
      mods: L.modsFor(G.profile),
      pouch: (G.profile.reviewPouch || []).slice()
    });
    G.runOver = null;
    setScreen("run");
  }
  function finishRun(sum) {
    const p = G.profile;
    p.runsPlayed++;
    p.wordsFreed += sum.wordsFreed.length;
    p.bestFloor = Math.max(p.bestFloor, sum.floor);
    p.storyPages = (p.storyPages || 0) + (sum.storyPages || 0);
    for (const a of sum.answers) L.recordAnswer(p, a.tier, !!a.ok);
    for (const w of sum.wordLog || []) L.recordWordResult(p, w.word, w.ok);
    // review pouch: words they missed go in, words they nailed come out
    for (const w of sum.reviewPouch) L.pouchAdd(p, w, sum.floor);
    for (const w of sum.pouchCleared || []) L.pouchClear(p, w);
    // adaptive difficulty, invisible to the child
    const adapt = L.adaptTier(p);
    G.runOver = Object.assign({}, sum, {
      tierMoved: adapt.moved,
      newChapters: chaptersUnlocked(p) - (G._chaptersBefore || 0)
    });
    Store.save();
    setTimeout(() => setScreen("result"), 700);
  }
  function chaptersUnlocked(p) {
    return DATA.CHAPTERS.filter(c => c.pages <= (p.storyPages || 0)).length;
  }

  function renderSentence(R) {
    const s2 = R.sentence;

    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (cx.measureText(test).width > W - 110 && line) { lines.push(line); line = w; }

  // ---------------- The Bookshelf (M3) ---------------------------
  function scrBookshelf() {
    drawHubBG();
    const p = G.profile;
    const pages = p.storyPages || 0;
    const unlocked = chaptersUnlocked(p);

    cx.fillStyle = "rgba(28,20,48,0.94)";
    cx.fillRect(0, 0, W, 150);
    panel(W / 2 - 120, 26, 240, 46, 14);
    cx.fillStyle = PAL.ink; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.font = F(22, 900);
    cx.fillText("The Bookshelf", W / 2, 50);
    cx.fillStyle = PAL.gold; cx.font = F(16, 800);
    cx.fillText(`📖 ${pages} story ${pages === 1 ? "page" : "pages"} — beat bosses to find more`, W / 2, 96);
    cx.fillStyle = "rgba(246,234,210,0.6)"; cx.font = F(13, 700);
    cx.fillText(`${unlocked} of ${DATA.CHAPTERS.length} chapters unlocked`, W / 2, 122);

    if (G.readingChapter != null) { renderChapter(G.readingChapter); return; }

    const rowH = 62, VX = 16, VY = 156, VW = W - 32, VH = H - 156 - 100;
    const contentH = DATA.CHAPTERS.length * rowH;
    const maxScroll = Math.max(0, contentH - VH);
    if (G.scrollVel && !G.drag) {
      G.shopScroll = clamp((G.shopScroll || 0) + G.scrollVel * G.dt, 0, maxScroll);
      G.scrollVel *= 0.9;
      if (Math.abs(G.scrollVel) < 8) G.scrollVel = 0;
    }
    G.shopScroll = clamp(G.shopScroll || 0, 0, maxScroll);
    const sc = G.shopScroll;
    G.scrollView = { x: VX, y: VY, w: VW, h: VH, contentH };

    cx.save();
    cx.beginPath(); rr(cx, VX, VY, VW, VH, 14); cx.clip();
    cx.fillStyle = "rgba(28,20,48,0.82)";

    // --- header (opaque, so nothing shows through) ---

    panel(W / 2 - 120, 26, 240, 46, 14);

    cx.fillText(titles[tab], W / 2, 50);
    // live preview of the wizard, wearing what they own
    drawWizard(56, 138, 0.85, ROBES[p.colour] || ROBES.teal, null, p.equipped);
    // coins
    cx.textAlign = "right"; cx.font = F(21, 900); cx.fillStyle = PAL.gold;

    drawCoin(W - 32, 104, 11);
    cx.textAlign = "center"; cx.font = F(12, 700); cx.fillStyle = "rgba(246,234,210,0.5)";
    cx.fillText("drag to scroll", W - 66, 142);

    // --- scrolling viewport ---
    const items = L.catalogue(tab);
    const rowH = 76, VX = 16, VY = 182, VW = W - 32, VH = H - 182 - 104;
    const contentH = items.length * rowH;
    const maxScroll = Math.max(0, contentH - VH);
    // momentum glide
    if (G.scrollVel && !G.drag) {
      G.shopScroll = clamp((G.shopScroll || 0) + G.scrollVel * G.dt, 0, maxScroll);
      G.scrollVel *= 0.9;
      if (Math.abs(G.scrollVel) < 8) G.scrollVel = 0;
    }
    G.shopScroll = clamp(G.shopScroll || 0, 0, maxScroll);
    const sc = G.shopScroll;
    // publish the viewport so the input layer knows this screen scrolls
    G.scrollView = { x: VX, y: VY, w: VW, h: VH, contentH };

    cx.save();
    cx.beginPath(); rr(cx, VX, VY, VW, VH, 14); cx.clip();
    cx.fillStyle = "rgba(28,20,48,0.82)";
    cx.fillRect(VX, VY, VW, VH);

    items.forEach((it, i) => {
      const y = VY + i * rowH - sc;
      if (y > VY + VH || y + rowH < VY) return;    // offscreen, skip
      const owned = L.owns(p, it.id);
      const afford = p.coins >= it.price;
      const equipped = tab === "pets" ? p.equipped.pet === it.id : p.equipped[it.kind] === it.id;

      cx.fillStyle = owned ? "rgba(127,224,212,0.12)" : "rgba(246,234,210,0.08)";
      rr(cx, VX + 8, y + 4, VW - 16, rowH - 12, 12); cx.fill();
      if (equipped) {
        cx.strokeStyle = PAL.mint; cx.lineWidth = 2;
        rr(cx, VX + 8, y + 4, VW - 16, rowH - 12, 12); cx.stroke();
      }
      // swatch or icon
      if (tab === "wardrobe") {
        cx.fillStyle = it.c;
        rr(cx, VX + 20, y + 18, 38, 38, 10); cx.fill();
      } else {
        cx.font = F(30, 700); cx.textAlign = "center"; cx.textBaseline = "middle";
        cx.fillText(it.icon, VX + 39, y + 37);
      }
      cx.textAlign = "left"; cx.textBaseline = "middle";
      cx.fillStyle = PAL.parch; cx.font = F(17, 800);
      cx.fillText(it.label, VX + 72, y + 27);
      cx.font = F(12, 600); cx.fillStyle = "rgba(246,234,210,0.6)";
      cx.fillText(it.blurb || kindName(it.kind), VX + 72, y + 47);

      // buy / wear button — clear of the slider
      const bw = 78, bh = 42, bx = VX + VW - bw - 34, by = y + 12;
      cx.fillStyle = owned ? (equipped ? "rgba(127,224,212,0.3)" : PAL.mint)
        : afford ? PAL.gold : "rgba(246,234,210,0.14)";
      rr(cx, bx, by, bw, bh, 12); cx.fill();
      cx.textAlign = "center"; cx.textBaseline = "middle";
      cx.fillStyle = owned || afford ? PAL.ink : "rgba(246,234,210,0.5)";
      if (owned) {
        cx.font = F(14, 900);
        cx.fillText(equipped ? "Wearing" : "Wear", bx + bw / 2, by + bh / 2);
      } else {
        drawCoin(bx + 18, by + bh / 2, 9);
        cx.font = F(17, 900);
        cx.fillText(String(it.price), bx + 48, by + bh / 2 + 1);
      }
      // only hit-testable while actually visible in the viewport
      if (by + bh > VY && by < VY + VH) {
        hits.push({
          x: bx - 2, y: Math.max(VY, by - 2), w: bw + 4, h: bh + 4, id: "shop" + it.id, fn: () => {
            if (owned) { L.equip(p, it.id); Store.save(); Audio2.play("tick"); }
            else if (L.buy(p, it)) {
              Store.save(); Audio2.play("fanfare"); spConfetti(30);
              G.dispCoins = p.coins;
              toast(`${it.label} — yours!`);
            } else { Audio2.play("wrong"); toast(`${it.price - p.coins} more coins needed`); }
          }
        });
      }
    });
    cx.restore();

    // --- right-hand slider ---
    if (maxScroll > 0) {
      const tx = VX + VW - 16, ty = VY + 8, th = VH - 16;
      cx.fillStyle = "rgba(246,234,210,0.14)";
      rr(cx, tx - 5, ty, 10, th, 5); cx.fill();
      const thumbH = Math.max(52, th * (VH / contentH));
      const thumbY = ty + (th - thumbH) * (sc / maxScroll);
      cx.fillStyle = G.drag && G.drag.onThumb ? PAL.gold : PAL.mint;
      cx.save();
      cx.shadowColor = "rgba(0,0,0,0.4)"; cx.shadowBlur = 6;

      cx.strokeStyle = "rgba(23,16,41,0.35)"; cx.lineWidth = 2;
      for (const o of [-4, 0, 4]) {
        cx.beginPath();
        cx.moveTo(tx - 4, thumbY + thumbH / 2 + o);
        cx.lineTo(tx + 4, thumbY + thumbH / 2 + o);
        cx.stroke();

    }

    button(W / 2 - 110, H - 88, 220, 58, "Back to shop", () => {
      G.shopScroll = 0; G.scrollVel = 0; G.scrollView = null; setScreen("hub");

    if (R.phase === "wave") renderWave(R);
    else if (R.phase === "spell") renderSpell(R, false);
    else if (R.phase === "boss") renderSpell(R, true);
    else if (R.phase === "doors") renderDoors(R);
    else if (R.phase === "treasure") renderTreasure(R);
    else if (R.phase === "rest") renderRest(R);
    else if (R.phase === "shop") renderMerchant(R);
    else if (R.phase === "rhyme") renderRhyme(R);
    else if (R.phase === "odd") renderOdd(R);
    else if (R.phase === "sentence") renderSentence(R);

    renderHUD(R);
    if (dimT > 0) {

      cx.fillStyle = PAL.ink; cx.textAlign = "center";
      cx.font = F(24, 900);
      cx.fillText(G.banner.text, W / 2, lerp(-70, 118, slide) + 31);
      cx.restore();
      if (G.banner.t <= 0) G.banner = null;

  function renderPrompt(R) {
    panel(30, 118, W - 60, 92, 18);
